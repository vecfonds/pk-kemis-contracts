openapi: 3.1.0
info:
  title: PkKemis gateway
  version: 0.1.1
  summary: Cửa vào duy nhất từ web (BFF) và trình duyệt tới các service (Spring Cloud Gateway).
  description: |
    0.1.1 (lát `13g`, sau lượt soát M13; đối chiếu `pk-kemis-gateway` `3323e6d`): chỉ ghi điều gateway **đã trả, đã làm** mà 0.1.0 chưa ghi; không
    thêm mã lỗi (`Problem.code` vẫn chín giá trị), không bỏ hay đổi nghĩa điều gì:
    - 413 `payload_too_large` cả ở `GET`, `DELETE` qua API (giới hạn thân áp cho mọi phương thức; khai `Content-Length` quá lớn thì 413 ngay);
    - 502, 503 (kèm `Retry-After`), 504 ở các tuyến ảnh khi kho (Garage) trả hỏng, không nối được hay chậm;
    - thùng giới hạn riêng cho `refresh`, `logout` của web khi thiếu `X-Forwarded-For` (`x-rate-limits`, nhóm `bffnoip`); nhóm `auth` luôn theo
      địa chỉ khách, kể cả khi có token;
    - header bị bỏ: mọi `X-User-*`, `Cookie`; ở `/realtime/` và các tuyến ảnh thêm `Authorization` và **mọi** `x-amz-*` (URL ký sẵn mang chữ ký
      trong chuỗi truy vấn);
    - 503 cũng là mã khi không đọc được JWKS của identity, hay khi tắt cho-qua của kiểm thu hồi (`GATEWAY_REVOCATION_FAIL_OPEN=false`) mà Redis
      không trả lời.

    0.1.0 (docs/backend/M13-GATEWAY-MESSAGING.md, lát `13a`): service mới `pk-kemis-gateway`, Spring Cloud Gateway bản WebFlux (Java 25,
    Spring Boot, Maven; PLAN.md mục 6.2). Hợp đồng này chỉ ghi điều gateway **tự làm** (định tuyến, khóa BFF, kiểm token, chặn token đã thu hồi,
    giới hạn tần suất, header, lỗi riêng của gateway). Thân yêu cầu và phản hồi của từng đường là của hợp đồng service (identity.yaml,
    learning.yaml, classroom.yaml, commerce.yaml, social.yaml): gateway chuyển nguyên, không đổi một byte.

    **Hai kiểu người gọi, một cổng (`:8080` trong mạng Compose, publish ra máy ở `GATEWAY_PORT`, mặc định 3001):**
    - **web (BFF)** gọi API: `/<service>/v1/**`, luôn kèm header `X-Bff-Key` (bí mật chung giữa web và gateway). Thiếu hay sai khóa: 404
      `not_found` (với người ngoài, API không tồn tại). Trình duyệt **không bao giờ** gọi API qua gateway: token nằm trong cookie httpOnly của
      web.
    - **trình duyệt** chỉ dùng hai thứ: kết nối thời gian thực `/realtime/` (Socket.IO, chỉ WebSocket, xác thực bằng vé dùng một lần; social.yaml
      `POST /v1/realtime/tickets`, asyncapi/realtime.yaml) và URL ký sẵn của kho ảnh (`/pk-community-incoming/**`, `/pk-community-media/**`,
      `/pk-message-media/**`, chuyển tới kho S3 với `Host` giữ nguyên để chữ ký khớp). Không cần khóa BFF.

    **`/realtime/`** (không có trong `paths` vì là bắt tay WebSocket, mô tả đầy đủ ở asyncapi/realtime.yaml): trình duyệt mở bằng socket.io-client
    v4 (`path: "/realtime"`, `transports: ["websocket"]`). Gateway chỉ nhận yêu cầu nâng cấp WebSocket (`EIO=4&transport=websocket`;
    long-polling: 404 `not_found`, vì polling cần phiên dính một máy), kiểm `Origin` đúng địa chỉ web (`PUBLIC_URL`; sai: 403
    `origin_forbidden`), giới hạn số lần bắt tay theo địa chỉ khách (429), rồi chuyển tới `ws://social:8080/realtime/`. Gateway **không** đọc
    vé: vé đi trong gói CONNECT của Socket.IO sau khi nâng cấp (không nằm trong URL, không vào log); social đổi vé lấy người dùng. Không cần khóa
    BFF, không có token. Khung từ trình duyệt tối đa 4 KB (kết nối chỉ để đẩy xuống).

    **Định tuyến theo tiền tố tên service.** Đường trong hợp đồng giữ nguyên; gateway bỏ tiền tố rồi chuyển: `/identity/v1/me` →
    `http://identity:8080/v1/me`. Có tiền tố vì vài đường **trùng nhau giữa các service** (`/v1/me/privacy` ở identity và social;
    `/v1/admin/audit-log` ở identity, classroom, commerce, social; `/v1/courses` ở learning và classroom), nên không thể định tuyến `/v1/**` theo
    đường như PHASE2 viết. Web chỉ đổi biến `*_URL` thành `http://gateway:8080/<service>`.
    - **Không bao giờ** chuyển: `/<service>/internal/**`, `/<service>/actuator/**`, `/<service>/health`, `/.well-known/**`, mọi đường khác:
      404 `not_found`. Gateway lấy JWKS của identity qua mạng trong (`http://identity:8080/.well-known/jwks.json`), không mở nó ra ngoài.

    **Token.** Có `Authorization: Bearer` thì gateway kiểm chữ ký RS256 bằng JWKS của identity (đệm 5 phút, `kid` lạ thì đọc lại), `iss` =
    `pk-kemis-identity`, `exp` (lệch tối đa 60 giây); sai: 401 `token_invalid`. Rồi kiểm **thu hồi** trên Redis (một lệnh `MGET`):
    `rv:u:<sub>` (token có claim `tv` nhỏ hơn số này) hay `rv:s:<sid>` (phiên bị thu hồi): 401 `token_revoked` (identity.yaml 0.10.0). Không có
    token thì gateway chuyển tiếp, service tự quyết đường nào cần đăng nhập (`security: []` trong hợp đồng của nó). Service vẫn tự kiểm chữ ký JWT
    (không tin đầu vào chỉ vì đến từ gateway); gateway **không** thêm header danh tính (`X-User-*`) nào.

    **Header.** Gateway xóa khỏi mọi yêu cầu đến: `X-Bff-Key` (sau khi kiểm), `X-Internal-Key`, `X-User-Id`, `X-User-Role`, `Forwarded`, và với
    yêu cầu không có khóa BFF thì cả `X-Forwarded-*` (rồi tự đặt `X-Forwarded-For` bằng địa chỉ socket). Yêu cầu có khóa BFF giữ nguyên
    `X-Forwarded-For` web đã đặt (địa chỉ thật của khách; identity chặn dò mật khẩu theo đó). Mọi yêu cầu có `X-Request-Id` (giữ của web nếu
    đúng dạng, không thì gateway sinh UUID), trả lại trong phản hồi và ghi log. Log không có `Authorization`, cookie, chuỗi truy vấn của URL ảnh.
    Từ 0.1.1 ghi rõ thêm: gateway xóa **mọi** header bắt đầu bằng `X-User-` (không chỉ hai cái trên) và `Cookie` ở mọi tuyến (cookie httpOnly
    của web cũng tới host này vì cookie không phân biệt cổng); ở `/realtime/` và các tuyến ảnh còn xóa `Authorization` và mọi header `x-amz-*`.
    Chuỗi truy vấn không đổi.

    **Giới hạn tần suất** (Redis, `RequestRateLimiter` kiểu thùng token; số mặc định, đổi bằng biến; stack kiểm thử nới ra): người đã đăng nhập
    theo `sub` (15 yêu cầu/giây, dồn tối đa 120); chưa đăng nhập theo địa chỉ khách (5/giây, dồn 30), riêng `/identity/v1/auth/**` (1/giây,
    dồn 20); `/realtime/` theo địa chỉ khách (1 lần bắt tay/giây, dồn 20); ảnh theo địa chỉ khách (10/giây, dồn 60). Quá: 429 `too_many_requests`
    kèm `Retry-After`. Giới hạn theo nghiệp vụ (lời mời mỗi ngày, tin nhắn mỗi phút…) vẫn ở service. Bảng đủ các nhóm ở `x-rate-limits` (0.1.1):
    - `/identity/v1/auth/**` luôn dùng nhóm `auth` theo địa chỉ khách, **kể cả khi có token hợp lệ** (không dùng thùng theo `sub`).
    - "Địa chỉ khách" của yêu cầu có khóa BFF là mục đầu của `X-Forwarded-For` nếu đúng dạng địa chỉ IP; thiếu hay sai dạng thì là địa chỉ socket,
      tức chính máy web. Khi đó `POST /identity/v1/auth/refresh` và `/logout` dùng **một thùng chung riêng** (nhóm `bffnoip`, gấp 10 lần `auth`:
      mặc định 10/giây, dồn 200) để việc làm mới token của mọi người không chen nhau vào một thùng `auth`, và gateway ghi cảnh báo vào log (web
      phải luôn gửi `X-Forwarded-For`). Đăng nhập, đăng ký, quên mật khẩu… thiếu header vẫn ở thùng `auth` chặt (theo địa chỉ của web).

    **Redis không trả lời:** giới hạn tần suất cho qua; kiểm thu hồi cho qua (token vẫn được kiểm chữ ký và hạn, như trước M13) và ghi log lỗi,
    `/actuator/health` báo `redis: DOWN` (câu hỏi 14 của M13-GATEWAY-MESSAGING.md: cho qua hay chặn).

    **Kích thước, thời gian:** thân yêu cầu API tối đa 1 MB (riêng `/learning/v1/admin/**` 16 MB), ảnh 5 MB; quá: 413 `payload_too_large`. Chờ
    service tối đa 20 giây (504 `gateway_timeout`); service không nối được: 503 `service_unavailable`.
    - Giới hạn thân áp cho **mọi phương thức** của API, kể cả `GET`, `DELETE` (0.1.1). `Content-Length` khai lớn hơn giới hạn: 413 ngay, trước khi
      kiểm token và giới hạn tần suất (sau khóa BFF: thiếu khóa vẫn là 404), thân không được đọc.
    - Thân không khai độ dài (chunked) được đếm khi chuyển và bị cắt khi vượt: thường 413; nếu service đã đóng kết nối trước đó thì có thể là 502
      hay 503. Web luôn gửi `Content-Length`.
    - Các tuyến ảnh dùng cùng thời gian chờ và cùng mã khi kho không nối được (503 kèm `Retry-After`), chậm (504) hay trả hỏng (502), 0.1.1.
    - `/realtime/`: gateway nâng cấp WebSocket với trình duyệt **trước** rồi mới nối tới social (Spring Cloud Gateway 5.0), nên social không nối
      được thì không có mã HTTP: kết nối mở rồi đóng ngay, trình duyệt nối lại theo asyncapi/realtime.yaml.

    Mọi lỗi **của gateway** theo RFC 9457 (`application/problem+json`), cùng dạng với các service, `detail` tiếng Việt. Lỗi của service chuyển
    nguyên. Chỉ thêm, không xóa hay đổi nghĩa (README của contracts).
servers:
  - url: http://gateway:8080
    description: |
      Trong mạng Compose (web gọi API). Cùng cổng được publish ra máy ở `GATEWAY_PORT` (mặc định 3001, địa chỉ `GATEWAY_PUBLIC_URL`) cho trình
      duyệt: chỉ `/realtime/` và URL ảnh. Khi lên AWS là cùng tên miền với web, bộ cân bằng tải chia theo đường.
security:
  - bffKey: []
    bearerAuth: []
  - bffKey: []
tags:
  - name: api
    description: API của các service, chỉ web gọi (kèm `X-Bff-Key`)
  - name: realtime
    description: Kết nối thời gian thực của trình duyệt (Socket.IO qua WebSocket)
  - name: media
    description: URL ký sẵn của kho ảnh (S3), trình duyệt tải lên và xem

x-routes:
  - { prefix: /identity/v1/, target: "http://identity:8080/v1/", caller: web, contract: openapi/identity.yaml }
  - { prefix: /learning/v1/, target: "http://learning:8080/v1/", caller: web, contract: openapi/learning.yaml }
  - { prefix: /classroom/v1/, target: "http://classroom:8080/v1/", caller: web, contract: openapi/classroom.yaml }
  - { prefix: /commerce/v1/, target: "http://commerce:8080/v1/", caller: web, contract: openapi/commerce.yaml }
  - { prefix: /social/v1/, target: "http://social:8080/v1/", caller: web, contract: openapi/social.yaml }
  - { prefix: /realtime/, target: "ws://social:8080/realtime/", caller: browser, contract: asyncapi/realtime.yaml }
  - { prefix: /pk-community-incoming/u/, target: "http://garage:3900/pk-community-incoming/u/", caller: browser, methods: [PUT, OPTIONS] }
  - { prefix: /pk-community-media/m/, target: "http://garage:3900/pk-community-media/m/", caller: browser, methods: [GET, HEAD, OPTIONS] }
  - { prefix: /pk-message-media/m/, target: "http://garage:3900/pk-message-media/m/", caller: browser, methods: [GET, HEAD, OPTIONS] }

# Từ 0.1.1: các thùng giới hạn tần suất của gateway (Redis, thùng token của Spring Cloud Gateway; khóa Redis
# `request_rate_limiter.{<group>.<key>}.tokens|timestamp`, asyncapi/realtime.yaml `x-redis-keys`). `default` là "tốc độ mỗi giây,dồn tối đa".
# Mỗi yêu cầu rơi vào đúng một nhóm; quá thì 429 `too_many_requests` kèm `Retry-After` (giây, ít nhất 1). Redis không trả lời: cho qua.
x-rate-limits:
  - { group: user, key: "sub của token", default: "15,120", env: GATEWAY_RATE_USER, applies: "/<service>/v1/** có token hợp lệ, trừ /identity/v1/auth/**" }
  - { group: anon, key: "địa chỉ khách", default: "5,30", env: GATEWAY_RATE_ANON, applies: "/<service>/v1/** không có token, trừ /identity/v1/auth/**" }
  - { group: auth, key: "địa chỉ khách", default: "1,20", env: GATEWAY_RATE_AUTH, applies: "/identity/v1/auth/**, có hay không có token" }
  - group: bffnoip
    key: "địa chỉ socket (máy web)"
    default: "10,200"
    env: "GATEWAY_RATE_AUTH, nhân 10 cả tốc độ lẫn dồn"
    applies: "/identity/v1/auth/refresh và /identity/v1/auth/logout có khóa BFF nhưng mục đầu của X-Forwarded-For thiếu hay không phải địa chỉ IP"
    note: "Một thùng chung cho mọi người đi qua cùng một máy web; gateway ghi cảnh báo mỗi lần. Các đường /identity/v1/auth/** khác vẫn ở `auth`."
  - { group: rt, key: "địa chỉ socket", default: "1,20", env: GATEWAY_RATE_REALTIME, applies: "bắt tay /realtime/" }
  - { group: media, key: "địa chỉ socket", default: "10,60", env: GATEWAY_RATE_MEDIA, applies: "mọi tuyến ảnh (tải lên và đọc)" }

paths:
  /{service}/v1/{operationPath}:
    parameters:
      - name: service
        in: path
        required: true
        description: Tên service; gateway bỏ đoạn này rồi chuyển phần còn lại (`/v1/...`) tới service đó.
        schema: { type: string, enum: [identity, learning, classroom, commerce, social] }
      - name: operationPath
        in: path
        required: true
        description: Phần còn lại của một đường trong hợp đồng của service (có thể nhiều đoạn, có `/`), kèm chuỗi truy vấn như service nhận.
        schema: { type: string, maxLength: 2000 }
      - { $ref: "#/components/parameters/BffKey" }
      - { $ref: "#/components/parameters/RequestId" }
      - { $ref: "#/components/parameters/ForwardedFor" }
    get:
      tags: [api]
      operationId: proxyGet
      x-slice: 13a
      summary: Chuyển một yêu cầu GET tới service
      responses:
        "200": { $ref: "#/components/responses/Passthrough" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NoRoute" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    post:
      tags: [api]
      operationId: proxyPost
      x-slice: 13a
      summary: Chuyển một yêu cầu POST tới service
      requestBody: { $ref: "#/components/requestBodies/Passthrough" }
      responses:
        "200": { $ref: "#/components/responses/Passthrough" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NoRoute" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    put:
      tags: [api]
      operationId: proxyPut
      x-slice: 13a
      summary: Chuyển một yêu cầu PUT tới service
      requestBody: { $ref: "#/components/requestBodies/Passthrough" }
      responses:
        "200": { $ref: "#/components/responses/Passthrough" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NoRoute" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    patch:
      tags: [api]
      operationId: proxyPatch
      x-slice: 13a
      summary: Chuyển một yêu cầu PATCH tới service
      requestBody: { $ref: "#/components/requestBodies/Passthrough" }
      responses:
        "200": { $ref: "#/components/responses/Passthrough" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NoRoute" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    delete:
      tags: [api]
      operationId: proxyDelete
      x-slice: 13a
      summary: Chuyển một yêu cầu DELETE tới service
      responses:
        "200": { $ref: "#/components/responses/Passthrough" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NoRoute" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /pk-community-incoming/u/{mediaId}:
    put:
      tags: [media]
      operationId: uploadToStore
      x-slice: 13a
      summary: Tải một ảnh lên khu nhận của kho bằng URL ký sẵn
      description: |
        Chỉ để URL `PUT` ký sẵn mà social cấp (social.yaml `requestUpload`, `requestMessageUpload`; máy chủ trong URL là `S3_PUBLIC_ENDPOINT` =
        cổng công khai của gateway) tới được kho. Gateway chuyển nguyên tới kho S3 (Garage ở máy này), **giữ nguyên `Host`** và đường (chữ ký
        SigV4 tính trên cả hai), không đọc thân. Chỉ `PUT` và `OPTIONS` (CORS do kho trả); thân tối đa 5 MB. Kho kiểm chữ ký, hạn, `Content-Type`,
        `Content-Length`.

        Từ 0.1.1 ghi rõ: gateway **bỏ mọi header `x-amz-*`** trình duyệt gửi kèm (ví dụ `x-amz-copy-source`, `x-amz-acl`, `x-amz-tagging`: URL ký
        chỉ ký `content-length`, `content-type`, `host`, nên các header không ký đó có thể khiến kho chép một tệp khác mà khóa của app đọc được),
        cùng `Authorization` và `Cookie`. URL ký sẵn mang chữ ký trong chuỗi truy vấn (`X-Amz-Signature`, `X-Amz-SignedHeaders`…), không bao giờ
        ở header, nên việc này không làm hỏng URL đúng. Vì vậy social **không được** đưa header `x-amz-*` nào vào `X-Amz-SignedHeaders` của URL
        ký sẵn (kho sẽ thấy thiếu header đã ký và trả 403). Thời gian chờ và lỗi khi kho không nối được như API: 503 kèm `Retry-After`, 504, 502.
      security: []
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Kho đã nhận tệp }
        "403": { description: "Chữ ký sai, hết hạn, header không khớp (lỗi XML của kho, chuyển nguyên)" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /pk-community-media/m/{mediaId}/{file}:
    get:
      tags: [media]
      operationId: readCommunityImage
      x-slice: 13a
      summary: Đọc một ảnh Cộng đồng bằng URL ký sẵn
      description: |
        Như `uploadToStore` nhưng chỉ `GET`, `HEAD`, `OPTIONS`. URL do social ký (1 giờ), chỉ cho người được xem ảnh đó. Gateway cũng bỏ mọi header
        `x-amz-*`, `Authorization`, `Cookie` của trình duyệt (0.1.1). Kho tắt hay chậm: 503 (kèm `Retry-After`), 504 thay cho ảnh (0.1.1); web
        coi như ảnh không tải được.
      security: []
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
        - { $ref: "#/components/parameters/MediaFile" }
      responses:
        "200":
          description: Ảnh WebP
          content:
            image/webp: { schema: { type: string, format: binary } }
        "403": { description: "Chữ ký sai hay hết hạn (lỗi XML của kho, chuyển nguyên)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /pk-message-media/m/{mediaId}/{file}:
    get:
      tags: [media]
      operationId: readMessageImage
      x-slice: 13a
      summary: Đọc một ảnh của tin nhắn bằng URL ký sẵn
      description: |
        Như `readCommunityImage`, bucket của tin nhắn (social.yaml 0.3.0). URL chỉ ký cho thành viên đọc được tin đó. Cùng việc bỏ header
        (`x-amz-*`, `Authorization`, `Cookie`) và cùng 502, 503, 504 khi kho hỏng (0.1.1).
      security: []
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
        - { $ref: "#/components/parameters/MediaFile" }
      responses:
        "200":
          description: Ảnh WebP
          content:
            image/webp: { schema: { type: string, format: binary } }
        "403": { description: "Chữ ký sai hay hết hạn (lỗi XML của kho, chuyển nguyên)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

components:
  securitySchemes:
    bffKey:
      type: apiKey
      in: header
      name: X-Bff-Key
      description: |
        Bí mật chung giữa web và gateway (`GATEWAY_BFF_KEY`, do `scripts/env-secrets.sh` của platform sinh). Chỉ server của web giữ; trình duyệt
        không bao giờ thấy. So sánh thời gian hằng. Thiếu hay sai: 404 `not_found` (không phải 401, để người ngoài không biết có API ở đây).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của identity (identity.yaml), gateway kiểm chữ ký, hạn và thu hồi; service kiểm lại chữ ký.

  parameters:
    BffKey:
      name: X-Bff-Key
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Mã yêu cầu của web (để nối log). Không đúng dạng thì gateway thay bằng UUID mới.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
    ForwardedFor:
      name: X-Forwarded-For
      in: header
      required: false
      description: Địa chỉ thật của khách do web đặt (một địa chỉ). Chỉ được tin khi có khóa BFF; gateway nối thêm địa chỉ của web phía sau.
      schema: { type: string, maxLength: 200 }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaFile:
      name: file
      in: path
      required: true
      schema: { type: string, enum: [full.webp, thumb.webp] }

  requestBodies:
    Passthrough:
      required: false
      description: Thân như hợp đồng của service quy định; gateway chuyển nguyên (tối đa 1 MB, `/learning/v1/admin/**` 16 MB).
      content:
        application/json:
          schema: {}

  headers:
    RequestId:
      description: Mã yêu cầu (của web, hay do gateway sinh).
      schema: { type: string }
    RetryAfter:
      description: Số giây nên chờ trước khi thử lại.
      schema: { type: integer, minimum: 1 }

  responses:
    Passthrough:
      description: Phản hồi của service, chuyển nguyên (mã trạng thái, header, thân), thêm `X-Request-Id`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
    TokenRejected:
      description: |
        Token không dùng được: chữ ký, `iss`, hạn sai (`token_invalid`); hay đã bị thu hồi (`token_revoked`: tài khoản bị khóa, đổi vai trò, đăng
        xuất…). Với `token_revoked` web làm mới token một lần (refresh token còn sống thì phiên tiếp tục, ví dụ sau khi đổi vai trò); làm mới hỏng
        thì người dùng đã bị đăng xuất. Service sau gateway cũng có thể trả 401 `token_invalid` của nó (chuyển nguyên).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            thuHoi:
              value: { type: about:blank, title: Unauthorized, status: 401, code: token_revoked, detail: "Phiên đăng nhập đã kết thúc. Hãy đăng nhập lại." }
    NoRoute:
      description: Không có đường này với người gọi (`not_found`). Cả khi thiếu hay sai `X-Bff-Key`, và mọi `/internal/**`, `/actuator/**`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: |
        Quá giới hạn tần suất của gateway (`too_many_requests`); chờ theo `Retry-After`. Nhóm thùng ở `x-rate-limits`; `Retry-After` là thời gian
        để có lại một lượt (ít nhất 1 giây).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            quaNhanh:
              value: { type: about:blank, title: Too Many Requests, status: 429, code: too_many_requests, detail: "Bạn thao tác quá nhanh. Hãy thử lại sau ít giây." }
    PayloadTooLarge:
      description: |
        Thân yêu cầu quá lớn (`payload_too_large`). Từ 0.1.1 ghi rõ: áp cho mọi phương thức qua API (cả `GET`, `DELETE`); `Content-Length` khai quá
        giới hạn thì trả ngay, trước khi kiểm token và giới hạn tần suất.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            quaLon:
              value: { type: about:blank, title: Content Too Large, status: 413, code: payload_too_large, detail: "Dữ liệu gửi lên quá lớn." }
    BadGateway:
      description: Service (hay kho ảnh, 0.1.1) trả phản hồi hỏng, hay lỗi bất ngờ khi chuyển (`bad_gateway`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: |
        Không nối được service (`service_unavailable`); web hiện "Chưa tải được" như khi service tắt trước M13. Luôn kèm `Retry-After` (5 giây).
        Từ 0.1.1 ghi rõ ba trường hợp khác cùng mã: kho ảnh (Garage) không nối được ở các tuyến ảnh; yêu cầu có token mà gateway không đọc được JWKS
        của identity; yêu cầu có token khi `GATEWAY_REVOCATION_FAIL_OPEN=false` mà Redis không trả lời (mặc định là cho qua, câu 14 của M13).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            chuaNoiDuoc:
              value: { type: about:blank, title: Service Unavailable, status: 503, code: service_unavailable, detail: "Chưa kết nối được máy chủ. Hãy thử lại sau ít giây." }
    GatewayTimeout:
      description: Service (hay kho ảnh, 0.1.1) không trả lời trong 20 giây (`gateway_timeout`; `GATEWAY_RESPONSE_TIMEOUT`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            quaLau:
              value: { type: about:blank, title: Gateway Timeout, status: 504, code: gateway_timeout, detail: "Máy chủ phản hồi quá lâu. Hãy thử lại sau." }

  schemas:
    Problem:
      type: object
      description: Lỗi của chính gateway theo RFC 9457, cùng dạng với các service.
      required: [title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - not_found
            - token_invalid
            - token_revoked
            - too_many_requests
            - payload_too_large
            - origin_forbidden
            - bad_gateway
            - service_unavailable
            - gateway_timeout
        detail: { type: string, description: "Thông báo tiếng Việt, hiển thị được cho người dùng." }
