              properties:
                item: { $ref: "#/components/schemas/ExamInput" }
                revision: { type: integer }
      responses:
        "200":
          description: Đề sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExam" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContentConflict" }

  /v1/admin/exams/{examId}/remove:
    post:
      tags: [admin]
      operationId: adminRemoveExam
      x-slice: L2
      summary: Gỡ đề thi (học sinh không thấy nữa; khôi phục được)
      description: Lượt đang mở vẫn nộp được (đồng hồ vẫn chạy). Làm lại khi đã gỡ thì không đổi gì.
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
      responses:
        "200":
          description: Đề sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/exams/{examId}/unremove:
    post:
      tags: [admin]
      operationId: adminUnremoveExam
      x-slice: L2
      summary: Đưa đề đã gỡ trở lại
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
      responses:
        "200":
          description: Đề sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
