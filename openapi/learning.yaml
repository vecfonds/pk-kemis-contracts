openapi: 3.1.0
info:
  title: PkKemis learning
  version: 0.3.1
  summary: Nội dung học, bài tập, đề thi, chấm điểm, sổ cái XP, tiến độ, sổ tay lỗi sai, bảng xếp hạng.
  description: |
    Giai đoạn 1 (docs/backend/M3-LEARNING.md): bộ bài tập và đề thi, lượt làm bài do máy chủ chấm, XP, cấp độ, chuỗi ngày.

    0.3.0 (docs/backend/M6-CONTENT.md): learning sở hữu nội dung học (khóa, chương, bài, ngân hàng câu, bộ bài tập, đề) và công cụ
    soạn của admin; tiến độ bài học; Luyện tập nhanh của bài, luyện nhanh và ôn tập đi qua lượt làm; sổ tay lỗi sai; bảng xếp hạng;
    API nội bộ cho classroom. Mỗi thao tác mới ghi lát cài nó ở `x-slice` (L1–L7); trước lát đó thao tác chưa có.

    0.3.1 (sửa sau soát M6, chỉ thêm): `GET /v1/exercise-sets/{id}`, `GET /v1/exams/{id}` và `GET /v1/questions/{id}` cho học sinh trả
    409 khi khóa sắp ra mắt (`course_coming_soon`) hoặc đề chưa mở (`exam_not_open`), như bắt đầu lượt làm; `ClassWorkResult.first` (tùy chọn);
    bản chụp câu tự soạn lưu theo từng bài (`workId`) chứ không toàn cục.

    - Chỉ thêm, không xóa hay đổi nghĩa của trường đã phát hành.
    - Token là access token của identity (xem identity.yaml); service tự kiểm bằng khóa công khai, không gọi identity.
    - Chỉ học sinh làm bài và có XP; giáo viên và admin đọc được nội dung (403 ở các thao tác còn lại).
    - **Đáp án không rời service trước khi nộp:** đề gửi xuống không có đáp án và lời giải; bộ bài tập trả đáp án của từng câu
      ngay sau khi câu đó được trả lời; đề thi trả đáp án sau khi nộp.
    - Lỗi theo RFC 9457 (`application/problem+json`), cùng dạng với identity.
    - Nội dung học không theo chế độ Normal hay Tu tiên: không trường nào ở đây đổi theo chế độ hiển thị.
    - Nội dung có phiên bản (`version`, tăng ở mọi lần admin lưu). Các thao tác đọc nội dung trả `ETag: "<version>"`; gửi `If-None-Match`
      đúng phiên bản thì nhận 304.
    - `/internal/**` chỉ cho service khác (khóa `X-Internal-Key`), không mở ra ngoài; sai hoặc thiếu khóa là 403.
servers:
  - url: http://learning:8080
    description: Mạng Docker Compose (giai đoạn 1, chưa có gateway)
security:
  - bearerAuth: []
tags:
  - name: content
    description: Bộ bài tập và đề thi (không kèm đáp án)
  - name: attempts
    description: Làm bài, chấm điểm, XP
  - name: progress
    description: XP, cấp độ, chuỗi ngày
  - name: courses
    description: Khóa học, chương, bài học, câu không kèm đáp án (mọi vai trò)
  - name: bank
    description: Ngân hàng câu hỏi kèm đáp án (giáo viên, admin)
  - name: lessons
    description: Tiến độ bài học của học sinh
  - name: mistakes
    description: Sổ tay lỗi sai
  - name: leaderboard
    description: Bảng xếp hạng XP
  - name: admin
    description: Soạn nội dung (admin)
  - name: internal
    description: Chỉ service gọi nhau (X-Internal-Key); không mở ra ngoài

paths:
  /v1/exercise-sets:
    get:
      tags: [content]
      operationId: listExerciseSets
      summary: Các bộ bài tập
      description: Từ 0.3.0 (L1) đọc từ nội dung admin soạn; bộ đã gỡ không có. Hỗ trợ `If-None-Match`.
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Danh sách
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExerciseSetSummary" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/exercise-sets/{setId}:
    get:
      tags: [content]
      operationId: getExerciseSet
      summary: Một bộ bài tập kèm các câu hỏi (không có đáp án)
      parameters:
        - { $ref: "#/components/parameters/SetId" }
      responses:
        "200":
          description: Bộ bài tập
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseSetDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Khóa sắp ra mắt (`course_coming_soon`), với học sinh; giáo viên và admin xem được
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/exams:
    get:
      tags: [content]
      operationId: listExams
      summary: Các đề thi
      description: Từ 0.3.0 (L1) đọc từ nội dung admin soạn; đề đã gỡ không có. Hỗ trợ `If-None-Match`.
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Danh sách
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExamSummary" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/exams/{examId}:
    get:
      tags: [content]
      operationId: getExam
      summary: Một đề thi kèm các câu hỏi (không có đáp án)
      description: |
        Từ 0.3.0 (L4) web không gọi thao tác này cho học sinh trước khi bắt đầu: đề đến cùng lượt làm (`OpenAttempt.questions`) để đồng hồ
        chạy từ lúc thấy đề; trang giới thiệu dùng `ExamSummary`. Hạn chế thao tác này với học sinh là thay đổi phá vỡ, chờ chủ dự án
        (docs/backend/M6-CONTENT.md, câu hỏi 8).

        Từ 0.3.1: học sinh nhận 409 `exam_not_open` khi đề chưa đến giờ mở (`status` = upcoming) và 409 `course_coming_soon` khi khóa sắp
        ra mắt, để không đọc được câu hỏi trước giờ; giáo viên và admin xem được (xem trước).
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
      responses:
        "200":
          description: Đề thi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Đề chưa mở (`exam_not_open`) hoặc khóa sắp ra mắt (`course_coming_soon`), với học sinh
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/attempts:
    post:
      tags: [attempts]
      operationId: startAttempt
      summary: Bắt đầu làm một bộ bài tập hoặc đề thi, hoặc làm tiếp lượt đang mở
      description: |
        Mỗi học sinh chỉ có một lượt đang mở cho mỗi bộ hoặc đề: gọi lại thì trả lượt đó (200), đồng hồ không bắt đầu lại.
        Tối đa 5 lượt đã nộp cho mỗi bộ hoặc đề. Đề thi bỏ dở quá giờ được chấm ngay khi học sinh bắt đầu lại và tính là một lượt; từ 0.3.1 kể cả khi chưa lưu câu nào (nộp 0 điểm, tính là lượt đầu nên mất XP lượt đầu của đề đó; các lượt sau vẫn làm được nhưng không có XP lượt đầu).
        Đề chưa đến giờ mở trả 409 `exam_not_open`.

        Từ 0.3.0:
        - **Đề ghim lúc bắt đầu** (L1): các câu của lượt cố định từ lúc bắt đầu; admin thêm bớt câu sau đó không đổi lượt đang làm.
          `OpenAttempt.questions` trả đề đó, không kèm đáp án.
        - **Loại mới** (L4: `lesson`, `quick`; L5: `review`), không giới hạn số lượt:
          - `lesson`: Luyện tập nhanh của một bài, `refId` là mã bài. Một lượt mở mỗi bài (gọi lại thì làm tiếp).
          - `quick`: luyện nhanh; `refId` gửi `quick`, phạm vi trong `quick`. Máy chủ rút ngẫu nhiên tối đa `quick.count` câu đang dùng
            khớp phạm vi. **Luôn tạo lượt mới (201):** lượt `quick` đang mở của học sinh có câu đã trả lời thì được nộp tự động (giữ XP),
            chưa có câu nào thì bị bỏ.
          - `review`: ôn sổ tay lỗi sai; `refId` gửi `review`, chế độ trong `review`. Một lượt mở mỗi học sinh; gọi lại cùng chế độ thì làm
            tiếp, khác chế độ thì lượt cũ được nộp hoặc bỏ như `quick`. Câu của lượt là các mục đến hạn (`due`, sớm nhất trước) hoặc mọi mục
            chưa nhớ (`all`) lúc bắt đầu.
        - Bộ, đề, bài thuộc khóa sắp ra mắt: 409 `course_coming_soon`. Không có câu nào để làm (bài không có Luyện tập nhanh, phạm vi luyện
          nhanh không có câu, sổ tay không có mục đến hạn): 409 `no_questions`.
        - Đề thi quá `deadline` + 15 giây được coi là đã nộp ở mọi nơi: việc định kỳ mỗi phút chấm nó từ bản nháp (L4), và mọi thao tác đọc
          hay bắt đầu lại cũng chấm nó trước.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartAttemptRequest" }
      responses:
        "200":
          description: Lượt đang mở được làm tiếp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAttempt" }
        "201":
          description: Lượt mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAttempt" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Hết lượt (`attempt_limit_reached`), đề chưa mở (`exam_not_open`), khóa sắp ra mắt (`course_coming_soon`, 0.3.0)
            hoặc không có câu để làm (`no_questions`, 0.3.0)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/attempts/{attemptId}:
    get:
      tags: [attempts]
      operationId: getAttempt
      summary: Một lượt làm của mình
      description: |
        Đang mở thì trả `OpenAttempt`, đã nộp thì trả `AttemptResult`. Lượt của người khác giống như không tồn tại (404).
        Từ 0.3.0: đề thi đã quá `deadline` + 15 giây được chấm từ bản nháp trước rồi trả `AttemptResult` (`timedOut` = true).
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      responses:
        "200":
          description: Lượt làm
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/OpenAttempt" }
                  - { $ref: "#/components/schemas/AttemptResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/attempts/{attemptId}/draft:
    put:
      tags: [attempts]
      operationId: saveDraft
      summary: Lưu bài đề thi đang làm dở
      description: |
        Chỉ cho đề thi. Gộp các câu trả lời vào bản nháp trên máy chủ để tải lại trang vẫn làm tiếp, và để bài vẫn được chấm
        nếu học sinh đóng tab. Quá giờ (cộng 15 giây du di) thì trả 409 `attempt_closed`.
        Bộ bài tập lưu từng câu qua `/answers`.
        Từ 0.3.0 (L4): `flags` (các câu học sinh đánh dấu xem lại) được lưu cùng, thay cả danh sách cũ khi gửi; `OpenAttempt.flags` trả lại.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { $ref: "#/components/schemas/AnswerList" }
                flags:
                  type: array
                  maxItems: 60
                  items: { type: string }
                  description: Mã các câu đang được đánh dấu (0.3.0). Vắng thì giữ danh sách cũ.
      responses:
        "204": { description: Đã lưu }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bài đã nộp hoặc hết giờ (`attempt_closed`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/attempts/{attemptId}/answers:
    post:
      tags: [attempts]
      operationId: answerQuestion
      summary: Trả lời một câu của bộ bài tập và xem đáp án ngay
      description: |
        Chỉ cho bộ bài tập. Mỗi câu chỉ trả lời một lần trong một lượt (409 `already_answered`), để không thử lần lượt từng phương án.
        Đề thi trả 409 `not_available_during_exam`: đáp án chỉ có sau khi nộp.

        Từ 0.3.0 cũng cho `lesson`, `quick` (L4) và `review` (L5). Câu phải trả lời đủ các phần (trắc nghiệm đã chọn, đủ 4 ý Đúng/Sai,
        có đáp án số), không thì 400 `validation_failed`. Phản hồi có thêm:
        - `xp`: XP câu này mang lại khi lượt được nộp (0 nếu không phải lượt đầu của bộ, hoặc với `lesson`/`quick` câu đã từng được trả lời
          trước đây). Chỉ để hiện "+XP" trong lúc làm; XP thật ghi khi nộp.
        - `fresh`: câu chưa từng được học sinh trả lời trước lượt này (`lesson`, `quick`).
        - `mistake` (L5): câu chưa đúng hoàn toàn thì được ghi vào sổ tay lỗi sai và trả mục đó; ở `review` chế độ `due` là mục sau khi
          dời lịch ôn. `null` khi không đổi gì.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answer]
              properties:
                questionId: { type: string }
                answer: { $ref: "#/components/schemas/Answer" }
      responses:
        "200":
          description: Kết quả câu vừa trả lời, kèm đáp án và lời giải
          content:
            application/json:
              schema:
                type: object
                required: [questionId, mark, reveal]
                properties:
                  questionId: { type: string }
                  mark: { $ref: "#/components/schemas/Mark" }
                  reveal: { $ref: "#/components/schemas/Reveal" }
                  xp: { type: integer, minimum: 0, description: "0.3.0: XP câu này mang lại khi nộp lượt." }
                  fresh: { type: boolean, description: "0.3.0: câu chưa từng được trả lời trước lượt này." }
                  mistake:
                    description: "0.3.0 (L5): mục sổ tay lỗi sai vừa ghi hoặc vừa dời lịch; null khi không đổi."
                    oneOf:
                      - { $ref: "#/components/schemas/MistakeEntry" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Đã trả lời câu này (`already_answered`), bài đã đóng (`attempt_closed`) hoặc là đề thi (`not_available_during_exam`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/attempts/{attemptId}/submit:
    post:
      tags: [attempts]
      operationId: submitAttempt
      summary: Nộp bài, chấm điểm và nhận XP
      description: |
        Máy chủ tự chấm theo định dạng đề tốt nghiệp từ 2025. Nộp lại cùng một lượt trả về đúng kết quả cũ (không cộng XP lần nữa).

        - **Đề thi:** các câu gửi kèm ghi đè bản nháp. Nộp sau giờ (cộng 15 giây du di) thì chỉ chấm bản nháp đã lưu, `timedOut` = true.
        - **Bộ bài tập:** câu đã trả lời qua `/answers` là cuối cùng; câu còn lại có thể gửi kèm.
        - **XP:** chỉ lượt nộp đầu tiên của mỗi bộ hoặc đề được XP. Thưởng hoàn thành: bộ bài tập khi trả lời đủ mọi câu, đề thi khi đạt.
        - `seconds` do máy khách báo. Lượt vừa bắt đầu (nộp trong vòng 2 phút) được tin, chặn trần 24 giờ (đề thi: thời lượng đề); lượt cũ hơn bị chặn bởi thời gian máy chủ đo. Nộp quá giờ thì tính đúng thời lượng đề.

        Từ 0.3.0, với `lesson`, `quick` (L4) và `review` (L5): chỉ câu đã trả lời qua `/answers` được tính, `answers` gửi kèm bị bỏ qua.
        - `lesson`: mỗi câu chưa từng được trả lời trước lượt này được làm tròn(phần đúng × 10) XP; thêm 20 khi mọi câu của lượt đều mới
          và đã trả lời đủ.
        - `quick`: mỗi câu chưa từng được trả lời được làm tròn(phần đúng × 10) XP; không có thưởng.
        - `review` chế độ `due`: 5 XP mỗi câu đúng, thêm 10 cho mỗi câu thành "đã nhớ" (`remembered`); chế độ `all`: 0 XP, lịch ôn giữ nguyên. Từ 0.3.1 XP ôn `due` có trần 100 mỗi ngày (giờ Việt Nam, cộng mọi lượt ôn trong ngày): câu vượt trần vẫn được chấm và dời lịch ôn như thường, chỉ XP phần vượt là 0 (`xp` của câu và của lượt đã tính trần).
        Đề thi (L4): câu đã trả lời ít nhất một phần mà chưa đúng hoàn toàn được ghi vào sổ tay lỗi sai (L5); câu bỏ trống không ghi.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { $ref: "#/components/schemas/AnswerList" }
                seconds: { type: number, minimum: 0 }
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/attempts:
    get:
      tags: [attempts]
      operationId: listMyAttempts
      summary: Các lượt làm của mình, mới nhất trước (mặc định tối đa 1000, phân trang bằng con trỏ)
      description: |
        Không lọc theo `kind` thì chỉ có lượt `exercise` và `exam` (như trước 0.3.0); lượt `lesson`, `quick`, `review` chỉ trả khi lọc đúng
        loại đó. Lọc `kind` + `refId` và xem `status` để tìm lượt đang mở (ví dụ đề thi đang làm dở khi tải lại trang).
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/AttemptKind" }
        - name: refId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: Số lượt tối đa mỗi trang (1–1000, mặc định 1000).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        - name: cursor
          in: query
          description: Giá trị `nextCursor` của trang trước; bỏ trống để lấy trang đầu.
          schema: { type: string }
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AttemptSummary" }
                  total:
                    type: integer
                    description: Tổng số lượt khớp bộ lọc (không tính con trỏ).
                  truncated:
                    type: boolean
                    description: true khi còn lượt cũ hơn chưa trả (có `nextCursor`).
                  nextCursor:
                    type: [string, "null"]
                    description: Con trỏ để lấy trang cũ hơn; null khi đã hết.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/me/results:
    get:
      tags: [attempts]
      operationId: getMyResults
      summary: Kết quả mới nhất của từng câu hỏi đã làm
      responses:
        "200":
          description: Theo mã câu hỏi
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: object
                    additionalProperties:
                      type: object
                      required: [share, at]
                      properties:
                        share: { type: number, minimum: 0, maximum: 1, description: Phần trả lời đúng lần gần nhất. }
                        at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/me/stats:
    get:
      tags: [progress]
      operationId: getMyStats
      summary: XP, cấp độ, chuỗi ngày, XP tuần này
      description: |
        Tính từ sổ cái XP và các lượt làm, không lưu sẵn. Ngày tính theo giờ Việt Nam, tuần bắt đầu từ thứ Hai.
        Chuỗi ngày còn nếu ngày học gần nhất là hôm nay hoặc hôm qua.
        Từ 0.3.0 (L7) có thêm hạng tuần trên bảng xếp hạng (`weeklyRank`, `weeklyRankTotal`, `weeklyRankChange`), như `GET /v1/leaderboard?period=week`.
      responses:
        "200":
          description: Số liệu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------------ 0.3.0: nội dung (đọc)

  /v1/courses:
    get:
      tags: [courses]
      operationId: listCourses
      x-slice: L1
      summary: Các khóa học kèm chương và danh sách bài (không có nội dung bài)
      description: |
        Mọi vai trò. Khóa sắp ra mắt vẫn có (để xem lộ trình) với `comingSoon` = true. Không theo người dùng: trạng thái bài của học sinh
        ở `GET /v1/me/lesson-progress`. Thứ tự theo khối rồi vị trí admin đặt.
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Danh sách
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [version, items]
                properties:
                  version: { $ref: "#/components/schemas/ContentVersion" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CourseOutline" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/courses/{courseId}:
    get:
      tags: [courses]
      operationId: getCourse
      x-slice: L1
      summary: Một khóa học kèm chương và danh sách bài
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Khóa học
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseOutline" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/courses/{courseId}/lessons/{lessonId}:
    get:
      tags: [courses]
      operationId: getLesson
      x-slice: L1
      summary: Một bài học kèm nội dung và Luyện tập nhanh (không có đáp án)
      description: |
        Bài của khóa sắp ra mắt: học sinh nhận 409 `course_coming_soon`; giáo viên và admin xem được (xem trước).
        Bài không thuộc khóa đó là 404. Luyện tập nhanh chỉ gồm câu đang dùng, theo thứ tự admin đặt.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
        - { $ref: "#/components/parameters/LessonId" }
      responses:
        "200":
          description: Bài học
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Khóa sắp ra mắt (`course_coming_soon`), với học sinh
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/questions/{questionId}:
    get:
      tags: [courses]
      operationId: getPublicQuestion
      x-slice: L1
      summary: Một câu của ngân hàng, không có đáp án (ví dụ để hỏi trên Cộng đồng)
      description: |
        Mọi vai trò. Câu đã nghỉ vẫn đọc được (`retired`). Câu giáo viên tự soạn (`tq-…`) không ở đây (404).
        Từ 0.3.1: câu của khóa sắp ra mắt thì học sinh nhận 409 `course_coming_soon`.
      parameters:
        - { $ref: "#/components/parameters/QuestionId" }
      responses:
        "200":
          description: Câu hỏi
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PublicQuestion" }
                  - type: object
                    required: [courseId, retired]
                    properties:
                      courseId: { type: string }
                      retired: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Khóa sắp ra mắt (`course_coming_soon`), với học sinh
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/practice-catalog:
    get:
      tags: [courses]
      operationId: getPracticeCatalog
      x-slice: L1
      summary: Chương và đặc điểm của từng câu đang dùng (để lọc bài tập), câu của đề đang mở
      description: |
        Mọi vai trò. Không có đề bài hay đáp án, trừ `openExamQuestions` (đề bài của câu nằm trong đề đang mở, để Cộng đồng chặn đăng lại đề).
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Danh mục
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeCatalog" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/bank/questions:
    get:
      tags: [bank]
      operationId: listBankQuestions
      x-slice: L1
      summary: Ngân hàng câu hỏi kèm đáp án (giáo viên, admin)
      description: |
        Giáo viên dùng để chọn câu cho bài của lớp và xem trước bộ, đề của PkKemis; học sinh 403. Mặc định không có câu đã nghỉ.
        `q` tìm trong đề bài, chủ đề và mã câu, không phân biệt hoa thường và dấu.
      parameters:
        - { name: courseId, in: query, schema: { type: string } }
        - { name: chapterId, in: query, schema: { type: string } }
        - { name: lessonId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/QuestionType" } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/QuestionLevel" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - name: retired
          in: query
          schema: { type: string, enum: [exclude, include, only], default: exclude }
      responses:
        "200":
          description: Câu hỏi, theo khóa, chương rồi thứ tự trong ngân hàng
          content:
            application/json:
              schema:
                type: object
                required: [version, items]
                properties:
                  version: { $ref: "#/components/schemas/ContentVersion" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BankQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StaffOnly" }

  /v1/bank/questions/batch:
    post:
      tags: [bank]
      operationId: getBankQuestionsBatch
      x-slice: L1
      summary: Nhiều câu của ngân hàng theo mã, kèm đáp án (giáo viên, admin)
      description: Kể cả câu đã nghỉ. Mã không có thì bị bỏ qua, không báo lỗi. Học sinh 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdsRequest" }
      responses:
        "200":
          description: Các câu tìm thấy
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BankQuestion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StaffOnly" }

  /v1/me/questions/revealed:
    post:
      tags: [attempts]
      operationId: getRevealedQuestions
      x-slice: L4
      summary: Câu kèm đáp án, chỉ những câu mình đã từng trả lời (học sinh)
      description: |
        Đáp án chỉ lộ sau khi trả lời: chỉ trả câu học sinh đã có kết quả (`GET /v1/me/results`), mã khác bị bỏ qua không báo lỗi.
        Dùng để hiện sổ tay lỗi sai còn nằm ở trình duyệt (L4) và xem lại bài đã làm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdsRequest" }
      responses:
        "200":
          description: Các câu được xem
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------------ 0.3.0: soạn nội dung (admin)

  /v1/admin/content:
    get:
      tags: [admin]
      operationId: getAdminContent
      x-slice: L1
      summary: Toàn bộ nội dung như admin thấy (kèm đáp án, nhãn bản gốc / đã sửa / mới, mục đã nghỉ, đã gỡ)
      description: |
        Chỉ admin. Trang quản trị dựng mọi bảng (độ phủ theo chương, nơi đang dùng câu, bộ và đề) từ đây.
        `revision` của từng mục gửi lại khi sửa để phát hiện người khác vừa lưu.
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Nội dung
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContent" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }

  /v1/admin/courses/{courseId}:
    put:
      tags: [admin]
      operationId: adminSaveCourse
      x-slice: L2
      summary: Lưu cả một khóa học (thông tin, chương, bài, nội dung bài, Luyện tập nhanh)
      description: |
        Thay toàn bộ khóa bằng bản gửi lên (web tính bản mới bằng `withOutline`, `withLesson` từ bản đọc được rồi gửi cả khóa).
        Máy chủ kiểm bằng cùng luật với web (`courseDraftProblem`), thêm: mã chương, bài không trùng khóa khác; câu trong Luyện tập nhanh
        có trong ngân hàng; chương bị bỏ phải không còn câu hỏi (kể cả câu đã nghỉ) hay bộ bài tập. Lỗi là 400 `validation_failed` với
        `detail` đúng câu của luật. `revision` khác bản trên máy chủ: 409 `content_conflict`. Bài bị xóa thì tiến độ của học sinh ở bài đó
        không còn được tính; câu gắn với bài đó mất liên kết bài khi đọc.
        Không tạo được khóa mới ở đây. Lưu đúng như bản gốc thì khóa lại mang nhãn bản gốc.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft, revision]
              properties:
                draft: { $ref: "#/components/schemas/CourseDraft" }
                revision: { type: integer, description: "`revision` của khóa lúc đọc." }
      responses:
        "200":
          description: Khóa sau khi lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCourse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContentConflict" }

  /v1/admin/courses/{courseId}/restore-sample:
    post:
      tags: [admin]
      operationId: adminRestoreCourse
      x-slice: L2
      summary: Đưa khóa về bản gốc (thông tin, chương, bài)
      description: |
        Chương do admin thêm còn câu hỏi hoặc bộ bài tập thì chưa khôi phục được: 409 `restore_blocked`, `detail` nói chương nào, còn gì
        (giống `restoreProblem` của web; `AdminCourse.restoreBlocked` báo trước điều này). Khóa đang là bản gốc thì không đổi gì.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200":
          description: Khóa sau khi khôi phục
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCourse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Chưa khôi phục được (`restore_blocked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/questions:
    post:
      tags: [admin]
      operationId: adminCreateQuestion
      x-slice: L2
      summary: Thêm một câu vào ngân hàng
      description: |
        Máy chủ đặt mã: `<chương>-<chủ đề không dấu>` (tối đa 32 kí tự của chủ đề), thêm `-2`, `-3`… khi trùng; `question.id` gửi lên
        bị bỏ qua. Kiểm bằng `bankQuestionProblem`. `practice` = true thì câu được thêm vào cuối Luyện tập nhanh của bài của nó (cần `lessonId`).
        Gửi lại cùng `Idempotency-Key` trong 24 giờ thì nhận lại câu đã tạo, không tạo thêm.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, practice]
              properties:
                question: { $ref: "#/components/schemas/Question" }
                practice: { type: boolean, description: Có trong Luyện tập nhanh của bài của câu. }
      responses:
        "201":
          description: Câu vừa thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuestion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }

  /v1/admin/questions/{questionId}:
    put:
      tags: [admin]
      operationId: adminSaveQuestion
      x-slice: L2
      summary: Sửa một câu của ngân hàng
      description: |
        Thay cả câu (mã giữ nguyên). Đổi sang bài khác thì câu rời Luyện tập nhanh của bài cũ; `practice` đặt câu vào hay bỏ khỏi Luyện tập
        nhanh của bài mới. Lưu đúng như bản gốc thì câu lại mang nhãn bản gốc. Đổi đáp án có hiệu lực ngay, kể cả với lượt đang làm.
      parameters:
        - { $ref: "#/components/parameters/QuestionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, practice, revision]
              properties:
                question: { $ref: "#/components/schemas/Question" }
                practice: { type: boolean }
                revision: { type: integer }
      responses:
        "200":
          description: Câu sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuestion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContentConflict" }

  /v1/admin/questions/{questionId}/retire:
    post:
      tags: [admin]
      operationId: adminRetireQuestion
      x-slice: L2
      summary: Cho câu nghỉ (xóa khỏi nơi dùng, vẫn tìm được theo mã)
      description: |
        Câu nghỉ không còn trong Luyện tập nhanh, bộ, đề, luyện nhanh và lựa chọn của giáo viên; lượt làm cũ, sổ tay lỗi sai và bài giáo viên
        đã soạn vẫn đọc được nó. Làm lại khi đã nghỉ thì không đổi gì.
      parameters:
        - { $ref: "#/components/parameters/QuestionId" }
      responses:
        "200":
          description: Câu sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/questions/{questionId}/unretire:
    post:
      tags: [admin]
      operationId: adminUnretireQuestion
      x-slice: L2
      summary: Dùng lại câu đã nghỉ
      parameters:
        - { $ref: "#/components/parameters/QuestionId" }
      responses:
        "200":
          description: Câu sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/questions/{questionId}/restore-sample:
    post:
      tags: [admin]
      operationId: adminRestoreQuestion
      x-slice: L2
      summary: Đưa câu về bản gốc
      description: |
        Câu do admin thêm không có bản gốc (409 `no_sample`). Chương của bản gốc không còn trong khóa: 409 `restore_blocked`
        ("Khôi phục khóa học trước").
      parameters:
        - { $ref: "#/components/parameters/QuestionId" }
      responses:
        "200":
          description: Câu sau khi khôi phục
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Không có bản gốc (`no_sample`) hoặc chưa khôi phục được (`restore_blocked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/exercise-sets:
    post:
      tags: [admin]
      operationId: adminCreateExerciseSet
      x-slice: L2
      summary: Thêm một bộ bài tập của PkKemis
      description: |
        Máy chủ đặt mã từ tên (không dấu, `-2`… khi trùng với bộ hoặc đề khác) và `chapterLabel` ("Chương n"). Kiểm bằng `practiceProblem`
        (tối đa 40 câu, câu thuộc khóa, XP mỗi câu 1–100, thưởng 0–200, người soạn bắt buộc). Có `Idempotency-Key` như thêm câu.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: { $ref: "#/components/schemas/ExerciseSetInput" }
      responses:
        "201":
          description: Bộ vừa thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExerciseSet" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }

  /v1/admin/exercise-sets/{setId}:
    put:
      tags: [admin]
