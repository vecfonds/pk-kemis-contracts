      x-slice: L2
      summary: Sửa một bộ bài tập của PkKemis
      description: Lượt đang làm giữ đề đã ghim; lượt mới dùng bản vừa lưu. Lưu đúng như bản gốc thì bộ lại mang nhãn bản gốc.
      parameters:
        - { $ref: "#/components/parameters/SetId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item, revision]
              properties:
                item: { $ref: "#/components/schemas/ExerciseSetInput" }
                revision: { type: integer }
      responses:
        "200":
          description: Bộ sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExerciseSet" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContentConflict" }

  /v1/admin/exercise-sets/{setId}/remove:
    post:
      tags: [admin]
      operationId: adminRemoveExerciseSet
      x-slice: L2
      summary: Gỡ bộ bài tập (học sinh không thấy nữa; khôi phục được)
      description: Lượt đang mở vẫn nộp được; lượt đã làm vẫn có trong lịch sử. Làm lại khi đã gỡ thì không đổi gì.
      parameters:
        - { $ref: "#/components/parameters/SetId" }
      responses:
        "200":
          description: Bộ sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExerciseSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/exercise-sets/{setId}/unremove:
    post:
      tags: [admin]
      operationId: adminUnremoveExerciseSet
      x-slice: L2
      summary: Đưa bộ bài tập đã gỡ trở lại
      parameters:
        - { $ref: "#/components/parameters/SetId" }
      responses:
        "200":
          description: Bộ sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExerciseSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/exercise-sets/{setId}/restore-sample:
    post:
      tags: [admin]
      operationId: adminRestoreExerciseSet
      x-slice: L2
      summary: Đưa bộ bài tập về bản gốc
      description: "Bộ do admin thêm: 409 `no_sample`."
      parameters:
        - { $ref: "#/components/parameters/SetId" }
      responses:
        "200":
          description: Bộ sau khi khôi phục
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExerciseSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Không có bản gốc (`no_sample`)
