            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/exams:
    post:
      tags: [admin]
      operationId: adminCreateExam
      x-slice: L2
      summary: Thêm một đề thi của PkKemis
      description: |
        Máy chủ đặt mã từ tên như bộ bài tập. Kiểm bằng `practiceProblem` (tối đa 60 câu; đề "sắp diễn ra" lưu được khi chưa có câu nhưng
        cần ngày mở; 5–180 phút; điểm đạt 0–100). Có `Idempotency-Key`.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: { $ref: "#/components/schemas/ExamInput" }
      responses:
        "201":
          description: Đề vừa thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExam" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }

  /v1/admin/exams/{examId}:
    put:
      tags: [admin]
      operationId: adminSaveExam
