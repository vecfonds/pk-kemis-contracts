        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ 0.8.0: lượt làm bài của lớp ở máy chủ (L6)

  /v1/works/{workId}/sheet:
    get:
      tags: [submissions]
      operationId: getWorkSheet
      x-slice: L6
      summary: Trang làm bài của một bài giao cho mình, không có đáp án (học sinh)
      description: |
        Chỉ học sinh của một lớp còn chạy (không tạm khóa, không bị ẩn) đã được giao bài này: khác đi là 404 (không phải bài giao cho mình) hoặc
        409 `class_expired` (mọi lớp được giao đều tạm khóa). Bộ bài tập có `questions` (không đáp án) để hiện ngay; **đề thi không có câu nào** cho tới khi bắt đầu lượt làm
        (đồng hồ chạy từ lúc thấy đề), chỉ có số câu từng phần. `openRunId` là lượt đang làm dở (nếu có), để tải lại trang thì làm tiếp.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "200":
          description: Trang làm bài
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkSheet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Mọi lớp được giao bài đều tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/works/{workId}/runs:
    post:
      tags: [submissions]
      operationId: startWorkRun
      x-slice: L6
      summary: Bắt đầu làm một bài giao cho mình, hoặc làm tiếp lượt đang dở (học sinh)
      description: |
        Mỗi học sinh một lượt đang mở cho mỗi bài: gọi lại thì trả lượt đó (200), đồng hồ không bắt đầu lại. Quyền như `sheet`. Số lần: lớp
        dùng thử tối đa 5 lần **đã nộp** mỗi bài (409 `attempt_limit_reached` khi bắt đầu lượt mới, và kiểm lại lúc nộp), có lớp đã mua suất
        thì không giới hạn; mọi lớp được giao đều tạm khóa thì 409 `class_expired`. Từ 1.1.0 giới hạn là 5 cộng số lượt đã mua
        (`attemptsBought`, chỉ lượt `granted`); `attempt_limit_reached` kèm `canBuyAttempt` để web mở hộp "Mua thêm lượt".
        - Đề thi: `deadline` = giờ bắt đầu + thời gian đề. Lượt quá `deadline` + 15 giây được chấm từ bản nháp và **tính là một lần làm**
          (việc định kỳ mỗi phút, và khi học sinh bắt đầu lại hay mở lượt đó).
        - Đề của lượt cố định từ lúc bắt đầu (`questions`, không đáp án), kể cả khi giáo viên nhân bản hay sửa bài sau đó.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "200":
          description: Lượt đang mở được làm tiếp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRun" }
        "201":
          description: Lượt mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Hết lượt (`attempt_limit_reached`) hoặc mọi lớp tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/runs/{runId}:
    get:
      tags: [submissions]
      operationId: getWorkRun
      x-slice: L6
      summary: Một lượt làm bài của lớp của mình
      description: |
        Đang mở thì trả `WorkRun`, đã nộp thì `RunResult`. Đề quá `deadline` + 15 giây được chấm trước rồi trả `RunResult`.
        Lượt của người khác giống như không tồn tại (404).
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Lượt làm
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/WorkRun" }
                  - { $ref: "#/components/schemas/RunResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/runs/{runId}/answers:
    post:
      tags: [submissions]
      operationId: answerWorkRunQuestion
      x-slice: L6
      summary: Trả lời một câu của bộ bài tập của lớp và xem đáp án ngay
      description: |
        Chỉ bộ bài tập; đề thi 409 `not_available_during_exam`. Mỗi câu trả lời một lần mỗi lượt (409 `already_answered`). Câu phải trả lời đủ
        các phần, không thì 400 `validation_failed`. Lượt đã nộp: 409 `attempt_closed`.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answer]
              properties:
                questionId: { type: string }
                answer: { $ref: "#/components/schemas/QuestionAnswer" }
      responses:
        "200":
          description: Kết quả câu vừa trả lời, kèm đáp án và lời giải
          content:
            application/json:
              schema:
                type: object
                required: [questionId, mark, reveal]
                properties:
                  questionId: { type: string }
                  mark: { $ref: "#/components/schemas/Mark" }
                  reveal: { $ref: "#/components/schemas/Reveal" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Đã trả lời câu này (`already_answered`), lượt đã nộp (`attempt_closed`) hoặc là đề thi (`not_available_during_exam`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/runs/{runId}/draft:
    put:
      tags: [submissions]
      operationId: saveWorkRunDraft
      x-slice: L6
      summary: Lưu bài đề thi của lớp đang làm dở
      description: |
        Chỉ đề thi (bộ bài tập lưu từng câu qua `/answers`: 400 `validation_failed`). Gộp câu trả lời vào bản nháp; `flags` thay danh sách cũ
        khi gửi. Quá `deadline` + 15 giây hoặc đã nộp: 409 `attempt_closed`.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { $ref: "#/components/schemas/RunAnswerList" }
                flags: { type: array, maxItems: 40, items: { type: string } }
      responses:
        "204": { description: Đã lưu }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Hết giờ hoặc đã nộp (`attempt_closed`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/runs/{runId}/submit:
    post:
      tags: [submissions]
      operationId: submitWorkRun
      x-slice: L6
      summary: Nộp lượt làm bài của lớp
      description: |
        Máy chủ chấm và ghi lần làm. Lần làm đầu tiên của học sinh ở mỗi bài giao là **bài nộp** của bài giao đó (các lần sau chỉ để luyện,
        không đổi bài nộp); bài được giao cho nhiều lớp của học sinh thì lần đầu nộp cho tất cả; nộp quá hạn vẫn được, tính là nộp muộn.
        Nộp lại cùng lượt trả đúng kết quả cũ.
        - Đề thi: câu gửi kèm ghi đè bản nháp; nộp sau `deadline` + 15 giây thì chỉ chấm bản nháp (`timedOut`). `seconds` cắt về thời gian thật
          máy chủ đo.
        - Bộ bài tập: câu đã trả lời qua `/answers` là cuối cùng; câu còn lại có thể gửi kèm.
        - **XP** do learning quyết (lần nộp đầu của mỗi bài, có trần mỗi ngày): classroom gửi kết quả sang learning trong cùng thao tác (chờ
          tối đa 2 giây). Learning trả lời kịp thì có `xp`; không thì `xp` là null và XP được cộng sau (gửi lại tự động).
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { $ref: "#/components/schemas/RunAnswerList" }
                seconds: { type: number, minimum: 0 }
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Mọi lớp tạm khóa trước khi nộp (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ------------------------------------------------------------------ 1.1.0: mua thêm lượt (M9 lát 9d)

  /v1/works/{workId}/extra-attempts:
    post:
      tags: [submissions]
      operationId: buyExtraAttempt
      x-slice: 9d
      summary: Mua thêm một lượt làm bài của lớp dùng thử bằng Xu (học sinh)
      description: |
        Chỉ khi giới hạn đang áp dụng (mọi lớp còn chạy được giao bài này đều là lớp dùng thử) và học sinh **đã dùng hết** lượt (`attemptsUsed`
        ≥ `attemptLimit`); không thì 409 `no_attempt_limit` hoặc `attempts_remaining`. Mỗi lần một lượt; đang có một lần mua chưa xong cho bài
        này (lần bấm khác, tab khác) thì 409 `purchase_in_progress` kèm `grantId` của lần đó. Quyền như `sheet`.

        Luồng (giữ chỗ rồi xác nhận):
        1. Ghi `attempt_grants` trạng thái `pending` (một giao dịch, khóa theo học sinh và bài) rồi commit.
        2. Gọi commerce `POST /internal/wallet/charges` với `sku: class-work-attempt`, `reference: attempt:<grantId>`, `expectedAmount` (nếu
           web gửi `expectedPrice`) và `notAfter` = lúc ghi + 2 phút; chờ tối đa 3 giây.
        3. Thu được: lần cấp thành `granted` → 201. Commerce từ chối hẳn: `failed` → 409 với mã của commerce (`insufficient_funds` kèm
           `required`, web mở hộp Nạp; `price_changed` kèm `price`; `charge_expired` thành `purchase_failed`). Lỗi mạng, quá giờ, 5xx: lần cấp
           vẫn `pending` → 202; việc định kỳ của classroom gửi lại **đúng** `reference` đó (commerce không bao giờ trừ hai lần cho một
           `reference`) tới khi có kết cục; sau `notAfter` commerce trả kết cục chắc chắn (đã thu, hoặc `charge_expired` và không bao giờ thu).

        Lượt chỉ được tính khi `granted` (không có lượt nào chưa trả tiền); `pending` không cộng vào giới hạn. Gửi lại cùng `Idempotency-Key`
        trả đúng lần cấp đó (và nếu còn `pending` thì gọi commerce lại ngay); cùng mã khác bài: 422 `idempotency_mismatch`. Lượt đã mua tính
        trong cùng khoảng với số lần đã nộp (từ lần giao bài sớm nhất còn chạy): giáo viên giao lại bài thì số lần tính lại từ 5, lượt mua trước
        đó không cộng thêm. Không hoàn Xu khi lớp hết hạn, học sinh rời lớp hay lớp chuyển sang trả phí. Classroom chưa nối commerce
        (`COMMERCE_URL` trống) hay commerce trả lỗi cấu hình: 503 `commerce_unavailable`, không ghi gì.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtraAttemptRequest" }
      responses:
        "201":
          description: Đã mua; lượt có ngay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtraAttemptGrant" }
        "202":
          description: Chưa biết kết quả (commerce chưa trả lời); hỏi lại bằng `GET …/extra-attempts/{grantId}` hoặc gửi lại cùng `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtraAttemptGrant" }
        "400":
          description: Dữ liệu không hợp lệ (`validation_failed`) hoặc thiếu `Idempotency-Key` (`idempotency_key_required`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `insufficient_funds` (kèm `required`), `price_changed` (kèm `price`), `purchase_failed`, `attempts_remaining`, `no_attempt_limit`,
            `purchase_in_progress` (kèm `grantId`), `class_expired`. Gửi lại cùng `Idempotency-Key` sau một kết cục từ chối trả lại đúng lỗi đó;
            muốn thử lại (sau khi nạp) thì dùng mã mới.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Cùng `Idempotency-Key` đã dùng cho bài khác (`idempotency_mismatch`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Chưa mua được lượt lúc này (`commerce_unavailable`), không ghi gì
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/works/{workId}/extra-attempts/{grantId}:
    get:
      tags: [submissions]
      operationId: getExtraAttempt
      x-slice: 9d
      summary: Một lần mua thêm lượt của mình (học sinh)
      description: Để web hỏi lại khi lần mua còn `pending`. Lần mua của người khác giống như không tồn tại (404). Chỉ đọc, không gọi commerce.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lần mua
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtraAttemptGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/class-members:
    get:
      tags: [internal]
      operationId: listClassMembersForSocial
      x-slice: 10c
      x-callers: [social]
      summary: Học sinh đang ở các lớp, theo trang (social dựng lại bản sao học sinh – lớp – giáo viên)
      description: |
        Mọi thành viên đang ở lớp (chưa rời) của các lớp chưa bị xóa, kể cả lớp đang tạm khóa vì hết hạn hay bị admin ẩn (vẫn là bạn cùng lớp).
        Theo `(classId, studentId)`. `since` cùng nghĩa với `joinedAt` của `class.member_joined`: bên giữ bản sao chỉ ghi khi mốc này ≥ mốc
        đang có, nên một trang đọc trước một lần rời lớp không làm học sinh "vào lại". Chỉ tên lớp và mã, không có tên học sinh (social có từ
        identity). Chỉ khóa `socialKey`.
      security:
        - socialKey: []
      parameters:
        - name: after
          in: query
          description: "`nextAfter` của trang trước (dạng `<classId>:<studentId>`)."
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfter]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [classId, className, teacherId, studentId, since]
                      properties:
                        classId: { type: string, format: uuid }
                        className: { type: string, minLength: 1, maxLength: 100 }
                        teacherId: { type: string, format: uuid }
                        studentId: { type: string, format: uuid }
                        since: { type: string, format: date-time }
                  nextAfter: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của identity (RS256).
    socialKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: |
        1.2.0 (M10): khóa của social (`CLASSROOM_INTERNAL_KEY_SOCIAL`), chỉ mở `GET /internal/class-members`. Sai, thiếu, hay khóa trống: 403.
        So sánh thời gian hằng. Thay bằng token giữa service khi có gateway.

  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkId:
      name: workId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Một mã cho mỗi lần bấm (web dùng UUID); gửi lại đúng mã khi thử lại. Phạm vi là người gọi.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,100}$" }

  responses:
    ContentUnavailable:
      description: Chưa lấy được câu ngân hàng từ learning (`content_unavailable`); thử lại sau
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: Dữ liệu gửi lên không hợp lệ (`validation_failed`), kèm lỗi từng trường
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ / hết hạn (`token_invalid`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Sai vai trò cho thao tác này (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Không tìm thấy, hoặc không phải của mình (`not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Đoán mã lớp quá nhiều lần (`too_many_attempts`); chờ theo `Retry-After`
      headers:
        Retry-After:
          description: Số giây phải chờ
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Lỗi theo RFC 9457. Cùng dạng với identity; có thêm các mã của service này.
      required: [title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - validation_failed
            - token_invalid
            - forbidden
            - not_found
            - class_code_unknown
            - already_member
            - class_full
            - class_expired
            - trial_limit_reached
            - course_coming_soon
            - invalid_purchase
            - work_locked
            - work_in_use
            - too_many_attempts
            - attempt_limit_reached
            - class_revoked
            - class_hidden
            - internal_error
            - content_unavailable
            - attempt_closed
            - already_answered
            - not_available_during_exam
            - idempotency_key_required
            - idempotency_mismatch
            - insufficient_funds
            - price_changed
            - purchase_failed
            - attempts_remaining
            - no_attempt_limit
            - purchase_in_progress
            - commerce_unavailable
        detail: { type: string, description: "Thông báo tiếng Việt, hiển thị được cho người dùng." }
        required: { type: integer, description: "Từ 1.1.0, chỉ `insufficient_funds`: số Xu cần. Không có số dư (classroom không thấy ví)." }
        price: { type: integer, description: "Từ 1.1.0, chỉ `price_changed`: giá hiện tại của một lượt." }
        grantId: { type: string, format: uuid, description: "Từ 1.1.0, chỉ `purchase_in_progress`: lần mua đang chờ." }
        canBuyAttempt: { type: boolean, description: "Từ 1.1.0, chỉ `attempt_limit_reached`: mua thêm lượt được ngay (như `WorkSheet.canBuyAttempt`)." }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Course:
      type: object
      required: [id, title, grade, comingSoon]
      properties:
        id: { type: string }
        title: { type: string }
        grade: { type: integer, minimum: 10, maximum: 12 }
        comingSoon: { type: boolean }

    ClassPerson:
      type: object
      required: [id, fullName, avatarInitials]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        avatarInitials: { type: string }

    ClassTerm:
      type: object
      description: Suất, trạng thái và hạn của lớp ngay lúc này.
      required: [status, total, used, free, trialOnly]
      properties:
        status: { type: string, enum: [trial, active, expired], description: "`expired` là tạm khóa: chưa gia hạn hoặc hết dùng thử." }
        total: { type: integer, description: "Số suất đang chạy, cũng là số học sinh tối đa." }
        used: { type: integer, description: Số học sinh trong lớp; mỗi người giữ một suất. }
        free: { type: integer }
        expiresAt: { type: string, format: date-time, description: "Hết kỳ đang chạy, hoặc kỳ cuối khi đã hết hạn." }
        schoolYear: { type: string, description: Năm học của kỳ đã trả gần nhất; vắng khi chỉ mới dùng thử. }
        renewedUntil: { type: string, format: date-time, description: Đã trả cho một kỳ sau; lớp chạy tới lúc đó. }
        trialOnly: { type: boolean, description: Lớp chưa từng trả tiền. }

    ClassSummary:
      type: object
      required: [id, name, grade, schoolYear, teacherId, courseId, joinCode, createdAt, term, teacher, assignments]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade: { type: integer }
        schoolYear: { type: string, description: '"2026–2027"' }
        school: { type: string }
        teacherId: { type: string, format: uuid }
        courseId: { type: string }
        joinCode: { type: string, description: 'Học sinh gõ để vào lớp, ví dụ "HOA-10A1".' }
        createdAt: { type: string, format: date-time }
        term: { $ref: "#/components/schemas/ClassTerm" }
        teacher: { $ref: "#/components/schemas/ClassPerson" }
        teacherRevoked: { type: boolean, description: Admin đã cấm giáo viên thao tác trên lớp này; chỉ admin mở lại được. }
        hidden: { type: boolean, description: Admin đã ẩn lớp; học sinh không thấy lớp ẩn. }
        assignments:
          type: array
          description: |
            Bài đã giao cho lớp, hạn nộp gần nhất trước. Giáo viên của lớp và admin luôn thấy; học sinh chỉ thấy khi lớp đang chạy.
            Chỉ có tên, loại, hạn và lời dặn, không có câu hỏi hay đáp án.
          items: { $ref: "#/components/schemas/Assignment" }

    ClassDetail:
      allOf:
        - $ref: "#/components/schemas/ClassSummary"
        - type: object
          properties:
            licenses:
              type: array
              description: Chỉ giáo viên của lớp, người lập lớp đã bị thu vai trò (để thấy hạn dùng) và admin; mới nhất trước.
              items: { $ref: "#/components/schemas/License" }
            members:
              type: array
              description: Chỉ giáo viên của lớp và admin.
              items:
                allOf:
                  - $ref: "#/components/schemas/ClassPerson"
                  - type: object
                    required: [joinedAt]
                    properties:
                      joinedAt: { type: string, format: date-time }
                      courseProgress:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: "0.8.0 (L3): phần trăm bài đã xong của khóa của lớp (lấy từ learning). Vắng khi chưa lấy được."
                      completedLessons: { type: integer, minimum: 0, description: "0.8.0 (L3)." }
                      totalLessons: { type: integer, minimum: 0, description: "0.8.0 (L3)." }
                      lastActiveAt:
                        type: [string, "null"]
                        format: date-time
                        description: "0.8.0 (L3): lần hoạt động gần nhất (học trên learning hoặc nộp bài của lớp); null là chưa có. Vắng khi chưa lấy được."
            progressUnavailable:
              type: boolean
              description: |
                0.8.0 (L3): true khi lớp có học sinh mà chưa lấy được tiến độ từ learning; khi đó các trường tiến độ của học sinh vắng.
                Giáo viên chỉ thấy tiến độ của khóa của lớp và thời điểm hoạt động, không thấy chi tiết bài hay câu.

    License:
      type: object
      required: [id, classId, courseId, kind, seats, schoolYear, startsAt, expiresAt, months, discountPercent, amount, createdAt]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        courseId: { type: string }
        kind: { type: string, enum: [trial, open, extra, renewal] }
        seats: { type: integer }
        schoolYear: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        payer: { type: string, enum: [teacher, school], description: Vắng với dùng thử. }
        payerName: { type: string }
        orderCode: { type: string, description: 'PK + yymmdd + 4 số.' }
        months: { type: integer, description: "Số tháng tính tiền; 11 là đủ giá, 0 với dùng thử." }
        discountPercent: { type: integer, description: Chỉ lúc mở lớp. }
        amount: { type: integer, description: "VND đã trả (mô phỏng), sau khi tính theo tháng và giảm giá." }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [payer, payerName]
      properties:
        payer: { type: string, enum: [teacher, school] }
        payerName: { type: string, minLength: 1, maxLength: 80, description: Tên ghi trên hóa đơn. }

    CreateClassRequest:
      type: object
      required: [name, grade, courseId, opening]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        grade: { type: integer, minimum: 10, maximum: 12 }
        courseId: { type: string, description: Phải thuộc khối đã chọn và đã mở. }
        schoolYear: { type: string, description: Nếu gửi thì phải là năm học đang diễn ra. }
        school: { type: string, maxLength: 80 }
        opening:
          oneOf:
            - type: object
              required: [plan]
              properties:
                plan: { const: trial }
            - allOf:
                - $ref: "#/components/schemas/Payment"
                - type: object
                  required: [plan, seats]
                  properties:
                    plan: { const: paid }
                    seats: { type: integer, minimum: 1, maximum: 500 }

    PurchaseRequest:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [kind, seats]
          properties:
            kind: { type: string, enum: [open, extra, renewal] }
            seats: { type: integer, minimum: 1, maximum: 500 }

    Assignment:
      type: object
      required: [id, classId, kind, refId, title, assignedAt, dueAt]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        kind: { type: string, enum: [exercise, exam] }
        refId: { type: string, format: uuid, description: Mã bài đã soạn được giao. }
        title: { type: string, description: Tên của bài; đổi theo khi bài đổi tên. }
        note: { type: string }
        assignedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }

    OwnQuestion:
      description: Câu giáo viên tự viết. Đủ các trường của dạng câu.
      type: object
      required: [id, type, chapterId, topic, level, prompt, explanation]
      properties:
        id: { type: string, pattern: "^tq-[a-z0-9-]{1,40}$" }
        type: { type: string, enum: [single, truefalse, short] }
        chapterId: { type: string, description: Chương của khóa học của bài. }
        topic: { type: string, maxLength: 120 }
        level: { type: string, enum: [biet, hieu, vandung] }
        prompt: { type: string, maxLength: 2000 }
        hint: { type: string, maxLength: 2000 }
        explanation: { type: string, maxLength: 4000 }
        options:
          type: array
          description: Chỉ với `single`; đúng 4 phương án khác nhau.
          minItems: 4
          maxItems: 4
          items: { type: string, maxLength: 500 }
        answerIndex: { type: integer, minimum: 0, maximum: 3, description: Chỉ với `single`. }
        statements:
          type: array
          description: Chỉ với `truefalse`; đúng 4 ý a đến d.
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [text, answer, explanation]
            properties:
              text: { type: string, maxLength: 500 }
              answer: { type: boolean }
              explanation: { type: string, maxLength: 1000 }
        answer: { type: string, description: "Chỉ với `short`: một số tối đa 4 kí tự, dấu phẩy thập phân." }

    WorkItem:
      oneOf:
        - type: object
          required: [source, questionId]
          properties:
            source: { const: bank }
            questionId: { type: string }
            question:
              readOnly: true
              description: |
                0.8.0 (L1): bản chụp câu ngân hàng (kèm đáp án) lúc lưu bài; máy chủ tự điền, gửi lên thì bị bỏ qua. Chấm, xem bài và
                "câu sai nhiều nhất" dùng bản này, nên admin sửa câu sau đó không đổi bài đã soạn.
              allOf:
                - $ref: "#/components/schemas/PaperQuestion"
        - type: object
          required: [source, question]
          properties:
            source: { const: own }
            question: { $ref: "#/components/schemas/OwnQuestion" }

    WorkInput:
      type: object
      required: [kind, title, courseId, items]
      properties:
        kind: { type: string, enum: [exercise, exam] }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        courseId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: "#/components/schemas/WorkItem" }
        durationMinutes: { type: integer, minimum: 5, maximum: 180, description: Chỉ đề thi; bắt buộc với đề thi. }
        passPercent: { type: number, minimum: 0, maximum: 100, description: Chỉ đề thi; 50 là 5 điểm trên 10. }

    Work:
      allOf:
        - $ref: "#/components/schemas/WorkInput"
        - type: object
          required: [id, teacherId, handedIn, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            teacherId: { type: string, format: uuid }
            handedIn: { type: boolean, description: Đã có học sinh nộp nên không sửa được. }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PaperQuestion:
      description: |
        Một câu của đề (từ ngân hàng PkKemis hoặc giáo viên tự soạn), kèm đáp án. Từ 1.0.0 chỉ còn là bản chụp câu ngân hàng trong bài đã soạn
        (`WorkItem.question`), mà chỉ giáo viên của bài và admin đọc được, nên luôn đủ đáp án; các ghi chú "vắng khi người nhận là học sinh"
        là của đường `/paper` đã gỡ.
      type: object
      required: [id, type, chapterId, topic, level, prompt]
      properties:
        id: { type: string }
        type: { type: string, enum: [single, truefalse, short] }
        chapterId: { type: string }
        lessonId: { type: string }
        topic: { type: string }
        level: { type: string, enum: [biet, hieu, vandung] }
        prompt: { type: string }
        hint: { type: string }
        explanation: { type: string, description: "Vắng khi người nhận là học sinh (0.8.1)." }
        tool:
          type: object
          required: [href, label]
          properties:
            href: { type: string }
            label: { type: string }
        options: { type: array, items: { type: string } }
        answerIndex: { type: integer }
        statements:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              answer: { type: boolean, description: "Vắng khi người nhận là học sinh (0.8.1)." }
              explanation: { type: string, description: "Vắng khi người nhận là học sinh (0.8.1)." }
        answer: { type: string, description: "Vắng khi người nhận là học sinh (0.8.1)." }

    QuestionAnswer:
      description: Câu trả lời của học sinh; `null` ở một ý Đúng/Sai nghĩa là bỏ trống.
      oneOf:
        - type: object
          required: [type, choice]
          properties:
            type: { const: single }
            choice: { type: integer, minimum: -1, maximum: 3, description: "-1 là chưa chọn." }
        - type: object
          required: [type, values]
          properties:
            type: { const: truefalse }
            values:
              type: array
              minItems: 4
              maxItems: 4
              items: { type: [boolean, "null"] }
        - type: object
          required: [type, text]
          properties:
            type: { const: short }
            text: { type: string, maxLength: 20 }

    AttemptResult:
      description: Phần chung của kết quả một lần làm bài của lớp; từ 1.0.0 chỉ còn là nền của `RunResult`.
      type: object
      required: [attemptId, correct, total, earned, max, score10, seconds, wrongQuestionIds, handedIn, attemptsUsed]
      properties:
        attemptId: { type: string, format: uuid }
        correct: { type: integer, description: Số câu đúng hoàn toàn. }
        total: { type: integer }
        earned: { type: integer, description: 1/100 điểm đạt được (như learning.yaml). }
        max: { type: integer, description: 1/100 điểm tối đa của đề. }
        score10: { type: number, description: Điểm trên thang 10. }
        seconds: { type: integer }
        passed: { type: boolean, description: Chỉ đề thi. }
        wrongQuestionIds:
          type: array
          items: { type: string }
        handedIn:
          type: array
          description: Mã các bài giao mà lần làm này vừa trở thành bài nộp (rỗng nếu đã nộp từ trước).
          items: { type: string, format: uuid }
        attemptsUsed: { type: integer }
        attemptLimit:
          type: [integer, "null"]
          description: Từ 1.1.0 tính cả lượt đã mua (5 + `attemptsBought` ở lớp dùng thử).
        attemptsBought: { type: integer, minimum: 0, description: "Từ 1.1.0: số lượt đã mua (đã thu Xu) đang tính vào giới hạn." }

    Submission:
      type: object
      required: [assignmentId, studentId, submittedAt, correct, total, earned, max, score10, wrongQuestionIds]
      properties:
        assignmentId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        correct: { type: integer }
        total: { type: integer }
        earned: { type: integer, description: 1/100 điểm đạt được. }
        max: { type: integer, description: 1/100 điểm tối đa. }
        score10: { type: number }
        wrongQuestionIds:
          type: array
          items: { type: string }

    # ---------------------------------------------------------------- 0.8.0 (L6)

    PublicQuestion:
      description: Câu như học sinh thấy trước khi trả lời (ngân hàng hoặc tự soạn), không có đáp án và lời giải. Cùng dạng với learning.yaml.
      type: object
      required: [id, type, chapterId, topic, level, prompt]
      properties:
        id: { type: string }
        type: { type: string, enum: [single, truefalse, short] }
        chapterId: { type: string }
        lessonId: { type: string }
        topic: { type: string }
        level: { type: string, enum: [biet, hieu, vandung] }
        prompt: { type: string }
        hint: { type: string, description: "Bước đầu của lời giải, không lộ đáp án." }
        tool:
          type: object
          required: [href, label]
          properties:
            href: { type: string }
            label: { type: string }
        options:
          type: array
          items: { type: string }
          description: Chỉ với `single`.
        statements:
          type: array
          description: Chỉ với `truefalse`.
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }

    Mark:
      description: Điểm của một câu (cùng dạng với learning.yaml).
      type: object
      required: [earned, max, share, correct, complete]
      properties:
        earned: { type: integer, description: 1/100 điểm đạt được. }
        max: { type: integer }
        share: { type: number, minimum: 0, maximum: 1, description: Phần trả lời đúng (phần II là số ý đúng chia 4). }
        correct: { type: boolean }
        complete: { type: boolean, description: Đã trả lời đủ mọi phần của câu. }
        statementsRight: { type: integer, description: Chỉ với phần II. }

    Reveal:
      description: Đáp án và lời giải (cùng dạng với learning.yaml), chỉ có sau khi câu được trả lời (bộ bài tập) hoặc sau khi nộp (đề).
      oneOf:
        - type: object
          required: [type, answerIndex, explanation]
          properties:
            type: { const: single }
            answerIndex: { type: integer }
            explanation: { type: string }
        - type: object
          required: [type, statements, explanation]
          properties:
            type: { const: truefalse }
            statements:
              type: array
              items:
                type: object
                required: [answer, explanation]
                properties:
                  answer: { type: boolean }
                  explanation: { type: string }
            explanation: { type: string }
        - type: object
          required: [type, answer, explanation]
          properties:
            type: { const: short }
            answer: { type: string }
            explanation: { type: string }

    RunAnswerList:
      type: array
      maxItems: 40
      items:
        type: object
        required: [questionId, answer]
        properties:
          questionId: { type: string }
          answer: { $ref: "#/components/schemas/QuestionAnswer" }

    CheckedAnswer:
      type: object
      required: [questionId, answer, mark, reveal]
      properties:
        questionId: { type: string }
        answer: { $ref: "#/components/schemas/QuestionAnswer" }
        mark: { $ref: "#/components/schemas/Mark" }
        reveal: { $ref: "#/components/schemas/Reveal" }

    WorkSheet:
      type: object
      required: [workId, kind, title, courseId, questionCount, parts, attemptsUsed, attemptLimit, firstAttempt, openRunId, assignments]
      properties:
        workId: { type: string, format: uuid }
        kind: { type: string, enum: [exercise, exam] }
        title: { type: string }
        description: { type: string }
        courseId: { type: string }
        durationMinutes: { type: integer }
        passPercent: { type: number }
        questionCount: { type: integer }
        parts:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: integer, minimum: 0 }
          description: Số câu phần I, II, III.
        questions:
          type: array
          description: Chỉ với bộ bài tập, không có đáp án. Đề thi không có (đề chỉ hiện khi bắt đầu lượt làm).
          items: { $ref: "#/components/schemas/PublicQuestion" }
        attemptsUsed: { type: integer, minimum: 0, description: "Số lần mình đã nộp bài này (mọi lượt đã nộp, kể cả lượt đề quá giờ được tự nộp)." }
        attemptLimit: { type: [integer, "null"], description: "Số lần tối đa; null là không giới hạn. Từ 1.1.0 tính cả lượt đã mua." }
        attemptsBought: { type: integer, minimum: 0, description: "Từ 1.1.0: số lượt đã mua đang tính vào giới hạn." }
        canBuyAttempt:
          type: boolean
          description: |
            Từ 1.1.0: mua thêm lượt được ngay: giới hạn đang áp dụng, đã dùng hết lượt, không có lượt đang làm, không có lần mua đang chờ và
            classroom đã nối commerce. Giá lấy ở danh mục của commerce (`skus`).
        pendingAttemptGrantId: { type: [string, "null"], format: uuid, description: "Từ 1.1.0: lần mua thêm lượt đang chờ commerce trả lời, nếu có." }
        firstAttempt: { type: boolean, description: "Chưa nộp lần nào: lần nộp tới được XP (learning quyết, có trần mỗi ngày)." }
        openRunId: { type: [string, "null"], format: uuid, description: "Lượt đang làm dở, nếu có." }
        assignments:
          type: array
          description: Các bài giao của bài này ở các lớp còn chạy của mình.
          items: { $ref: "#/components/schemas/Assignment" }

    WorkRun:
      description: Một lượt đang làm bài của lớp.
      type: object
      required: [id, workId, kind, title, status, startedAt, deadline, serverNow, questions, draft, flags, checked, attemptsUsed, attemptLimit, firstAttempt, assignments]
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        kind: { type: string, enum: [exercise, exam] }
        title: { type: string }
        status: { const: in_progress }
        startedAt: { type: string, format: date-time }
        deadline: { type: [string, "null"], format: date-time, description: Chỉ đề thi; giờ máy chủ quyết định hết giờ. }
        serverNow: { type: string, format: date-time, description: "Giờ máy chủ lúc trả lời, để trình duyệt đếm ngược đúng." }
        durationMinutes: { type: integer }
        passPercent: { type: number }
        questions:
          type: array
          description: Đề của lượt (cố định từ lúc bắt đầu), không có đáp án.
          items: { $ref: "#/components/schemas/PublicQuestion" }
        draft:
          type: object
          description: Đề thi, câu trả lời đã lưu theo mã câu.
          additionalProperties: { $ref: "#/components/schemas/QuestionAnswer" }
        flags:
          type: array
          items: { type: string }
          description: Đề thi, các câu đang đánh dấu xem lại.
        checked:
          type: array
          description: Bộ bài tập, các câu đã trả lời kèm điểm và đáp án.
          items: { $ref: "#/components/schemas/CheckedAnswer" }
        attemptsUsed: { type: integer, minimum: 0, description: Số lần đã nộp trước lượt này. }
        attemptLimit: { type: [integer, "null"], description: "Từ 1.1.0 tính cả lượt đã mua." }
        attemptsBought: { type: integer, minimum: 0, description: "Từ 1.1.0: số lượt đã mua đang tính vào giới hạn." }
        firstAttempt: { type: boolean, description: Lượt này là lần nộp đầu tiên ở bài (được XP). }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }

    RunResult:
      description: Kết quả một lượt đã nộp; có mọi trường của `AttemptResult` (với `attemptId` bằng mã lượt) và thêm đáp án từng câu, XP.
      allOf:
        - $ref: "#/components/schemas/AttemptResult"
        - type: object
          required: [id, workId, kind, title, status, startedAt, submittedAt, timedOut, questions, xp, firstAttempt, xpCapped]
          properties:
            id: { type: string, format: uuid, description: Mã lượt (bằng `attemptId`). }
            workId: { type: string, format: uuid }
            kind: { type: string, enum: [exercise, exam] }
            title: { type: string }
            status: { const: submitted }
            startedAt: { type: string, format: date-time }
            submittedAt: { type: string, format: date-time }
            timedOut: { type: boolean, description: Nộp quá giờ nên chỉ chấm bản nháp đã lưu. }
            questions:
              type: array
              items:
                type: object
                required: [questionId, answer, mark, reveal]
                properties:
                  questionId: { type: string }
                  answer:
                    oneOf:
                      - { $ref: "#/components/schemas/QuestionAnswer" }
                      - { type: "null" }
                  mark: { $ref: "#/components/schemas/Mark" }
                  reveal: { $ref: "#/components/schemas/Reveal" }
            xp:
              type: [integer, "null"]
              description: XP learning đã cộng cho lượt này; null khi learning chưa xác nhận (sẽ cộng sau). 0 với lần làm lại.
            firstAttempt: { type: boolean }
            xpCapped: { type: boolean, description: XP bị cắt vì đã chạm trần mỗi ngày của bài lớp. }
            xpStatus:
              type: string
              enum: [confirmed, pending, none, failed]
              description: |
                Từ 0.8.1. `confirmed` learning đã trả lời; `pending` chưa xác nhận, `xp` là null và sẽ cộng sau; `none` không có XP để cộng
                (lần làm lại, hoặc không có learning); `failed` learning từ chối hẳn kết quả này, sẽ không cộng: `xp` là 0 (không để null mãi).

    # ---------------------------------------------------------------- 1.1.0 (M9 lát 9d)

    ExtraAttemptRequest:
      type: object
      additionalProperties: false
      properties:
        quantity: { type: integer, minimum: 1, maximum: 1, default: 1, description: "Mỗi lần một lượt (PHASE2 câu 6)." }
        expectedPrice:
          type: integer
          minimum: 1
          description: Giá một lượt web đã cho học sinh thấy (từ danh mục của commerce); khác giá hiện tại thì 409 `price_changed`, không trừ gì.

    ExtraAttemptGrant:
      type: object
      required: [id, workId, quantity, status, createdAt, grantedAt, failedAt, failure, price, attemptsUsed, attemptLimit, attemptsBought]
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [pending, granted, failed]
          description: "`pending`: đang chờ commerce, chưa có lượt, chưa chắc đã trừ Xu; `granted`: đã trừ Xu và có lượt; `failed`: không trừ Xu, không có lượt."
        createdAt: { type: string, format: date-time }
        grantedAt: { type: [string, "null"], format: date-time }
        failedAt: { type: [string, "null"], format: date-time }
        failure:
          type: [string, "null"]
          enum: [insufficient_funds, price_changed, purchase_failed, null]
          description: Vì sao thất bại (cùng mã lỗi 409 đã trả).
        price: { type: [integer, "null"], description: "Số Xu đã trừ khi `granted`; null khi chưa hoặc không trừ." }
        attemptsUsed: { type: integer, minimum: 0 }
        attemptLimit: { type: [integer, "null"], description: "Giới hạn sau lần mua này (đã cộng nếu `granted`)." }
        attemptsBought: { type: integer, minimum: 0 }
