      description: |
        Mỗi bài giao mỗi học sinh một bài nộp. Giáo viên tính điểm trung bình, người chưa nộp và câu cả lớp sai nhiều nhất từ đây.
        Học sinh đã rời lớp không còn trong kết quả.
      parameters:
