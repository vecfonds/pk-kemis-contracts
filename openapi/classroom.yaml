openapi: 3.1.0
info:
  title: PkKemis classroom
  version: 1.2.0
  summary: Lớp học, suất học, học sinh, bài giáo viên soạn, bài giao, làm bài và kết quả.
  description: |
    Lát A và B của M4 (docs/backend/M4-CLASSROOM.md): tạo lớp, vào lớp bằng mã, suất học và hạn dùng, mua thêm suất, gia hạn, rời lớp, xóa học sinh,
    bài giáo viên soạn (bộ bài tập, đề thi) và giao bài cho lớp. Lát D: giáo viên bị thu vai trò (identity đổi về học sinh) vẫn thấy các lớp mình đã lập (`formerlyOwned`) và gia hạn được, không làm gì khác. Lát C: học sinh làm bài của lớp (máy chủ chấm lại từ câu trả lời), bài nộp, và kết quả cho giáo viên. Chưa có XP cho bài của lớp.

    0.8.0 (docs/backend/M6-CONTENT.md): danh mục khóa và câu ngân hàng lấy từ learning (L1), câu ngân hàng được chụp vào bài lúc lưu;
    tiến độ khóa và hoạt động gần nhất của học sinh cho giáo viên (L3); lượt làm bài của lớp ở máy chủ: đề không đáp án, đáp án sau từng câu
    (bộ bài tập) hoặc sau khi nộp (đề), đồng hồ đề do máy chủ giữ, XP gửi sang learning (L6). Mỗi thao tác mới ghi lát cài nó ở `x-slice`.

    0.8.1 (sửa sau soát M6, chỉ thêm): `GET /v1/works/{workId}/paper` không còn đáp án với học sinh; nộp một lần cũng bị giới hạn lượt của lớp
    dùng thử; mã câu tự soạn do máy chủ cấp; `RunResult.xpStatus`.

    1.0.0 (docs/backend/M7-DEBT-EMAIL.md): **thay đổi phá vỡ có chủ đích** (lát 7a, chủ dự án duyệt kế hoạch giai đoạn 2 ngày 15/10/2026): gỡ
    hai đường đã đánh dấu bỏ từ 0.8.0, `GET /v1/works/{workId}/paper` và `POST /v1/works/{workId}/attempts` (cùng schema `WorkPaper`); học
    sinh làm bài của lớp chỉ qua `sheet`, `runs`, `/v1/runs/**`. Chỉ web gọi service này và web đã thôi dùng hai đường đó từ L6. Thêm (lát 7c):
    `GET /v1/classes/overview`, mọi lớp của giáo viên (hoặc admin) kèm chi tiết và bài nộp trong một lời gọi.

    1.1.0 (docs/backend/M9-COMMERCE.md, lát 9d, chỉ thêm): học sinh hết lượt ở lớp dùng thử **mua thêm lượt bằng Xu**. classroom giữ quyền
    lượt đã mua (`attempt_grants`) và luật giới hạn; commerce giữ ví và giá (`POST /internal/wallet/charges` của commerce.yaml), classroom
    không bao giờ thấy số dư. Thêm `POST /v1/works/{workId}/extra-attempts`, `GET /v1/works/{workId}/extra-attempts/{grantId}`;
    `attemptsBought`, `canBuyAttempt`, `pendingAttemptGrantId` ở `WorkSheet`; `attemptsBought` ở `WorkRun` và kết quả. `attemptLimit` giữ
    nghĩa "số lần tối đa của học sinh này ở bài này", nay là 5 cộng số lượt đã mua (vẫn null khi không giới hạn).

    1.2.0 (docs/backend/M10-SOCIAL.md, lát 10c, chỉ thêm): classroom phát sự kiện lên Kafka (topic `classroom.events`, asyncapi/pkkemis.yaml
    0.3.0, khóa bản ghi là mã lớp): học sinh vào, rời lớp; bài được giao, bị xóa; học sinh nộp bài lần đầu; lớp bị xóa. social nghe để biết
    học sinh nào cùng lớp (lời mời "Bạn cùng lớp", gợi ý kết bạn; M13: học sinh nhắn giáo viên của lớp) và để thông báo. Thêm
    `GET /internal/class-members` (khóa riêng của social, `socialKey`) để social dựng lại bản sao khi trống hay mất sự kiện. Không thao tác REST
    nào đổi hành vi hay phản hồi.

    - Từ 1.0.0 lại chỉ thêm, không xóa hay đổi nghĩa của trường đã phát hành.
    - Token là access token của identity (xem identity.yaml); service tự kiểm bằng khóa công khai.
    - **Máy chủ quyết định** giờ, giá, số suất, hạn dùng, trạng thái lớp, số lớp dùng thử và mã lớp. Máy khách chỉ gửi ý định (số suất, loại mua); số tiền gửi lên bị bỏ qua.
    - **Thanh toán chỉ mô phỏng** ở giai đoạn 1: service ghi lần mua với số tiền tự tính, chưa có cổng thanh toán.
    - Lớp không phải của mình trông như không tồn tại (404).
    - Lỗi theo RFC 9457 (`application/problem+json`), cùng dạng với identity.
servers:
  - url: http://classroom:8080
    description: Mạng Docker Compose (giai đoạn 1, chưa có gateway)
security:
  - bearerAuth: []
tags:
  - name: works
    description: Bộ bài tập và đề thi giáo viên tự soạn
  - name: submissions
    description: Làm bài của lớp, bài nộp, kết quả
  - name: assignments
    description: Giao bài cho lớp
  - name: classes
    description: Lớp, mã lớp, học sinh
  - name: seats
    description: Suất học và mua suất
  - name: internal
    description: Chỉ service gọi nhau (X-Internal-Key); không mở ra ngoài

paths:
  /v1/courses:
    get:
      tags: [classes]
      operationId: listCourses
      summary: Các khóa học có thể mở lớp
      description: |
        Khóa sắp ra mắt (`comingSoon`) chưa mở lớp được vì chưa bán suất.
        Từ 0.8.0 (L1) là danh mục của learning (khóa, chương), classroom lưu lại và làm mới tối đa mỗi 60 giây; learning không trả lời thì
        dùng bản đã lưu.
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Course" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/classes:
    get:
      tags: [classes]
      operationId: listClasses
      summary: Các lớp của mình
      description: Học sinh thấy các lớp đã vào, giáo viên thấy lớp mình lập (kèm số lớp dùng thử còn lại), admin thấy mọi lớp.
      responses:
        "200":
          description: Danh sách theo thứ tự khối rồi tên lớp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ClassSummary" }
                  trialsLeft:
                    type: integer
                    description: Chỉ với giáo viên; số lớp dùng thử còn mở được (tối đa 5, lớp dùng thử đã mở chính thức vẫn tính).
                  formerlyOwned:
                    type: array
                    description: |
                      Chỉ với tài khoản học sinh đã từng lập lớp (giáo viên bị admin thu vai trò): các lớp đó. Lớp vẫn còn; tài khoản chỉ gia hạn được
                      (`POST /v1/classes/{id}/purchases` với `renewal`), không quản lý, giao bài, xem kết quả hay thêm bớt học sinh. Trả lại vai trò thì hết trường này.
                    items: { $ref: "#/components/schemas/ClassSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [classes]
      operationId: createClass
      summary: Mở lớp (giáo viên)
      description: |
        Mở lớp dùng thử (20 suất, 7 ngày kể cả ngày mở) hoặc mua suất cho năm học đang diễn ra. Mã lớp tạo tự động từ tên lớp.
        Mỗi giáo viên mở tối đa 5 lớp dùng thử. Khóa sắp ra mắt không mở được.
        Giá: 50.000 ₫/suất cho cả năm, tính theo số tháng còn lại; chỉ lúc mở lớp mới giảm theo số suất (từ 20: 10%, từ 50: 20%).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClassRequest" }
      responses:
        "201":
          description: Lớp vừa mở
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Hết lớp dùng thử (`trial_limit_reached`) hoặc khóa sắp ra mắt (`course_coming_soon`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/classes/join:
    post:
      tags: [classes]
      operationId: joinClass
      summary: Vào lớp bằng mã (học sinh)
      description: |
        Mã gõ thế nào cũng được ("hoa-10a1", " HOA-10A1 "). Mỗi học sinh giữ một suất. Đoán mã bị giới hạn: 10 mã sai trong 15 phút thì bị chặn (429).
        Lớp đã đủ suất, hoặc đã hết hạn, không vào được.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Lớp vừa vào
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSummary" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không có lớp nào có mã này (`class_code_unknown`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Đã ở trong lớp (`already_member`), lớp đủ suất (`class_full`) hoặc hết hạn (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/classes/overview:
    get:
      tags: [classes]
      operationId: getClassesOverview
      x-slice: 7c
      summary: Mọi lớp của mình kèm chi tiết và bài nộp, trong một lời gọi (giáo viên, admin)
      description: |
        Để trang Lớp học của giáo viên không phải gọi `GET /v1/classes/{id}` và `GET /v1/classes/{id}/submissions` cho từng lớp. Giáo viên: các
        lớp mình lập; admin: mọi lớp (chỉ xem). Học sinh 403 (học sinh, kể cả người từng lập lớp, dùng `GET /v1/classes`).
        - `items`: mỗi lớp đúng như `GET /v1/classes/{id}` trả cho người gọi (học sinh, suất, tiến độ khóa), cùng thứ tự với `GET /v1/classes`.
          Tiến độ lấy từ learning bằng một lời gọi cho mỗi khóa có lớp (không phải mỗi lớp); learning không trả lời thì các lớp vẫn có, với
          `progressUnavailable` = true.
        - `submissions`: bài nộp của mọi lớp trong `items` mà người gọi được xem kết quả, như `GET /v1/classes/{id}/submissions`; lớp nào đường
          lẻ từ chối (ví dụ lớp bị admin cấm giáo viên) thì không có bài nộp ở đây, các lớp khác không ảnh hưởng.
      responses:
        "200":
          description: Các lớp và bài nộp
          content:
            application/json:
              schema:
                type: object
                required: [items, submissions]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ClassDetail" }
                  submissions:
                    type: array
                    items: { $ref: "#/components/schemas/Submission" }
                  trialsLeft:
                    type: integer
                    description: Chỉ với giáo viên; như `GET /v1/classes`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/classes/{classId}:
    get:
      tags: [classes]
      operationId: getClass
      summary: Một lớp
      description: |
        Giáo viên của lớp và admin thấy thêm danh sách học sinh và các lần mua suất; học sinh trong lớp chỉ thấy phần chung.
        Học sinh không bao giờ thấy email hay ngày sinh của nhau, giáo viên chỉ thấy tên và ảnh đại diện.
        Từ 0.8.0 (L3) mỗi học sinh trong danh sách có thêm tiến độ khóa của lớp và lần hoạt động gần nhất, lấy từ learning bằng một lời gọi cho
        cả lớp; learning không trả lời thì lớp vẫn trả về, các trường đó vắng và `progressUnavailable` = true.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      responses:
        "200":
          description: Lớp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{classId}/purchases:
    post:
      tags: [seats]
      operationId: buySeats
      summary: Mở lớp chính thức, mua thêm suất hoặc gia hạn (giáo viên của lớp)
      description: |
        Người lập lớp bị thu vai trò giáo viên chỉ gia hạn (`renewal`) được; `open` và `extra` thì 403.
        Lớp bị admin cấm giáo viên (`teacherRevoked`, 403 `class_revoked`) hoặc bị ẩn (403 `class_hidden`) thì không mua được, và mua suất không bỏ lệnh cấm.
        Lớp hết hạn (`term.status` là `expired`) thì giáo viên chỉ xem; mua suất (mở chính thức, gia hạn) là cách mở lại toàn quyền.
        - `open`: lớp đang dùng thử mở chính thức; chấm dứt dùng thử ngay; số suất ít nhất bằng số học sinh; được giảm theo số suất.
        - `extra`: thêm suất cho lớp đang chạy bằng suất đã mua, dùng tới hết năm học; giá lẻ.
        - `renewal`: gia hạn sang năm học sau (nối ngay sau năm đã trả, hoặc từ bây giờ nếu đã hết hạn); số suất ít nhất bằng số học sinh; giá lẻ; chỉ một lần cho mỗi năm học.
        Tối đa 500 suất mỗi lần. Số tiền do máy chủ tính theo số tháng còn lại và mức giảm; thanh toán chỉ mô phỏng.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseRequest" }
      responses:
        "201":
          description: Lớp sau khi mua, kèm giấy phép mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Lớp chưa ở trạng thái mua được loại suất này (`invalid_purchase`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/works:
    get:
      tags: [works]
      operationId: listWorks
      summary: Bài đã soạn của mình
      description: Giáo viên thấy bài của mình, admin thấy bài của mọi giáo viên; học sinh không có (403).
      responses:
        "200":
          description: Danh sách theo thứ tự soạn
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [works]
      operationId: createWork
      summary: Soạn một bộ bài tập hoặc đề thi (giáo viên)
      description: |
        Máy chủ kiểm kỹ và chỉ giữ các trường nó biết. Tối đa 40 câu; câu lấy từ ngân hàng PkKemis phải thuộc khóa của bài; câu tự soạn có mã bắt đầu bằng `tq-` (từ 0.8.1 mã do máy chủ cấp: mã client gửi chỉ được giữ khi câu đã thuộc chính bài này)
        và đủ phần theo dạng (4 phương án khác nhau và phương án đúng; hoặc 4 ý a đến d có Đúng/Sai; hoặc đáp án số tối đa 4 kí tự, dấu phẩy thập phân).
        Đề thi cần thời gian (5 đến 180 phút) và điểm đạt (0 đến 100, tức thang 10 nhân 10); bộ bài tập thì không.
        Từ 0.8.0 (L1): câu ngân hàng được kiểm với learning (có thật, thuộc khóa của bài, chưa nghỉ) và **chụp nguyên câu kèm đáp án vào bài**
        (`WorkItem.question`); learning không trả lời thì 503 `content_unavailable` (bài chỉ có câu tự soạn vẫn lưu được).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkInput" }
      responses:
        "201":
          description: Bài vừa soạn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ContentUnavailable" }

  /v1/works/{workId}:
    get:
      tags: [works]
      operationId: getWork
      summary: Một bài đã soạn, kèm đáp án (giáo viên của bài hoặc admin)
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "200":
          description: Bài
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [works]
      operationId: updateWork
      summary: Sửa bài (giáo viên của bài)
      description: |
        Thay toàn bộ nội dung. Các bài đã giao theo tên và loại mới của bài. Không đổi khóa học được khi bài đã giao cho lớp (409 `work_in_use`).
        Khi đã có học sinh nộp bài thì câu hỏi và thông số được giữ nguyên để kết quả khớp với đề (409 `work_locked`); muốn đổi, nhân bản rồi sửa bản sao.
        Từ 0.8.0 (L1): câu ngân hàng được chụp lại như khi soạn mới (lấy bản hiện tại của learning); 503 `content_unavailable` như trên.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkInput" }
      responses:
        "200":
          description: Bài sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
