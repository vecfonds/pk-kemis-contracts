        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Mọi lớp được giao bài đều tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/works/{workId}/attempts:
    post:
      tags: [submissions]
      operationId: submitWorkAttempt
      summary: Nộp một lần làm bài (học sinh)
      deprecated: true
      description: |
        **Bỏ từ 0.8.0** (L6): không có đồng hồ đề, không giấu đáp án. Dùng `/v1/works/{workId}/runs` và `/v1/runs/**`. Web thôi gọi ở L6;
        gỡ hẳn khi chủ dự án đồng ý. Trong lúc còn, lần nộp ở đây cũng được gửi sang learning như lượt làm (XP lần đầu, sổ tay lỗi sai).

        Máy chủ chấm lại từ câu trả lời. Lần làm đầu tiên của học sinh ở mỗi bài giao là **bài nộp** của bài giao đó (các lần sau chỉ để luyện, không đổi bài nộp);
        nếu bài được giao cho nhiều lớp của học sinh thì lần đầu nộp cho tất cả. Lớp đang dùng thử: tối đa 5 lần mỗi bài (409 `attempt_limit_reached`);
        có lớp đã mua suất thì không giới hạn. Nộp quá hạn vẫn được, bài nộp được tính là nộp muộn.
        Số giây do máy khách báo được cắt về thời gian thật tối đa của đề thi.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    required: [questionId, answer]
                    properties:
                      questionId: { type: string }
                      answer: { $ref: "#/components/schemas/QuestionAnswer" }
                seconds: { type: number, minimum: 0 }
      responses:
        "201":
          description: Kết quả lần làm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Hết lượt (`attempt_limit_reached`) hoặc mọi lớp tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/me/submissions:
    get:
      tags: [submissions]
      operationId: listMySubmissions
      summary: Bài nộp của mình (học sinh)
