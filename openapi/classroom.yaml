      description: |
        Chỉ học sinh của một lớp còn chạy (không tạm khóa) đã được giao bài này; khác đi là 404 (không phải bài giao cho mình) hoặc 409 `class_expired`
        (mọi lớp được giao đều đã hết hạn). Đề kèm đáp án để màn hình luyện tập chấm ngay từng câu; **máy chủ không tin điểm máy khách tính**, chỉ lưu điểm
        nó tự chấm lại từ câu trả lời gửi lên. Giới hạn đáp án lộ ra trình duyệt: xem docs/backend/M4-CLASSROOM.md.

        **Từ 0.8.1:** học sinh nhận câu như `sheet` (không `answerIndex`, `answer`, `explanation`, `statements[].answer`); đáp án chỉ đến
        qua `/runs`. Giáo viên và admin của lớp vẫn nhận đủ đáp án.

        **Bỏ từ 0.8.0** (L6): trả đáp án cho học sinh. Dùng `GET /v1/works/{workId}/sheet` và `/v1/works/{workId}/runs`. Web thôi gọi ở L6;
        gỡ hẳn khi chủ dự án đồng ý (docs/backend/M6-CONTENT.md, câu hỏi 8). Không bao giờ mở ra ngoài mạng nội bộ.
