openapi: 3.1.0
info:
  title: PkKemis classroom
  version: 0.3.0
  summary: Lớp học, suất học, học sinh, bài giáo viên soạn, bài giao, làm bài và kết quả.
  description: |
    Lát A và B của M4 (docs/backend/M4-CLASSROOM.md): tạo lớp, vào lớp bằng mã, suất học và hạn dùng, mua thêm suất, gia hạn, rời lớp, xóa học sinh,
    bài giáo viên soạn (bộ bài tập, đề thi) và giao bài cho lớp. Lát C: học sinh làm bài của lớp (máy chủ chấm lại từ câu trả lời), bài nộp, và kết quả cho giáo viên. Chưa có XP cho bài của lớp.

    - Chỉ thêm, không xóa hay đổi nghĩa của trường đã phát hành.
    - Token là access token của identity (xem identity.yaml); service tự kiểm bằng khóa công khai.
    - **Máy chủ quyết định** giờ, giá, số suất, hạn dùng, trạng thái lớp, số lớp dùng thử và mã lớp. Máy khách chỉ gửi ý định (số suất, loại mua); số tiền gửi lên bị bỏ qua.
    - **Thanh toán chỉ mô phỏng** ở giai đoạn 1: service ghi lần mua với số tiền tự tính, chưa có cổng thanh toán.
    - Lớp không phải của mình trông như không tồn tại (404).
    - Lỗi theo RFC 9457 (`application/problem+json`), cùng dạng với identity.
servers:
  - url: http://classroom:8080
    description: Mạng Docker Compose (giai đoạn 1, chưa có gateway)
security:
  - bearerAuth: []
tags:
  - name: works
    description: Bộ bài tập và đề thi giáo viên tự soạn
  - name: submissions
    description: Làm bài của lớp, bài nộp, kết quả
  - name: assignments
    description: Giao bài cho lớp
  - name: classes
    description: Lớp, mã lớp, học sinh
  - name: seats
    description: Suất học và mua suất

paths:
  /v1/courses:
    get:
      tags: [classes]
      operationId: listCourses
      summary: Các khóa học có thể mở lớp
      description: Khóa sắp ra mắt (`comingSoon`) chưa mở lớp được vì chưa bán suất.
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Course" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/classes:
    get:
      tags: [classes]
      operationId: listClasses
      summary: Các lớp của mình
      description: Học sinh thấy các lớp đã vào, giáo viên thấy lớp mình lập (kèm số lớp dùng thử còn lại), admin thấy mọi lớp.
      responses:
        "200":
          description: Danh sách theo thứ tự khối rồi tên lớp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ClassSummary" }
                  trialsLeft:
                    type: integer
                    description: Chỉ với giáo viên; số lớp dùng thử còn mở được (tối đa 5, lớp dùng thử đã mở chính thức vẫn tính).
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [classes]
      operationId: createClass
      summary: Mở lớp (giáo viên)
      description: |
        Mở lớp dùng thử (20 suất, 7 ngày kể cả ngày mở) hoặc mua suất cho năm học đang diễn ra. Mã lớp tạo tự động từ tên lớp.
        Mỗi giáo viên mở tối đa 5 lớp dùng thử. Khóa sắp ra mắt không mở được.
        Giá: 50.000 ₫/suất cho cả năm, tính theo số tháng còn lại; chỉ lúc mở lớp mới giảm theo số suất (từ 20: 10%, từ 50: 20%).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClassRequest" }
      responses:
        "201":
          description: Lớp vừa mở
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Hết lớp dùng thử (`trial_limit_reached`) hoặc khóa sắp ra mắt (`course_coming_soon`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/classes/join:
    post:
      tags: [classes]
      operationId: joinClass
      summary: Vào lớp bằng mã (học sinh)
      description: |
        Mã gõ thế nào cũng được ("hoa-10a1", " HOA-10A1 "). Mỗi học sinh giữ một suất. Đoán mã bị giới hạn: 10 mã sai trong 15 phút thì bị chặn (429).
        Lớp đã đủ suất, hoặc đã hết hạn, không vào được.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Lớp vừa vào
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSummary" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không có lớp nào có mã này (`class_code_unknown`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Đã ở trong lớp (`already_member`), lớp đủ suất (`class_full`) hoặc hết hạn (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/classes/{classId}:
    get:
      tags: [classes]
      operationId: getClass
      summary: Một lớp
      description: |
        Giáo viên của lớp và admin thấy thêm danh sách học sinh và các lần mua suất; học sinh trong lớp chỉ thấy phần chung.
        Học sinh không bao giờ thấy email hay ngày sinh của nhau, giáo viên chỉ thấy tên và ảnh đại diện.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      responses:
        "200":
          description: Lớp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{classId}/purchases:
    post:
      tags: [seats]
      operationId: buySeats
      summary: Mở lớp chính thức, mua thêm suất hoặc gia hạn (giáo viên của lớp)
      description: |
        - `open`: lớp đang dùng thử mở chính thức; chấm dứt dùng thử ngay; số suất ít nhất bằng số học sinh; được giảm theo số suất.
        - `extra`: thêm suất cho lớp đang chạy bằng suất đã mua, dùng tới hết năm học; giá lẻ.
        - `renewal`: gia hạn sang năm học sau (nối ngay sau năm đã trả, hoặc từ bây giờ nếu đã hết hạn); số suất ít nhất bằng số học sinh; giá lẻ; chỉ một lần cho mỗi năm học.
        Tối đa 500 suất mỗi lần. Số tiền do máy chủ tính theo số tháng còn lại và mức giảm; thanh toán chỉ mô phỏng.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseRequest" }
      responses:
        "201":
          description: Lớp sau khi mua, kèm giấy phép mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Lớp chưa ở trạng thái mua được loại suất này (`invalid_purchase`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/works:
    get:
      tags: [works]
      operationId: listWorks
      summary: Bài đã soạn của mình
      description: Giáo viên thấy bài của mình, admin thấy bài của mọi giáo viên; học sinh không có (403).
      responses:
        "200":
          description: Danh sách theo thứ tự soạn
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [works]
      operationId: createWork
      summary: Soạn một bộ bài tập hoặc đề thi (giáo viên)
      description: |
        Máy chủ kiểm kỹ và chỉ giữ các trường nó biết. Tối đa 40 câu; câu lấy từ ngân hàng PkKemis phải thuộc khóa của bài; câu tự soạn có mã bắt đầu bằng `tq-`
        và đủ phần theo dạng (4 phương án khác nhau và phương án đúng; hoặc 4 ý a đến d có Đúng/Sai; hoặc đáp án số tối đa 4 kí tự, dấu phẩy thập phân).
        Đề thi cần thời gian (5 đến 180 phút) và điểm đạt (0 đến 100, tức thang 10 nhân 10); bộ bài tập thì không.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkInput" }
      responses:
        "201":
          description: Bài vừa soạn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/works/{workId}:
    get:
      tags: [works]
      operationId: getWork
      summary: Một bài đã soạn, kèm đáp án (giáo viên của bài hoặc admin)
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "200":
          description: Bài
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [works]
      operationId: updateWork
      summary: Sửa bài (giáo viên của bài)
      description: |
        Thay toàn bộ nội dung. Các bài đã giao theo tên và loại mới của bài. Không đổi khóa học được khi bài đã giao cho lớp (409 `work_in_use`).
        Khi đã có học sinh nộp bài thì câu hỏi và thông số được giữ nguyên để kết quả khớp với đề (409 `work_locked`); muốn đổi, nhân bản rồi sửa bản sao.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkInput" }
      responses:
        "200":
          description: Bài sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bài đang giao cho lớp nên không đổi khóa (`work_in_use`), hoặc đã có học sinh nộp (`work_locked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [works]
      operationId: deleteWork
      summary: Xóa bài (giáo viên của bài)
      description: Xóa cả các bài đã giao của nó.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "204": { description: Đã xóa }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/works/{workId}/duplicate:
    post:
      tags: [works]
      operationId: duplicateWork
      summary: Nhân bản bài để sửa (giáo viên của bài)
      description: |
        Bản sao có tên "Bản sao: …"; các câu tự soạn có mã mới nên kết quả của bài gốc vẫn thuộc bài gốc.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "201":
          description: Bản sao
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{classId}/assignments:
    post:
      tags: [assignments]
      operationId: assignWork
      summary: Giao một bài đã soạn cho lớp (giáo viên của lớp)
      description: |
        Chỉ bài của chính giáo viên và soạn cho khóa của lớp. Hạn nộp là ngày từ hôm nay trở đi (theo giờ Việt Nam). Lớp đang tạm khóa chưa giao thêm được (409 `class_expired`).
        Giao cùng một bài hai lần cho một lớp là được.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId, dueAt]
              properties:
                workId: { type: string, format: uuid }
                dueAt: { type: string, format: date-time }
                note: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Bài vừa giao
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Lớp đang tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/classes/{classId}/assignments/{assignmentId}:
    delete:
      tags: [assignments]
      operationId: removeAssignment
      summary: Bỏ một bài đã giao (giáo viên của lớp)
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Đã bỏ }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{classId}/leave:
    post:
      tags: [classes]
      operationId: leaveClass
      summary: Rời lớp (học sinh)
      description: Suất của học sinh trống lại cho người khác.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      responses:
        "204": { description: Đã rời lớp }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{classId}/members/{studentId}:
    delete:
      tags: [classes]
      operationId: removeStudent
      summary: Xóa một học sinh khỏi lớp (giáo viên của lớp)
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Đã xóa }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/works/{workId}/paper:
    get:
      tags: [submissions]
      operationId: getWorkPaper
      summary: Đề của một bài giao cho mình (học sinh)
      description: |
        Chỉ học sinh của một lớp còn chạy (không tạm khóa) đã được giao bài này; khác đi là 404 (không phải bài giao cho mình) hoặc 409 `class_expired`
        (mọi lớp được giao đều đã hết hạn). Đề kèm đáp án để màn hình luyện tập chấm ngay từng câu; **máy chủ không tin điểm máy khách tính**, chỉ lưu điểm
        nó tự chấm lại từ câu trả lời gửi lên. Giới hạn đáp án lộ ra trình duyệt: xem docs/backend/M4-CLASSROOM.md.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      responses:
        "200":
          description: Đề
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPaper" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Mọi lớp được giao bài đều tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/works/{workId}/attempts:
    post:
      tags: [submissions]
      operationId: submitWorkAttempt
      summary: Nộp một lần làm bài (học sinh)
      description: |
        Máy chủ chấm lại từ câu trả lời. Lần làm đầu tiên của học sinh ở mỗi bài giao là **bài nộp** của bài giao đó (các lần sau chỉ để luyện, không đổi bài nộp);
        nếu bài được giao cho nhiều lớp của học sinh thì lần đầu nộp cho tất cả. Lớp đang dùng thử: tối đa 5 lần mỗi bài (409 `attempt_limit_reached`);
        có lớp đã mua suất thì không giới hạn. Nộp quá hạn vẫn được, bài nộp được tính là nộp muộn.
        Số giây do máy khách báo được cắt về thời gian thật tối đa của đề thi.
      parameters:
        - { $ref: "#/components/parameters/WorkId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    required: [questionId, answer]
                    properties:
                      questionId: { type: string }
                      answer: { $ref: "#/components/schemas/QuestionAnswer" }
                seconds: { type: number, minimum: 0 }
      responses:
        "201":
          description: Kết quả lần làm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Hết lượt (`attempt_limit_reached`) hoặc mọi lớp tạm khóa (`class_expired`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/me/submissions:
    get:
      tags: [submissions]
      operationId: listMySubmissions
      summary: Bài nộp của mình (học sinh)
      description: Cả của lớp đã tạm khóa. Bài giao đã bị bỏ thì bài nộp cũng mất.
      responses:
        "200":
          description: Bài nộp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/classes/{classId}/submissions:
    get:
      tags: [submissions]
      operationId: listClassSubmissions
      summary: Bài nộp của cả lớp (giáo viên của lớp hoặc admin)
      description: |
        Mỗi bài giao mỗi học sinh một bài nộp. Giáo viên tính điểm trung bình, người chưa nộp và câu cả lớp sai nhiều nhất từ đây.
        Học sinh đã rời lớp không còn trong kết quả.
      parameters:
        - { $ref: "#/components/parameters/ClassId" }
      responses:
        "200":
          description: Bài nộp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của identity (RS256).

  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkId:
      name: workId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: Dữ liệu gửi lên không hợp lệ (`validation_failed`), kèm lỗi từng trường
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ / hết hạn (`token_invalid`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Sai vai trò cho thao tác này (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Không tìm thấy, hoặc không phải của mình (`not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Đoán mã lớp quá nhiều lần (`too_many_attempts`); chờ theo `Retry-After`
      headers:
        Retry-After:
          description: Số giây phải chờ
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Lỗi theo RFC 9457. Cùng dạng với identity; có thêm các mã của service này.
      required: [title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - validation_failed
            - token_invalid
            - forbidden
            - not_found
            - class_code_unknown
            - already_member
            - class_full
            - class_expired
            - trial_limit_reached
            - course_coming_soon
            - invalid_purchase
            - work_locked
            - work_in_use
            - too_many_attempts
            - attempt_limit_reached
            - internal_error
        detail: { type: string, description: "Thông báo tiếng Việt, hiển thị được cho người dùng." }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Course:
      type: object
      required: [id, title, grade, comingSoon]
      properties:
        id: { type: string }
        title: { type: string }
        grade: { type: integer, minimum: 10, maximum: 12 }
        comingSoon: { type: boolean }

    ClassPerson:
      type: object
      required: [id, fullName, avatarInitials]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        avatarInitials: { type: string }

    ClassTerm:
      type: object
      description: Suất, trạng thái và hạn của lớp ngay lúc này.
      required: [status, total, used, free, trialOnly]
      properties:
        status: { type: string, enum: [trial, active, expired], description: "`expired` là tạm khóa: chưa gia hạn hoặc hết dùng thử." }
        total: { type: integer, description: "Số suất đang chạy, cũng là số học sinh tối đa." }
        used: { type: integer, description: Số học sinh trong lớp; mỗi người giữ một suất. }
        free: { type: integer }
        expiresAt: { type: string, format: date-time, description: "Hết kỳ đang chạy, hoặc kỳ cuối khi đã hết hạn." }
        schoolYear: { type: string, description: Năm học của kỳ đã trả gần nhất; vắng khi chỉ mới dùng thử. }
        renewedUntil: { type: string, format: date-time, description: Đã trả cho một kỳ sau; lớp chạy tới lúc đó. }
        trialOnly: { type: boolean, description: Lớp chưa từng trả tiền. }

    ClassSummary:
      type: object
      required: [id, name, grade, schoolYear, teacherId, courseId, joinCode, createdAt, term, teacher, assignments]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade: { type: integer }
        schoolYear: { type: string, description: '"2026–2027"' }
        school: { type: string }
        teacherId: { type: string, format: uuid }
        courseId: { type: string }
        joinCode: { type: string, description: 'Học sinh gõ để vào lớp, ví dụ "HOA-10A1".' }
        createdAt: { type: string, format: date-time }
        term: { $ref: "#/components/schemas/ClassTerm" }
        teacher: { $ref: "#/components/schemas/ClassPerson" }
        assignments:
          type: array
          description: |
            Bài đã giao cho lớp, hạn nộp gần nhất trước. Giáo viên của lớp và admin luôn thấy; học sinh chỉ thấy khi lớp đang chạy.
            Chỉ có tên, loại, hạn và lời dặn, không có câu hỏi hay đáp án.
          items: { $ref: "#/components/schemas/Assignment" }

    ClassDetail:
      allOf:
        - $ref: "#/components/schemas/ClassSummary"
        - type: object
          properties:
            licenses:
              type: array
              description: Chỉ giáo viên của lớp và admin; mới nhất trước.
              items: { $ref: "#/components/schemas/License" }
            members:
              type: array
              description: Chỉ giáo viên của lớp và admin.
              items:
                allOf:
                  - $ref: "#/components/schemas/ClassPerson"
                  - type: object
                    required: [joinedAt]
                    properties:
                      joinedAt: { type: string, format: date-time }

    License:
      type: object
      required: [id, classId, courseId, kind, seats, schoolYear, startsAt, expiresAt, months, discountPercent, amount, createdAt]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        courseId: { type: string }
        kind: { type: string, enum: [trial, open, extra, renewal] }
        seats: { type: integer }
        schoolYear: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        payer: { type: string, enum: [teacher, school], description: Vắng với dùng thử. }
        payerName: { type: string }
        orderCode: { type: string, description: 'PK + yymmdd + 4 số.' }
        months: { type: integer, description: "Số tháng tính tiền; 11 là đủ giá, 0 với dùng thử." }
        discountPercent: { type: integer, description: Chỉ lúc mở lớp. }
        amount: { type: integer, description: "VND đã trả (mô phỏng), sau khi tính theo tháng và giảm giá." }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [payer, payerName]
      properties:
        payer: { type: string, enum: [teacher, school] }
        payerName: { type: string, minLength: 1, maxLength: 80, description: Tên ghi trên hóa đơn. }

    CreateClassRequest:
      type: object
      required: [name, grade, courseId, opening]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        grade: { type: integer, minimum: 10, maximum: 12 }
        courseId: { type: string, description: Phải thuộc khối đã chọn và đã mở. }
        schoolYear: { type: string, description: Nếu gửi thì phải là năm học đang diễn ra. }
        school: { type: string, maxLength: 80 }
        opening:
          oneOf:
            - type: object
              required: [plan]
              properties:
                plan: { const: trial }
            - allOf:
                - $ref: "#/components/schemas/Payment"
                - type: object
                  required: [plan, seats]
                  properties:
                    plan: { const: paid }
                    seats: { type: integer, minimum: 1, maximum: 500 }

    PurchaseRequest:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [kind, seats]
          properties:
            kind: { type: string, enum: [open, extra, renewal] }
            seats: { type: integer, minimum: 1, maximum: 500 }

    Assignment:
      type: object
      required: [id, classId, kind, refId, title, assignedAt, dueAt]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        kind: { type: string, enum: [exercise, exam] }
        refId: { type: string, format: uuid, description: Mã bài đã soạn được giao. }
        title: { type: string, description: Tên của bài; đổi theo khi bài đổi tên. }
        note: { type: string }
        assignedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }

    OwnQuestion:
      description: Câu giáo viên tự viết. Đủ các trường của dạng câu.
      type: object
      required: [id, type, chapterId, topic, level, prompt, explanation]
      properties:
        id: { type: string, pattern: "^tq-[a-z0-9-]{1,40}$" }
        type: { type: string, enum: [single, truefalse, short] }
        chapterId: { type: string, description: Chương của khóa học của bài. }
        topic: { type: string, maxLength: 120 }
        level: { type: string, enum: [biet, hieu, vandung] }
        prompt: { type: string, maxLength: 2000 }
        hint: { type: string, maxLength: 2000 }
        explanation: { type: string, maxLength: 4000 }
        options:
          type: array
          description: Chỉ với `single`; đúng 4 phương án khác nhau.
          minItems: 4
          maxItems: 4
          items: { type: string, maxLength: 500 }
        answerIndex: { type: integer, minimum: 0, maximum: 3, description: Chỉ với `single`. }
        statements:
          type: array
          description: Chỉ với `truefalse`; đúng 4 ý a đến d.
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [text, answer, explanation]
            properties:
              text: { type: string, maxLength: 500 }
              answer: { type: boolean }
              explanation: { type: string, maxLength: 1000 }
        answer: { type: string, description: "Chỉ với `short`: một số tối đa 4 kí tự, dấu phẩy thập phân." }

    WorkItem:
      oneOf:
        - type: object
          required: [source, questionId]
          properties:
            source: { const: bank }
            questionId: { type: string }
        - type: object
          required: [source, question]
          properties:
            source: { const: own }
            question: { $ref: "#/components/schemas/OwnQuestion" }

    WorkInput:
      type: object
      required: [kind, title, courseId, items]
      properties:
        kind: { type: string, enum: [exercise, exam] }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        courseId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: "#/components/schemas/WorkItem" }
        durationMinutes: { type: integer, minimum: 5, maximum: 180, description: Chỉ đề thi; bắt buộc với đề thi. }
        passPercent: { type: number, minimum: 0, maximum: 100, description: Chỉ đề thi; 50 là 5 điểm trên 10. }

    Work:
      allOf:
        - $ref: "#/components/schemas/WorkInput"
        - type: object
          required: [id, teacherId, handedIn, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            teacherId: { type: string, format: uuid }
            handedIn: { type: boolean, description: Đã có học sinh nộp nên không sửa được. }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PaperQuestion:
      description: Một câu của đề (từ ngân hàng PkKemis hoặc giáo viên tự soạn), kèm đáp án.
      type: object
      required: [id, type, chapterId, topic, level, prompt, explanation]
      properties:
        id: { type: string }
        type: { type: string, enum: [single, truefalse, short] }
        chapterId: { type: string }
        lessonId: { type: string }
        topic: { type: string }
        level: { type: string, enum: [biet, hieu, vandung] }
        prompt: { type: string }
        hint: { type: string }
        explanation: { type: string }
        tool:
          type: object
          required: [href, label]
          properties:
            href: { type: string }
            label: { type: string }
        options: { type: array, items: { type: string } }
        answerIndex: { type: integer }
        statements:
          type: array
          items:
            type: object
            required: [text, answer, explanation]
            properties:
              text: { type: string }
              answer: { type: boolean }
              explanation: { type: string }
        answer: { type: string }

    QuestionAnswer:
      description: Câu trả lời của học sinh; `null` ở một ý Đúng/Sai nghĩa là bỏ trống.
      oneOf:
        - type: object
          required: [type, choice]
          properties:
            type: { const: single }
            choice: { type: integer, minimum: -1, maximum: 3, description: "-1 là chưa chọn." }
        - type: object
          required: [type, values]
          properties:
            type: { const: truefalse }
            values:
              type: array
              minItems: 4
              maxItems: 4
              items: { type: [boolean, "null"] }
        - type: object
          required: [type, text]
          properties:
            type: { const: short }
            text: { type: string, maxLength: 20 }

    WorkPaper:
      type: object
      required: [workId, kind, title, courseId, questions, attemptsUsed, assignments]
      properties:
        workId: { type: string, format: uuid }
        kind: { type: string, enum: [exercise, exam] }
        title: { type: string }
        description: { type: string }
        courseId: { type: string }
        durationMinutes: { type: integer }
        passPercent: { type: number }
        questions:
          type: array
          items: { $ref: "#/components/schemas/PaperQuestion" }
        attemptsUsed: { type: integer, minimum: 0, description: Số lần mình đã nộp bài này. }
        attemptLimit:
          type: [integer, "null"]
          description: Số lần tối đa; `null` là không giới hạn (có lớp đã mua suất).
        assignments:
          type: array
          description: Các bài giao của bài này ở các lớp còn chạy của mình.
          items: { $ref: "#/components/schemas/Assignment" }

    AttemptResult:
      type: object
      required: [attemptId, correct, total, earned, max, score10, seconds, wrongQuestionIds, handedIn, attemptsUsed]
      properties:
        attemptId: { type: string, format: uuid }
        correct: { type: integer, description: Số câu đúng hoàn toàn. }
        total: { type: integer }
        earned: { type: number, description: Điểm trên thang điểm của đề (theo phần). }
        max: { type: number }
        score10: { type: number, description: Điểm trên thang 10. }
        seconds: { type: integer }
        passed: { type: boolean, description: Chỉ đề thi. }
        wrongQuestionIds:
          type: array
          items: { type: string }
        handedIn:
          type: array
          description: Mã các bài giao mà lần làm này vừa trở thành bài nộp (rỗng nếu đã nộp từ trước).
          items: { type: string, format: uuid }
        attemptsUsed: { type: integer }
        attemptLimit:
          type: [integer, "null"]

    Submission:
      type: object
      required: [assignmentId, studentId, submittedAt, correct, total, earned, max, score10, wrongQuestionIds]
      properties:
        assignmentId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        correct: { type: integer }
        total: { type: integer }
        earned: { type: number }
        max: { type: number }
        score10: { type: number }
        wrongQuestionIds:
          type: array
          items: { type: string }
