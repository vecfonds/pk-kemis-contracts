        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/notifications:
    get:
      tags: [notifications]
      operationId: listMyNotifications
      x-slice: 10g
      summary: Thông báo của mình, mới nhất trước (mọi vai trò)
      description: |
        Mỗi thông báo là `kind` + `params` (mã, số, và tên do người dùng đặt chụp lúc tạo như tên lớp, tên bài), cộng người gây ra (`actor`,
        đọc mới lúc trả lời, nên đổi tên là thấy tên mới). Web dựng câu chữ theo chế độ (`notificationText`) và đường dẫn. Một số loại gộp
        nhiều sự kiện vào một dòng khi dòng đó chưa đọc (`count`, `actors` tối đa 3 người gần nhất): cổ vũ trong ngày, học sinh vào lớp, học
        sinh nộp bài. Thông báo có người gây ra đã bị khóa, hay có chặn giữa hai người (với các loại bạn bè), không hiện. Giữ 90 ngày, mỗi người
        tối đa 500 dòng. Con trỏ theo `(updatedAt, id)`. Hỗ trợ `If-None-Match` ở trang đầu.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
