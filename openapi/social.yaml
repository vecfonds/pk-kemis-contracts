      description: |
        Chỉ người hỏi, câu hỏi đang hiện (`not_question` với bài viết), câu trả lời đang hiện ngay dưới câu hỏi (`not_answer` với bình luận),
        không phải của chính mình (409 `cannot_accept_own`). Trong một giao dịch có khóa dòng câu hỏi: ghi lựa chọn, thông báo
        `community_accepted` cho người trả lời, quyết XP và phát `community.answer_accepted` (lát `12e`; asyncapi 0.4.0). **XP +20 chỉ cho lần
        chọn đầu tiên của mỗi câu hỏi** và theo luật chống farm của mục 8 (M12-COMMUNITY.md); đổi lựa chọn hay bỏ rồi chọn lại không cộng
        thêm, không trừ. Chọn lại đúng câu đang chọn: 200, không làm gì.
