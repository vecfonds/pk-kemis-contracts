  # ------------------------------------------------------------------ 13d: vé kết nối thời gian thực (0.3.0, M13)

  /v1/realtime/tickets:
    post:
      tags: [realtime]
      operationId: createRealtimeTicket
      x-slice: 13d
      summary: Xin vé mở kết nối thời gian thực (mọi vai trò; web xin thay cho trình duyệt)
      description: |
        Trình duyệt không giữ access token (cookie httpOnly của web), nên web (server action) gọi đường này bằng token của người dùng rồi chỉ đưa
        **vé** cho trình duyệt. Trình duyệt mở Socket.IO tới cổng công khai của gateway (`path` = `/realtime`, chỉ `websocket`, không long-polling)
        và gửi vé trong gói CONNECT (`auth: { ticket }`), **không bao giờ** trong URL (URL nằm trong log).
        - Vé là 32 byte ngẫu nhiên (base64url), **dùng một lần**, sống 60 giây; social giữ mã băm SHA-256 của vé trong Redis (`rt:<băm>`) kèm người,
          phiên (`sid`), phiên bản token (`tv`) và vai trò lấy từ token; đổi vé lấy kết nối là `GETDEL` (hai kết nối không dùng được cùng một vé).
        - Lúc đổi vé social kiểm lại: tài khoản không bị khóa (bản sao `members`), token chưa bị thu hồi (khóa `rv:*` của Redis, M13-GATEWAY-MESSAGING.md
          mục 6). Sai thì kết nối bị từ chối (`connect_error` với `data.code` = `ticket_invalid` hay `session_ended`).
        - Kết nối sống tối đa `maxAgeSeconds` (mặc định 3600): hết thì social gửi `session.ended` (lý do `expired`) và đóng; trình duyệt xin vé mới
          qua web và nối lại (web cũng thấy phiên còn sống hay không). Mỗi người tối đa 10 kết nối; kết nối thứ 11 làm kết nối cũ nhất bị đóng
          (`replaced`).
        - Tối đa 30 vé mỗi phút mỗi người (429). social chưa có Redis (`REDIS_URL` trống): 503 `realtime_unavailable`; web giữ cách hỏi lại định kỳ
          như M10.
        Sự kiện đi xuống qua kết nối này: asyncapi/realtime.yaml 0.1.0. Kết nối chỉ để **đẩy xuống**; mọi thao tác ghi (gửi tin, đánh dấu đã đọc…)
        đi HTTP qua web, như mọi đường khác.
      responses:
        "201":
          description: Vé dùng một lần
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealtimeTicket" }
              example:
                ticket: Qm9yZWQtdGlja2V0LWZvci1Qa0tlbWlzLWV4YW1wbGU
                expiresAt: "2026-11-09T12:01:00.000Z"
                path: /realtime
                maxAgeSeconds: 3600
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Tài khoản bị khóa (`account_locked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: social chưa có Redis nên chưa mở kết nối thời gian thực được (`realtime_unavailable`)
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

