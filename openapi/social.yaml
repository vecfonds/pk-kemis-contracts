          description: "0.2.1: từ chối ảnh của admin (`cannot_moderate_admin`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "0.2.1: duyệt ảnh có mã băm trong danh sách chặn (`image_blocked`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/community/appeals/{appealId}/resolution:
    post:
      tags: [moderation]
      operationId: resolveAppeal
      x-slice: 12c
      summary: Chấp nhận hay giữ nguyên quyết định (admin)
      description: |
        Chấp nhận: hoàn lại lần xử lý (hiện lại nội dung, ảnh; gỡ khóa đăng bài; nhắc nhở ghi là đã rút), người kháng nghị nhận
        `community_appeal_accepted`. Giữ nguyên: `community_appeal_rejected`. Ghi nhật ký. Kháng nghị đã xử lý: 409 `not_appealable`.
        0.2.1: nội dung được hoàn lại mà còn bị giữ vì một kiểm chưa được duyệt thì về hàng chờ duyệt (như `restore` của `moderateThread`);
        nội dung hay ảnh đã bị xóa hẳn thì không hoàn lại được (409 `not_appealable`). Chấp nhận kháng nghị ảnh bị từ chối cũng gỡ mã băm của ảnh
        đó khỏi danh sách chặn.
      parameters:
        - name: appealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept: { type: boolean }
                note: { type: string, maxLength: 500, description: Lời gửi người kháng nghị (tùy chọn). }
      responses:
        "200":
          description: Kháng nghị sau thao tác
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppealState" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_appealable`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

