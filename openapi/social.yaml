openapi: 3.1.0
info:
  title: PkKemis social
  version: 0.3.0
  summary: Bạn bè, lời mời, chặn, quyền riêng tư của trang cá nhân, trang cá nhân người khác, bảng xếp hạng bạn bè, thông báo, Cộng đồng, kiểm duyệt, ảnh, tin nhắn, vé kết nối thời gian thực.
  description: |
    0.1.0 (docs/backend/M10-SOCIAL.md): service mới, NestJS. Phần 1 của social (PHASE2 M10): bạn bè, cổ vũ, chặn, quyền riêng tư của trang
    cá nhân, trang cá nhân người khác (đã lọc theo quyền ở máy chủ), bảng xếp hạng bạn bè, "Bạn bè gần đây", thông báo trong app (hỏi lại
    định kỳ, chưa đẩy thời gian thực), thông báo chung của admin. Tin nhắn, WebSocket (M13) chưa có ở đây. Mỗi thao tác ghi lát cài nó ở
    `x-slice` (`10a`…`10i`, `12a`…`12e`); trước lát đó thao tác chưa có.

    0.2.0 (docs/backend/M12-COMMUNITY.md, chỉ thêm): phần 2 của social (PHASE2 M12): **Cộng đồng** (bài viết, câu hỏi, chia sẻ thành tích,
    câu trả lời, bình luận một cấp, thích, lưu, phiếu tán thành / không tán thành, chọn câu trả lời hay nhất, gợi ý câu hỏi tương tự, Hỏi
    đáp của bài học, phần Cộng đồng trên trang cá nhân; lát `12a`), **kiểm duyệt** (tài khoản dưới 7 ngày chờ duyệt, bộ lọc từ ngữ, báo
    cáo, tự ẩn khi 3 người báo cáo, hàng chờ, ẩn / hiện / xóa, nhắc nhở, khóa đăng bài 1/7/30 ngày, đề nghị khóa tài khoản sang identity,
    kháng nghị một lần, nhật ký xử lý, danh sách từ khóa; lát `12c`), **ảnh** (tải thẳng lên kho S3 bằng URL ký sẵn, kiểm loại thật, nén
    lại, xóa EXIF, mọi ảnh chờ admin duyệt; lát `12d`), **XP Cộng đồng** (social quyết lần chọn, lần tán thành nào được tính và phát sự kiện
    `community.*` sang learning; lát `12e`; asyncapi/pkkemis.yaml 0.4.0). Thêm 11 loại thông báo `community_*`, mã lỗi mới, `Suggestion`
    thêm `answeredMyQuestion`.

    0.2.1 (lượt soát M12, chỉ thêm; không thêm trường, mã lỗi, schema hay thao tác nào; khớp social commit `26b2074`): ghi các phản hồi
    social đã trả mà hợp đồng chưa ghi.
    - 403 `account_locked` ở `likeThread`, `saveThread`, `acceptReply`, `unacceptReply`, `deleteMyThread`, `deleteMyReply`, `reportContent`,
      `createAppeal`, `completeUpload` (cùng `muted`); 403 `forbidden` khi admin báo cáo.
    - `completeUpload`: thêm phản hồi 400, 403, 422 `content_blocked` (chú thích ảnh qua bộ lọc từ ngữ); cạnh dưới 32 px là `image_invalid`
      (không phải `image_too_large`); PNG 16 bit quá 8 triệu điểm ảnh là `image_too_large`. `requestUpload` 503 `media_busy` khi kho ảnh
      chưa sẵn sàng.
    - `reviewMedia` 409 `cannot_moderate_admin`, 422 `image_blocked`; `moderateThread` 409 `thread_not_visible` khi ghim bài không hiện;
      `sanctionMember` 200 `changed: false` khi `ban` không đổi gì (đã khóa, hay đã có `ban` trong 5 phút; không phát sự kiện thứ hai).
    - `createAppeal` gửi lại cùng `Idempotency-Key` cũng là 201 (đúng thân lần đầu).
    - Bình luận dưới câu trả lời của người đã chặn mình: 201, bình luận chỉ hiện với người viết và admin (trước đây mô tả là 403
      `replies_closed`; người bị chặn không bao giờ biết, M12-COMMUNITY.md mục 4.3).
    - Báo cáo của người từng bị admin bỏ qua báo cáo về cùng nội dung không đếm cho tự ẩn; nội dung hiện lại (`restore`, bỏ qua báo cáo,
      chấp nhận kháng nghị) mà còn bị một kiểm giữ chưa được duyệt thì về hàng chờ duyệt, không thông báo `community_restored`.
    - learning không trả lời lúc đăng thì bài không giữ mã khóa, chương, bài, câu (`refs` trống).

    0.3.0 (docs/backend/M13-GATEWAY-MESSAGING.md, chỉ thêm): phần 3 của social (PHASE2 M13).
    - **Tin nhắn** (lát `13e`): trò chuyện 1-1 và nhóm (3–30 người), tin chữ (tối đa 2 000 kí tự) và ảnh (tối đa 6 mỗi tin, hiện ngay, không
      chờ duyệt; vẫn kiểm loại thật, nén lại, xóa EXIF như ảnh Cộng đồng), dòng hệ thống của nhóm là **mã** (`SystemEvent`), số thứ tự `seq`
      tăng dần trong mỗi cuộc trò chuyện (sắp xếp, chống trùng, đọc bù sau khi mất kết nối), đánh dấu đã đọc, số chưa đọc, danh bạ để chọn
      người. Ai nhắn được ai theo `messagesFrom` (lưu từ M10, áp dụng từ bản này), chặn, lớp học (học sinh luôn nhắn được giáo viên của lớp
      mình), admin luôn nhắn được và luôn nhận được. **Chặn không lộ:** người bị chặn nhận `messages_closed`, cùng mã với "người này không nhận
      tin nhắn của bạn". Giữ quyết định 10 của docs/community/PLAN.md: tin nhắn không qua bộ lọc, không báo cáo, admin không đọc được cuộc trò
      chuyện của người khác.
    - **Vé kết nối thời gian thực** (lát `13d`): `POST /v1/realtime/tickets`. Trình duyệt không giữ token: web (BFF) xin vé bằng token của người
      dùng rồi đưa cho trình duyệt; trình duyệt mở Socket.IO qua cổng công khai của gateway (`/realtime`) và gửi vé trong gói CONNECT. Sự kiện
      đẩy xuống (thông báo, tin nhắn, đã đọc ở tab khác, phiên kết thúc) ghi ở `asyncapi/realtime.yaml` 0.1.0.
    - Thêm: `Summary.unreadMessages`, `ProfileView.messageBlock`, thông báo `message_group_added`, mã lỗi `messages_closed`, `not_owner`,
      `not_group`, `group_full`, `realtime_unavailable`, `limitKind` cho tin nhắn.
    - Từ M13 web gọi social **qua gateway** (`http://gateway:8080/social` + đường của hợp đồng này, kèm `X-Bff-Key`; `openapi/gateway.yaml`
      0.1.0). Đường không đổi; gateway thêm tiền tố tên service vì vài đường trùng nhau giữa các service (`/v1/me/privacy`,
      `/v1/admin/audit-log`). Giới hạn tần suất theo người, theo IP ở gateway (Redis); các giới hạn theo nghiệp vụ vẫn ở đây.

    - **Cộng đồng chỉ dùng mã hồ sơ.** Tác giả, người báo cáo, người được xử lý đều là `Person` (`handle`), như phần bạn bè. Mã tài khoản
      thật của người khác không có trong bất kì phản hồi Cộng đồng nào cho học sinh, giáo viên; đường admin chỉ trả thêm `userId` ở
      `GET /v1/admin/community/members/{handle}`. Khóa tệp ảnh trong kho không chứa mã tài khoản.
    - **Nội dung không theo chế độ.** Bài, câu hỏi, câu trả lời, bình luận, chữ admin viết khi xử lý lưu một lần, giống nhau ở Normal và Tu
      tiên. Nhãn độ tin cậy ("Quản trị viên", "Chưa kiểm chứng") và tên gọi ("Hỏi đáp" ↔ "Luận đạo", "Câu trả lời hay nhất" ↔ "Chân giải")
      do web dựng. Cờ của bộ lọc, lý do báo cáo, lý do xử lý là mã.
    - **Máy chủ lọc trước khi trả.** Nội dung chờ duyệt, bị ẩn, đã xóa không có trong phản hồi cho người khác (tác giả thấy của mình kèm lý
      do; admin thấy hết). Người xem đã chặn ai thì không nhận nội dung của người đó. Ảnh chờ duyệt không có URL với người khác.
    - **Đề đang mở** (docs/community/PLAN.md mục 3.1): social hỏi learning (`POST /internal/community/screen` của learning.yaml 1.3.0) mỗi
      lần đăng; đề bài không bao giờ rời learning. learning không trả lời thì bài **chờ duyệt** (không bao giờ cho qua).

    - Token là access token của identity (xem identity.yaml); service tự kiểm bằng khóa công khai (JWKS), không gọi identity. Người gọi là
      `sub` của token, vai trò là claim `role`; **không bao giờ** lấy người gọi từ thân yêu cầu.
    - **Mã hồ sơ (`handle`) thay cho mã tài khoản.** Mọi người trong API này (trừ đường admin) được chỉ bằng `handle`: 12 kí tự ngẫu nhiên do
      social cấp, cố định cho mỗi tài khoản, không suy ra được mã tài khoản. Mã tài khoản thật (UUID của identity) của người khác không bao
      giờ có trong phản hồi cho học sinh, giáo viên (như M6 mục 18 câu 9 với bảng xếp hạng). Địa chỉ trang cá nhân ở web là
      `/profile/<handle>`.
    - **Chỉ học sinh kết bạn với học sinh** (docs/profile/PLAN.md mục 4.2). Giáo viên, admin không có bạn bè, lời mời, cổ vũ, gợi ý, tìm bạn
      (403 `not_student` ở các đường đó); họ vẫn có thông báo, quyền riêng tư (phần tin nhắn, trả lời), danh sách chặn, xem được trang cá
      nhân người khác.
    - **Máy chủ lọc quyền riêng tư.** Phần nào người xem không được xem thì không có trong phản hồi (chỉ có `visible: false` và lý do), không
      gửi hết rồi để web ẩn. Phần "chỉ mình" (chủ đề nên ôn, độ chính xác, thời gian học, email, ngày sinh) không bao giờ đi qua social.
    - **Chặn không lộ.** Người bị chặn không được báo; mọi điều họ thấy đều giống trường hợp người kia không nhận lời mời hay chỉ chia sẻ
      với chính mình (mục 4 của M10-SOCIAL.md).
    - **Luật chế độ** (AGENTS.md mục 2.1): service chỉ trả mã và số. Thông báo là `kind` + tham số (`params`); "Bạn bè" ↔ "Đạo hữu",
      "Cổ vũ" ↔ "Truyền linh lực", XP ↔ Tu Vi, Cấp độ ↔ Cảnh giới, Xu ↔ Linh thạch do web dịch bằng `useTerm()`. Tên lớp, tên bài do giáo viên
      đặt và thông báo chung do admin viết lưu một lần, giống nhau ở mọi chế độ.
    - **Thao tác lặp được tự nhiên** (gửi lại lời mời đang chờ, chấp nhận hai lần, cổ vũ lại trong ngày, chặn hai lần): trả cùng kết quả,
      không cần `Idempotency-Key`. Riêng thông báo chung của admin nhận `Idempotency-Key` (tùy chọn) để bấm đúp không gửi hai lần cho cả
      trường.
    - Lỗi theo RFC 9457 (`application/problem+json`), cùng dạng với identity, có `code` ổn định và `detail` tiếng Việt.
    - Giới hạn tần suất (chưa có gateway tới M13) do social tự giữ: 429 `too_many_requests` kèm `Retry-After`.
    - Chỉ thêm, không xóa hay đổi nghĩa trường đã phát hành (README của contracts). Bên dùng bỏ qua trường lạ và `kind` thông báo lạ.
servers:
  - url: http://social:8080
    description: Mạng Docker Compose (chưa có gateway)
  - url: http://gateway:8080/social
    description: "0.3.0 (M13, lát 13c): web gọi qua gateway, kèm header `X-Bff-Key` (openapi/gateway.yaml)"
security:
  - bearerAuth: []
tags:
  - name: me
    description: Người đang đăng nhập (tóm tắt, quyền riêng tư)
  - name: friends
    description: Bạn bè, lời mời, cổ vũ, gợi ý, tìm bạn (học sinh)
  - name: blocks
    description: Danh sách chặn
  - name: profiles
    description: Trang cá nhân người khác, xem trang mình như người khác thấy
  - name: board
    description: Bảng xếp hạng bạn bè, "Bạn bè gần đây"
  - name: notifications
    description: Thông báo trong app
  - name: admin
    description: Thông báo chung, xem tình trạng xã hội của một tài khoản, nhật ký
  - name: community
    description: Cộng đồng (0.2.0, M12) — bảng tin, hỏi đáp, trả lời, phiếu, báo cáo, kháng nghị
  - name: media
    description: Ảnh của Cộng đồng (0.2.0, M12) — xin chỗ tải lên, hoàn tất, bỏ
  - name: moderation
    description: Kiểm duyệt Cộng đồng (0.2.0, M12, admin) — hàng chờ, xử lý, kháng nghị, từ khóa, nhật ký
  - name: messaging
    description: Tin nhắn (0.3.0, M13) — cuộc trò chuyện 1-1 và nhóm, tin, ảnh, đã đọc, danh bạ
  - name: realtime
    description: Vé mở kết nối thời gian thực (0.3.0, M13)

paths:
  # ------------------------------------------------------------------ 10b: tóm tắt và quyền riêng tư

  /v1/me/social:
    get:
      tags: [me]
      operationId: getMySocial
      x-slice: 10b
      summary: Mình ở social (mọi vai trò)
      description: |
        Hồ sơ của mình như người khác thấy phần chung (`me`, có `handle` của mình), quyền riêng tư, số bạn và lời mời, số thông báo chưa đọc,
        số lời mời đã gửi hôm nay. Web gọi một lần khi dựng khung trang. Tài khoản chưa có ở social (sự kiện `user.registered` chưa tới) thì
        social hỏi identity (`/internal/users/batch`) rồi tạo, nên không bao giờ 404 với người đã đăng nhập.
      responses:
        "200":
          description: Tóm tắt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySocial" }
              example:
                me:
                  handle: k7m2q9x4ta3b
                  fullName: Nguyễn Minh Anh
                  avatarInitials: MA
                  avatarUrl: null
                  frameId: meo-con-day-leo
                  role: student
                  level: 7
                  joinedOn: "2026-09-01"
                privacy:
                  progress: friends
                  achievements: everyone
                  friends: friends
                  requestsFrom: everyone
                  messagesFrom: everyone
                  repliesFrom: everyone
                  version: 1
                  updatedAt: "2026-10-16T08:15:31.000Z"
                counts: { friends: 2, incomingRequests: 1, outgoingRequests: 1, unreadNotifications: 3 }
                requestsToday: { used: 1, limit: 20, resetsAt: "2026-10-16T17:00:00.000Z" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/privacy:
    get:
      tags: [me]
      operationId: getMyProfilePrivacy
      x-slice: 10b
      summary: Quyền riêng tư của trang cá nhân (mọi vai trò)
      description: |
        Ai xem tiến độ, thành tích, danh sách bạn; ai gửi lời mời, nhắn tin, trả lời bài. Cờ "Ẩn khỏi bảng xếp hạng" **không** ở đây: vẫn ở
        identity (`/v1/me/privacy` của identity.yaml), social giữ bản sao từ sự kiện `user.*`. Mặc định (ghi thành dòng lúc tài khoản xuất hiện
        ở social, nên đổi mặc định về sau không áp ngược): tiến độ `friends`, thành tích `everyone`, danh sách bạn `friends`, lời mời
        `everyone`, nhắn tin `everyone`, trả lời `everyone` (docs/profile/PLAN.md mục 5; PHASE2 câu 16).
      responses:
        "200":
          description: Cài đặt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePrivacy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMyProfilePrivacy
      x-slice: 10b
      summary: Sửa quyền riêng tư của trang cá nhân
      description: |
        Chỉ các trường gửi lên mới đổi; `version` tăng 1 khi có đổi thật. Có hiệu lực ngay ở mọi phản hồi sau đó (social đọc quyền lúc trả lời,
        không đệm). `messagesFrom`, `repliesFrom` được lưu từ bây giờ nhưng chỉ áp dụng khi có tin nhắn (M13) và Cộng đồng (M12) ở máy chủ.
        Giáo viên, admin lưu được mọi trường; chỉ `messagesFrom`, `repliesFrom` có nghĩa với họ.

        0.3.0 (M13, lát `13e`): `messagesFrom` áp dụng cho việc bắt đầu cuộc trò chuyện 1-1, **mỗi tin** gửi trong cuộc trò chuyện 1-1 (đổi sang
        `friends` hay `nobody` thì người lạ không gửi tiếp được, kể cả trong cuộc trò chuyện cũ) và việc bị thêm vào nhóm. Không áp cho tin trong
        nhóm mình đang ở (rời nhóm là cách thôi nhận).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePrivacyPatch" }
      responses:
        "200":
          description: Cài đặt sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePrivacy" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------ 10b: bạn bè, cổ vũ

  /v1/me/friends:
    get:
      tags: [friends]
      operationId: listMyFriends
      x-slice: 10b
      summary: Bạn bè của mình (học sinh)
      description: |
        Mọi bạn đang có hiệu lực (tối đa 300, không phân trang). Không có: người đã bị khóa, người không còn là học sinh (quan hệ giữ nguyên,
        trở lại khi họ được mở khóa hay về học sinh), người mình đã chặn. `weeklyXp` là XP tuần này (từ learning), null khi bạn đó không chia
        sẻ tiến độ với bạn bè hoặc learning không trả lời (`weeklyXpUnavailable`). Web xếp theo `weeklyXp`.
      responses:
        "200":
          description: Bạn bè
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }

  /v1/me/friends/{handle}:
    delete:
      tags: [friends]
      operationId: unfriend
      x-slice: 10b
      summary: Hủy kết bạn
      description: Bên kia không được báo. Không còn là bạn thì vẫn 204. Phát `friend.removed` (lý do `unfriended`).
      parameters:
        - { $ref: "#/components/parameters/Handle" }
      responses:
        "204": { description: Không còn là bạn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/friends/{handle}/cheers:
    post:
      tags: [friends]
      operationId: cheerFriend
      x-slice: 10b
      summary: Cổ vũ một bạn (một lần mỗi ngày)
      description: |
        Chỉ giữa hai người đang là bạn, không ai chặn ai. Mỗi người cổ vũ một bạn tối đa một lần mỗi ngày (ngày theo giờ Việt Nam); cổ vũ lại
        trong ngày trả 200 với lần đã có, không gửi thêm thông báo. Người được cổ vũ nhận thông báo `cheer` (gộp mọi lời cổ vũ trong ngày
        thành một dòng khi chưa đọc). Không có chữ: chỉ là một lời khích lệ có sẵn (docs/profile/PLAN.md mục 6).
      parameters:
        - { $ref: "#/components/parameters/Handle" }
      responses:
        "200":
          description: Đã cổ vũ bạn này hôm nay từ trước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cheer" }
        "201":
          description: Vừa cổ vũ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cheer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Hai người không còn là bạn (`not_friends`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ 10b: lời mời

  /v1/me/friend-requests:
    get:
      tags: [friends]
      operationId: listMyFriendRequests
      x-slice: 10b
      summary: Lời mời đến và lời mời đã gửi đang chờ (học sinh)
      description: |
        Chỉ lời mời đang chờ, chưa quá 30 ngày. Lời mời đã bị từ chối, hủy, hết hạn không có ở đây (người gửi không được báo bị từ chối: lời
        mời chỉ biến mất). Lời mời từ hay tới người bị khóa, không còn là học sinh, hay có chặn giữa hai người không có.
      responses:
        "200":
          description: Lời mời
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestLists" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
    post:
      tags: [friends]
      operationId: sendFriendRequest
      x-slice: 10b
      summary: Gửi lời mời kết bạn
      description: |
        Luật theo thứ tự (cùng thứ tự với `requestBlock` của `src/lib/social.ts`, cộng phần che việc bị chặn):
        1. Gửi cho chính mình: 409 `self`. Mã không có, người bị khóa: 404 (giống nhau).
        2. Một trong hai không phải học sinh: 403/409 `not_student`.
        3. Mình đã chặn người đó: 409 `you_blocked`. **Người đó đã chặn mình: 409 `not_accepting`**, cùng mã và cùng chữ với trường hợp họ
           không nhận lời mời của ai, để người bị chặn không biết.
        4. Đã là bạn: 409 `already_friends`.
        5. Mình đã có lời mời đang chờ tới người đó: 200 với lời mời đó (lặp được, không gửi thêm thông báo).
        6. Người đó đã mời mình: hai người thành bạn ngay (200, `accepted: true`), như chấp nhận lời mời của họ.
        7. Người đó đặt "Không ai": 409 `not_accepting`; đặt "Bạn cùng lớp" mà hai người không cùng lớp nào đang học: 409 `classmates_only`.
        8. Mình đã có 300 bạn: 409 `friend_limit`; người đó đã có 300 bạn: 409 `their_friend_limit`.
        9. Đã gửi đủ lời mời hôm nay (20; tài khoản dưới 7 ngày: 5; ngày theo giờ Việt Nam; hủy lời mời không trả lại lượt): 409 `daily_limit`
           kèm `limit`, `resetsAt`.
        Được thì ghi lời mời (hết hạn sau 30 ngày) và một thông báo `friend_request` cho người nhận; người nhận không nhận lại thông báo lời
        mời từ cùng một người trong 7 ngày (lời mời vẫn hiện trong danh sách lời mời đến). Gửi dồn quá 10 lời mời trong 60 giây: 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/Handle" }
      responses:
        "200":
          description: "Đã có lời mời đang chờ (gửi lại), hoặc người kia đã mời mình nên hai người thành bạn (`accepted: true`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendRequestResult" }
        "201":
          description: Lời mời mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendRequestResult" }
              example:
                accepted: false
                request:
                  id: 2b9d6f1e-4c3a-4e8b-9f70-5a1c2d3e4f60
                  person:
                    handle: p3n8w1v6rz0c
                    fullName: Đỗ Thanh Tâm
                    avatarInitials: TT
                    avatarUrl: null
                    frameId: null
                    role: student
                    level: 5
                    joinedOn: "2026-09-03"
                  createdAt: "2026-10-16T12:00:00.000Z"
                  expiresAt: "2026-11-15T12:00:00.000Z"
                  classmate: { className: 10A1 }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Không gửi được: `self`, `not_student`, `you_blocked`, `already_friends`, `not_accepting`, `classmates_only`, `friend_limit`,
            `their_friend_limit`, `daily_limit` (kèm `limit`, `resetsAt`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                title: Không gửi được lời mời
                status: 409
                code: not_accepting
                detail: Bạn ấy không nhận lời mời kết bạn.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me/friend-requests/{requestId}/accept:
    post:
      tags: [friends]
      operationId: acceptFriendRequest
      x-slice: 10b
      summary: Chấp nhận một lời mời đến
      description: |
        Trong một giao dịch: khóa hai người (theo thứ tự mã), kiểm lại 300 bạn của cả hai, ghi tình bạn (một dòng mỗi cặp), xóa thông báo
        `friend_request` của lời mời này, thông báo `friend_accepted` cho người gửi, phát `friend.added`. Chấp nhận lại lời mời đã chấp nhận:
        200 với tình bạn đó. Lời mời không còn (hủy, hết hạn, có chặn, người gửi bị khóa): 404 `request_gone`.
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: Hai người là bạn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "404":
          description: Lời mời không có, không gửi cho mình, hoặc không còn (`request_gone`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Một trong hai đã có 300 bạn (`friend_limit`, `their_friend_limit`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/me/friend-requests/{requestId}/decline:
    post:
      tags: [friends]
      operationId: declineFriendRequest
      x-slice: 10b
      summary: Từ chối một lời mời đến
      description: |
        Người gửi không được báo; lời mời biến mất ở cả hai bên, thông báo của nó bị xóa. Gợi ý kết bạn của người gửi không có mình trong 30
        ngày. Lặp được: lời mời đã không còn thì vẫn 204.
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "204": { description: Đã từ chối }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/friend-requests/{requestId}:
    delete:
      tags: [friends]
      operationId: cancelFriendRequest
      x-slice: 10b
      summary: Hủy lời mời mình đã gửi
      description: Thông báo của lời mời bên người nhận bị xóa. Lượt gửi trong ngày không được trả lại. Lặp được.
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "204": { description: Đã hủy }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/friend-suggestions:
    get:
      tags: [friends]
      operationId: listFriendSuggestions
      x-slice: 10b
      summary: Người mình có thể biết (học sinh)
      description: |
        Bạn cùng lớp (cùng một lớp đang học, từ bản sao của classroom; có từ lát 10c) và bạn của bạn (ít nhất 2 bạn chung, chỉ tính qua những
        bạn chia sẻ danh sách bạn với bạn bè). Xếp như `suggestFriends` của web: bạn chung × 3 + cùng lớp × 2. Không gợi ý: người đã là bạn
        hay đang có lời mời, người có chặn với mình (hai chiều), người bị khóa, người không nhận lời mời của mình ("Không ai", hay "Bạn cùng
        lớp" khi không cùng lớp), người đã từ chối lời mời của mình trong 30 ngày. "Người từng trả lời câu hỏi của mình" thêm ở M12.
        0.2.0 (lát `12a`): thêm nguồn **người từng trả lời câu hỏi của mình** (học sinh có câu trả lời đang hiện dưới câu hỏi của mình trong 90
        ngày; cùng các luật loại trừ trên), cờ `answeredMyQuestion`; điểm xếp thêm + 1.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Gợi ý
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/Suggestion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }

  /v1/people/search:
    get:
      tags: [friends]
      operationId: searchPeople
      x-slice: 10b
      summary: Tìm học sinh theo tên (học sinh)
      description: |
        So không dấu, không phân biệt hoa thường (PostgreSQL `unaccent`, đầu mỗi từ của tên). Chống dò danh sách học sinh:
        - ít nhất 2 kí tự chữ hoặc số sau khi bỏ khoảng trắng; tối đa 20 kết quả, không phân trang;
        - chỉ học sinh không bị khóa, không phải mình, không có chặn với mình (hai chiều);
        - người không nhận lời mời của mình ("Không ai", hay "Bạn cùng lớp" khi không cùng lớp) chỉ hiện khi đã là bạn hoặc đang có lời mời
          giữa hai người;
        - mỗi người tối đa 30 lần tìm mỗi phút và 500 lần mỗi ngày (429).
        Kết quả chỉ có thẻ người và quan hệ, không có số bạn chung.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 50 }
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/SearchHit" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

