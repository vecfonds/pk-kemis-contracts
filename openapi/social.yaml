      description: |
        Theo thứ tự (docs/backend/M12-COMMUNITY.md mục 5.1):
        1. Tài khoản bị khóa: 403 `account_locked`. Đang bị khóa đăng bài: 403 `muted` (kèm `until`).
        2. Kiểm hình dạng (câu hỏi cần tiêu đề 10–150 kí tự và một bài học; thân 1–5000 kí tự; tối đa 3 ảnh): 400.
        3. Lượt trong ngày (giờ Việt Nam; tài khoản dưới 7 ngày 5 bài, còn lại 20; admin không giới hạn): 409 `daily_limit` (`limitKind:
           threads`). Cùng một nội dung (sau khi chuẩn hóa) đã đăng trong 24 giờ: 409 `duplicate_content`.
        4. Bộ lọc từ ngữ (bản sao có chủ đích của `checkContent` ở web, danh sách từ khóa do admin sửa): từ bị chặn thì 422 `content_blocked`
           kèm `flags` (bài không được lưu, lượt không bị trừ). Admin không qua bộ lọc.
        5. Hỏi learning (`POST /internal/community/screen`, hạn 1,5 giây): đoạn chữ chép đề bài của đề đang mở → cờ `exam_overlap`; câu hỏi
           về một câu đang nằm trong đề đang mở → 409 `question_in_open_exam`; bài học, chương, câu không có (hay chưa mở với học sinh) → 400
           với lỗi từng trường. learning không trả lời → cờ `exam_check_failed` (bài chờ duyệt, không bao giờ cho qua); 0.2.1: khi đó bài
           **không giữ** mã khóa, chương, bài, câu đã gửi (`refs` trống cả bốn), vì không ai kiểm được chúng, để mã sai không theo bài lên
           bảng tin khi admin duyệt.
        6. `achievementId` phải là thành tích mình đã đạt (bản sao huy hiệu của social): 409 `achievement_not_unlocked`. Ảnh (`mediaIds`) phải
           là ảnh của mình đã tải xong, chưa gắn vào bài nào: 409 `media_unavailable`.
        7. Trạng thái: tài khoản dưới 7 ngày (cờ `new_account`), hay có cờ cần xem lại → `pending` (chỉ mình và admin thấy); còn lại `visible`.
           Ảnh luôn chờ admin duyệt (trừ ảnh của admin).
        `Idempotency-Key` (tùy chọn, web gửi mỗi lần bấm một mã): gửi lại cùng mã trong 24 giờ trả lại đúng kết quả lần đầu.
