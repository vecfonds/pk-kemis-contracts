      summary: Một hàng chờ, cũ nhất trước (admin)
      description: |
        - `unanswered`: câu hỏi đang hiện chưa có câu trả lời nào đang hiện.
        - `pending`: bài và câu trả lời chờ duyệt (tài khoản mới, bộ lọc, trùng đề, chưa kiểm được đề), kèm cờ.
        - `images`: ảnh chờ duyệt của bài đang hiện hay chờ duyệt (lát `12d`).
        - `reports`: nội dung có báo cáo đang mở, gộp theo nội dung; "Bắt nạt", "Nội dung người lớn" trước; cộng câu trả lời, bình luận có điểm
          tán thành từ −5 trở xuống chưa được admin xem (`lowScore`).
        - `appeals`: kháng nghị đang mở.
