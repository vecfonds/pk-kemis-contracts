  /v1/community/threads:
    get:
      tags: [community]
      operationId: listThreads
      x-slice: 12a
      summary: Bảng tin, câu hỏi chưa có lời giải, bài đã lưu, Hỏi đáp của một bài học (mọi vai trò)
      description: |
        Chỉ bài đang hiện, cộng bài chờ duyệt **của chính mình** (kèm `flags`, như bản thử); bài bị ẩn của mình không ở bảng tin (xem ở trang
        bài và `GET /v1/community/me/moderation`). Không có bài của người mình đã chặn, của tài khoản bị khóa (trừ admin xem). Theo `tab`:
        - `new` (mặc định): mới nhất trước; trang đầu có bài ghim (tối đa 3) ở trên cùng.
        - `hot`: "Nổi bật", bài trong 30 ngày xếp theo `hotScore` của web (`(thích + 2 × trả lời + 1) / (giờ tuổi + 2)^1,5`, bản sao có chủ
          đích + script đối chiếu); con trỏ là vị trí, tối đa 200 bài.
        - `unsolved`: câu hỏi chưa có câu trả lời được chọn, cũ nhất trước.
        - `saved`: bài mình đã lưu, lưu gần nhất trước.
        - `top`: câu hỏi có câu trả lời được chọn trước, rồi nhiều lượt thích (khung "Hỏi đáp về bài này" của bài học; dùng với `lessonId`).
        Lọc thêm theo `chapterId`, `lessonId`, `kind`. `total` chỉ có khi lọc theo `lessonId` (số câu hỏi đang hiện của bài). Số đếm
        (`answerCount`, `replyCount`, `likeCount`) là của nội dung đang hiện với mọi người, không trừ riêng người mình chặn.
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [new, hot, unsolved, saved, top], default: new }
        - name: chapterId
          in: query
          schema: { $ref: "#/components/schemas/ContentId" }
        - name: lessonId
          in: query
          schema: { $ref: "#/components/schemas/ContentId" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ThreadKind" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
              example:
                nextCursor: null
                items:
                  - id: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                    kind: question
                    author: { handle: k7m2q9x4ta3b, fullName: Nguyễn Minh Anh, avatarInitials: MA, avatarUrl: null, frameId: meo-con-day-leo, role: student, level: 7, joinedOn: "2026-09-01" }
                    title: Số oxi hóa của N trong NH₄⁺ tính thế nào ạ?
                    body: Mình ra +5 nhưng đáp án là −3. Mình sai ở bước nào vậy?
                    refs: { courseId: hoa-hoc-10, chapterId: c4, lessonId: so-oxi-hoa, questionId: null }
                    achievementId: null
                    images: []
                    pendingImageCount: 0
                    status: visible
                    pinned: false
                    acceptedReplyId: null
                    likeCount: 3
                    answerCount: 1
                    replyCount: 1
                    createdAt: "2026-10-16T11:40:00.000Z"
                    lastActivityAt: "2026-10-16T12:05:00.000Z"
                    liked: false
                    saved: false
                    mine: true
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [community]
      operationId: createThread
      x-slice: 12a
      summary: Đăng bài viết, câu hỏi hay chia sẻ thành tích (mọi vai trò)
      description: |
        Theo thứ tự (docs/backend/M12-COMMUNITY.md mục 5.1):
        1. Tài khoản bị khóa: 403 `account_locked`. Đang bị khóa đăng bài: 403 `muted` (kèm `until`).
        2. Kiểm hình dạng (câu hỏi cần tiêu đề 10–150 kí tự và một bài học; thân 1–5000 kí tự; tối đa 3 ảnh): 400.
        3. Lượt trong ngày (giờ Việt Nam; tài khoản dưới 7 ngày 5 bài, còn lại 20; admin không giới hạn): 409 `daily_limit` (`limitKind:
           threads`). Cùng một nội dung (sau khi chuẩn hóa) đã đăng trong 24 giờ: 409 `duplicate_content`.
        4. Bộ lọc từ ngữ (bản sao có chủ đích của `checkContent` ở web, danh sách từ khóa do admin sửa): từ bị chặn thì 422 `content_blocked`
           kèm `flags` (bài không được lưu, lượt không bị trừ). Admin không qua bộ lọc.
        5. Hỏi learning (`POST /internal/community/screen`, hạn 1,5 giây): đoạn chữ chép đề bài của đề đang mở → cờ `exam_overlap`; câu hỏi
           về một câu đang nằm trong đề đang mở → 409 `question_in_open_exam`; bài học, chương, câu không có (hay chưa mở với học sinh) → 400
           với lỗi từng trường. learning không trả lời → cờ `exam_check_failed` (bài chờ duyệt, không bao giờ cho qua).
        6. `achievementId` phải là thành tích mình đã đạt (bản sao huy hiệu của social): 409 `achievement_not_unlocked`. Ảnh (`mediaIds`) phải
           là ảnh của mình đã tải xong, chưa gắn vào bài nào: 409 `media_unavailable`.
        7. Trạng thái: tài khoản dưới 7 ngày (cờ `new_account`), hay có cờ cần xem lại → `pending` (chỉ mình và admin thấy); còn lại `visible`.
           Ảnh luôn chờ admin duyệt (trừ ảnh của admin).
        `Idempotency-Key` (tùy chọn, web gửi mỗi lần bấm một mã): gửi lại cùng mã trong 24 giờ trả lại đúng kết quả lần đầu.
      parameters:
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewThread" }
            example:
              kind: question
              title: Vì sao HF là acid yếu dù F có độ âm điện lớn nhất?
              body: Mình nghĩ liên kết càng phân cực thì càng dễ tách H⁺ ra chứ?
              lessonId: hydrogen-halide
              mediaIds: [6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c]
      responses:
        "200":
          description: Đã đăng từ trước với cùng `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostOutcome" }
        "201":
          description: Đã đăng (hiện ngay hay chờ duyệt, xem `outcome`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostOutcome" }
              example:
                outcome: { status: pending, flags: [{ code: new_account }] }
                thread:
                  id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  kind: question
                  author: { handle: h2y6e0n4a8c1, fullName: Đặng Hải Yến, avatarInitials: HY, avatarUrl: null, frameId: null, role: student, level: 2, joinedOn: "2026-10-13" }
                  title: Vì sao HF là acid yếu dù F có độ âm điện lớn nhất?
                  body: Mình nghĩ liên kết càng phân cực thì càng dễ tách H⁺ ra chứ?
                  refs: { courseId: hoa-hoc-10, chapterId: c7, lessonId: hydrogen-halide, questionId: null }
                  achievementId: null
                  images:
                    - { id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c, status: pending, alt: null, width: 1200, height: 900, url: "http://localhost:9000/pk-community-media/m/6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c/full.webp?X-Amz-Signature=…", thumbUrl: "http://localhost:9000/pk-community-media/m/6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c/thumb.webp?X-Amz-Signature=…", urlExpiresAt: "2026-10-16T13:10:00.000Z" }
                  pendingImageCount: 0
                  status: pending
                  pinned: false
                  acceptedReplyId: null
                  likeCount: 0
                  answerCount: 0
                  replyCount: 0
                  createdAt: "2026-10-16T12:10:00.000Z"
                  lastActivityAt: "2026-10-16T12:10:00.000Z"
                  liked: false
                  saved: false
                  mine: true
                  flags: [{ code: new_account }]
                  moderation: null
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
