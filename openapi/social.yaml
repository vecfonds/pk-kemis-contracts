        duyệt, chưa bỏ phiếu không tán thành được), đang bị khóa đăng bài tới lúc nào, lượt đã dùng hôm nay (ngày giờ Việt Nam). Người chưa
        có ở social thì social hỏi identity rồi tạo, như `GET /v1/me/social`.
      responses:
