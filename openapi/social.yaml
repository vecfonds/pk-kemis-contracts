  /v1/admin/community/threads/{threadId}/moderation:
    post:
      tags: [moderation]
      operationId: moderateThread
      x-slice: 12c
      summary: Duyệt, ẩn, hiện lại, xóa, ghim, bỏ ghim một bài (admin)
      description: |
        `hide`, `delete` cần `reasonCode` (tác giả thấy mã và `note`, kháng nghị được một lần). Mỗi thao tác một dòng nhật ký, đóng các báo cáo
        đang mở của bài (`resolved`), và thông báo cho tác giả (`community_approved`, `community_hidden`, `community_restored`; không có với ghim).
        `approve` một bài đang chờ mà người hỏi đã có câu trả lời chờ thì không đổi gì ở câu trả lời. Ghim tối đa 3 bài (409 `pin_limit`). Nội
        dung của admin không bị `hide` bởi admin khác qua đây (409 `cannot_moderate_admin`). Lặp được: trạng thái đã đúng thì 200, không ghi thêm.

        0.2.1:
        - Chỉ ghim được bài đang hiện: ghim bài chờ duyệt, bị ẩn hay đã xóa là 409 `thread_not_visible` (kiểm trước `pin_limit`).
        - `restore`: nội dung bị giữ vì một kiểm (cờ của bộ lọc, trùng đề, chưa kiểm được đề, tài khoản mới) mà **chưa admin nào duyệt** thì
          hiện lại vào hàng chờ duyệt (`pending`), không lên bảng tin, và tác giả **không** nhận `community_restored`; phản hồi vẫn là
          `changed: true`. Muốn cho hiện thì `approve`. Cùng luật cho bỏ qua báo cáo (`dismissReports`) và chấp nhận kháng nghị
          (`resolveAppeal`).
        - `hide`, `delete` một bài cũng đóng các báo cáo đang mở về câu trả lời, bình luận của bài đó.
      parameters:
        - { $ref: "#/components/parameters/ThreadId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`pin_limit`, `cannot_moderate_admin`; 0.2.1: `thread_not_visible` (ghim bài không đang hiện)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

