      summary: Số thông báo chưa đọc và số lời mời đến (mọi vai trò; web hỏi lại mỗi 60 giây)
      description: |
        Đường nhẹ cho chuông và số trên mục Trang cá nhân ở menu: web hỏi lại mỗi 60 giây khi tab đang mở (PHASE2 câu 13; đẩy thời gian thực ở
        M13). `ETag` đổi khi một trong hai số đổi hoặc có thông báo mới; gửi `If-None-Match` đúng thì nhận 304 không có thân.
