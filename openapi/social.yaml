        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementRequest" }
      responses:
        "200":
          description: Đã gửi từ trước với cùng `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "201":
          description: Đã gửi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Đã gửi đủ 10 thông báo chung hôm nay (`daily_limit`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Cùng `Idempotency-Key`, nội dung khác (`idempotency_mismatch`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

