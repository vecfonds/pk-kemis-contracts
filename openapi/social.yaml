      operationId: addGroupMembers
      x-slice: 13e
      summary: Thêm người vào nhóm (mọi thành viên)
      description: |
        Như bản thử: mọi thành viên thêm được người (chỉ trưởng nhóm đổi tên và mời ra). Mỗi người được thêm phải nhắn được từ người thêm (luật của
        `MessageBlock`); có người không thêm được thì không thêm ai: 403 `messages_closed` / `you_blocked` kèm `handles`. Người đã ở nhóm bị bỏ
        qua. Vượt 30 người: 409 `group_full`. Người được thêm chỉ đọc được tin **từ lúc vào** (`joinedSeq`), không đọc lịch sử trước đó
        (M13-GATEWAY-MESSAGING.md mục 8.3, câu hỏi 6). Dòng hệ thống `members_added`; thông báo `message_group_added` cho từng người.
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handles]
              properties:
                handles:
                  type: array
                  minItems: 1
                  maxItems: 28
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/Handle" }
      responses:
        "200":
          description: Cuộc trò chuyện sau khi thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`messages_closed`, `you_blocked` (kèm `handles`), `account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_group`, `group_full`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/conversations/{conversationId}/members/{handle}:
    delete:
      tags: [messaging]
      operationId: removeGroupMember
      x-slice: 13e
      summary: Mời một người ra khỏi nhóm (trưởng nhóm)
      description: |
        Chỉ trưởng nhóm (403 `not_owner`); không mời chính mình ra (400; dùng `leave`). Người bị mời ra mất quyền đọc cả cuộc trò chuyện (404 từ
        đó), nhận sự kiện `conversation.removed` (lý do `removed`); dòng hệ thống `member_removed`. Người không còn ở nhóm: 200, không đổi gì.
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/Handle" }
      responses:
        "200":
          description: Cuộc trò chuyện sau khi mời ra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`not_owner`, `account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_group`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/leave:
    post:
      tags: [messaging]
      operationId: leaveGroup
      x-slice: 13e
      summary: Rời nhóm
      description: |
        Mất quyền đọc cả cuộc trò chuyện (404 từ đó). Trưởng nhóm rời thì người vào nhóm sớm nhất còn lại thành trưởng nhóm (dòng hệ thống
        `owner_changed` sau `member_left`), như bản thử. Người cuối cùng rời thì cuộc trò chuyện không còn ai; social xóa hẳn sau 30 ngày. Cuộc
        1-1 không rời được (409 `not_group`). Tài khoản bị khóa vẫn rời được (để thôi ở nhóm).
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "204": { description: Đã rời }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_group`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/messages:
    get:
      tags: [messaging]
      operationId: listMessages
      x-slice: 13e
      summary: Tin của một cuộc trò chuyện, theo `seq` tăng dần
      description: |
        - Không tham số: `limit` tin mới nhất. `before=<seq>`: các tin ngay trước `seq` đó (cuộn lên xem cũ). `after=<seq>`: các tin ngay sau
          (đọc bù sau khi mất kết nối, hay khi sự kiện `message.created` tới với `seq` nhảy cóc). Không gửi cả hai.
        - Chỉ tin có `seq` > `joinedSeq` của mình (người vào nhóm sau không đọc lịch sử trước đó). Tin của người mình đã chặn: `blockedAuthor: true`,
          không có chữ, ảnh (web ghi "Tin nhắn từ người bạn đã chặn"). Tin quá hạn giữ (mục 8.8 của M13-GATEWAY-MESSAGING.md): `purged: true`, không
          chữ, ảnh. URL ảnh ký sẵn 1 giờ, chỉ cho thành viên đọc được tin đó.
        - Không đánh dấu đã đọc (dùng `POST …/read`).
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Một trang tin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
              example:
                lastSeq: 12
                joinedSeq: 0
                hasMoreBefore: true
                hasMoreAfter: false
                items:
                  - id: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
                    conversationId: 0f1e2d3c-4b5a-4697-8a8b-9c0d1e2f3a4b
                    seq: 11
                    kind: system
                    author: null
                    mine: false
                    body: null
                    images: []
                    system:
                      code: members_added
                      actor: { handle: b4c8d2e6f0a1, fullName: Lê Bảo Ngọc, avatarInitials: BN, avatarUrl: null, frameId: null, role: student, level: 8, joinedOn: "2026-08-30" }
                      targets:
                        - { handle: p3n8w1v6rz0c, fullName: Đỗ Thanh Tâm, avatarInitials: TT, avatarUrl: null, frameId: null, role: student, level: 5, joinedOn: "2026-09-03" }
                      title: null
                    blockedAuthor: false
                    purged: false
                    createdAt: "2026-11-02T08:00:00.000Z"
                  - id: 8f9a0b1c-2d3e-4f4a-9b5c-6d7e8f9a0b1c
                    conversationId: 0f1e2d3c-4b5a-4697-8a8b-9c0d1e2f3a4b
                    seq: 12
                    kind: text
                    author: { handle: b4c8d2e6f0a1, fullName: Lê Bảo Ngọc, avatarInitials: BN, avatarUrl: null, frameId: null, role: student, level: 8, joinedOn: "2026-08-30" }
                    mine: false
                    body: Ai làm xong câu 5 chưa? Fe₂O₃ + 3CO → 2Fe + 3CO₂ đúng không?
                    images: []
                    system: null
                    blockedAuthor: false
                    purged: false
                    createdAt: "2026-11-09T12:40:00.000Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [messaging]
      operationId: sendMessage
      x-slice: 13e
      summary: Gửi một tin (chữ, ảnh, hay cả hai)
      description: |
        - `Idempotency-Key` **bắt buộc**: web sinh một mã cho mỗi lần bấm Gửi (Enter), gửi lại đúng mã khi thử lại sau lỗi mạng; cùng mã thì trả lại
          đúng tin đã tạo (201, cùng thân), khác thân thì 422 `idempotency_mismatch`. Mã được giữ mãi trong tin (`clientKey`, chỉ người gửi thấy) để
          web khớp bong bóng "đang gửi" với tin thật, kể cả khi sự kiện `message.created` tới trước phản hồi này.
        - Cuộc 1-1: mỗi tin kiểm lại luật của `MessageBlock` (đổi quyền riêng tư hay chặn có hiệu lực ngay): 403 `messages_closed` hay `you_blocked`.
          Nhóm: mọi thành viên gửi được (tin của người bị một thành viên chặn tới người đó dưới dạng `blockedAuthor`, không lỗi, không lộ).
        - Chữ 1–2 000 kí tự (giữ nguyên như người gõ, kể cả chỉ số dưới H₂SO₄; **không qua bộ lọc**, quyết định 10) và/hoặc 1–6 ảnh đã `complete`
          của chính mình trong cùng cuộc trò chuyện (ảnh không dùng được: 409 `media_unavailable`). Không chờ duyệt (quyết định 11).
        - Social cấp `seq` (tăng 1 trong cuộc trò chuyện) trong giao dịch có khóa dòng cuộc trò chuyện, rồi sau khi ghi xong đẩy `message.created`
          tới mọi thành viên đang kết nối (cả các tab khác của người gửi).
        - Lượt: 30 tin mỗi phút (429), 1 000 tin mỗi ngày (tài khoản dưới 7 ngày 300; 409 `daily_limit`, `limitKind: messages`); admin không giới
          hạn ngày.
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMessage" }
            example: { body: "Mình gửi bảng tóm tắt chất khử – chất oxi hóa nè", mediaIds: [6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c] }
      responses:
        "201":
          description: Tin đã tạo (hay tin đã tạo trước đó với cùng `Idempotency-Key`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`messages_closed`, `you_blocked`, `account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`daily_limit` (`limitKind: messages`), `media_unavailable`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`idempotency_mismatch`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/conversations/{conversationId}/read:
    post:
      tags: [messaging]
      operationId: markConversationRead
      x-slice: 13e
      summary: Đánh dấu đã đọc tới một tin
      description: |
        `lastReadSeq` = lớn hơn trong (cũ, min(`upToSeq`, `lastSeq`)): không bao giờ lùi, nên hai tab gửi lệch thứ tự không làm số chưa đọc tăng lại.
        Đổi thật thì đẩy `conversation.read` tới các kết nối khác của mình (tab khác thấy số chưa đọc giảm). Người khác **không** biết mình đã đọc
        (không có "Đã xem", như bản thử; câu hỏi 8).
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upToSeq]
              properties:
                upToSeq: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Trạng thái đã đọc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadState" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/conversations/{conversationId}/media:
    post:
      tags: [messaging]
      operationId: requestMessageUpload
      x-slice: 13e
      summary: Xin chỗ tải một ảnh cho tin nhắn (URL ký sẵn, 5 phút)
      description: |
        Như `requestUpload` của Cộng đồng (JPG, PNG, WebP; 1 byte – 5 MB; `PUT` thẳng lên kho, đúng header và số byte đã khai), nhưng ảnh thuộc một
        cuộc trò chuyện mình đang ở và gửi được (cuộc 1-1 bị `messages_closed`, `you_blocked` thì 403). Từ M13 URL ký có máy chủ là cổng công khai
        của gateway (`S3_PUBLIC_ENDPOINT`), không còn là cổng của kho. Lượt: 60 ảnh mỗi ngày (tài khoản dưới 7 ngày 10; 409 `daily_limit`,
        `limitKind: message_uploads`), 10 lần mỗi phút (429). Ảnh không gắn vào tin nào trong 24 giờ bị xóa.
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, bytes]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                bytes: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "201":
          description: Chỗ tải lên
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`messages_closed`, `you_blocked`, `account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`daily_limit` (`limitKind: message_uploads`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Kho ảnh chưa sẵn sàng (`media_busy`)
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/media/{mediaId}/complete:
    post:
      tags: [messaging]
      operationId: completeMessageUpload
      x-slice: 13e
      summary: Báo đã tải xong ảnh của tin nhắn; social kiểm, nén lại, xóa siêu dữ liệu
      description: |
        Đúng các bước của `completeUpload` (Cộng đồng, 0.2.1): số byte, loại thật theo byte đầu tệp, giải mã đủ, cạnh 32–8000 px, tối đa 25 triệu
        điểm ảnh, không ảnh động, xoay theo EXIF, ghi lại WebP **không EXIF, XMP, ICC** (cạnh dài 1600 px, bản nhỏ 480 px), so danh sách ảnh admin đã
        chặn (`image_blocked`). Khác Cộng đồng: chú thích (`alt`) không qua bộ lọc (quyết định 10) và ảnh **không chờ duyệt** (quyết định 11): gắn
        vào tin là mọi thành viên thấy. Tệp lưu ở bucket riêng của tin nhắn (`pk-message-media`).
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/MediaId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                alt: { type: [string, "null"], maxLength: 120, description: Chú thích do người gửi gõ; trống là không có. Không lấy tên tệp. }
      responses:
        "200":
          description: Ảnh đã sẵn sàng gắn vào tin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaInfo" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`upload_expired`, `upload_incomplete`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`image_invalid`, `image_too_large`, `image_blocked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: "`media_busy`"
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations/{conversationId}/media/{mediaId}:
    delete:
      tags: [messaging]
      operationId: discardMessageUpload
      x-slice: 13e
      summary: Bỏ một ảnh chưa gắn vào tin (lặp được)
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/MediaId" }
      responses:
        "204": { description: Đã bỏ }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ảnh đã gắn vào tin (`media_unavailable`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/messaging/contacts:
    get:
      tags: [messaging]
      operationId: listMessageContacts
      x-slice: 13e
      summary: Danh bạ để chọn người nhắn tin hay thêm vào nhóm
      description: |
        Không có tìm kiếm toàn trường cho tin nhắn (chống người lạ dò học sinh để nhắn; câu hỏi 5). Danh bạ gồm, theo vai trò người gọi:
        - **Học sinh:** bạn bè (`friend`), bạn cùng lớp đang học (`classmate`), giáo viên của lớp mình (`class_teacher`), admin (`admin`), người đã
          có cuộc trò chuyện với mình (`recent`, 90 ngày).
        - **Giáo viên:** học sinh của các lớp mình (`class_student`), admin, `recent`.
        - **Admin:** admin khác, `recent`; với `q` (từ 2 kí tự) thì tìm theo tên trong mọi tài khoản chưa bị khóa (`search`, tối đa 20).
        Mỗi người kèm `messageBlock` (null là nhắn được; web vẫn hiện người không nhắn được nhưng làm mờ kèm lý do, như bản thử). `q` lọc theo tên
        không dấu trong danh bạ. Người bị khóa và người mình đã chặn không có trong danh bạ (như M10: người chặn không thấy người bị chặn ở đâu);
        người đã chặn mình vẫn có nếu thuộc một nhóm trên, kèm `messages_closed` như người chỉ nhận tin của bạn bè (không lộ việc bị chặn). Người
        lạ ngoài danh bạ nhắn được từ trang cá nhân của họ (`ProfileView.messageBlock`). Tối đa 200 người, xếp: admin, giáo viên, rồi theo tên.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Danh bạ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của identity (RS256). `sub` là người gọi, `role` là vai trò.

  parameters:
    Handle:
      name: handle
      in: path
      required: true
      description: Mã hồ sơ của người đó (không phải mã tài khoản).
      schema: { $ref: "#/components/schemas/Handle" }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      description: Mã tài khoản (identity). Chỉ đường admin nhận mã này.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Con trỏ `nextCursor` của trang trước; bỏ trống là trang đầu.
      schema: { type: string, maxLength: 200 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag đã có; trùng thì nhận 304.
      schema: { type: string, maxLength: 100 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Một mã cho mỗi lần bấm "Gửi" (web dùng UUID); gửi lại đúng mã khi thử lại sau lỗi mạng. Giữ 24 giờ, phạm vi là người gọi.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,100}$" }
    ThreadId:
      name: threadId
      in: path
      required: true
      description: "0.2.0: mã bài Cộng đồng (UUID do social cấp)."
      schema: { type: string, format: uuid }
    ReplyId:
      name: replyId
      in: path
      required: true
      description: "0.2.0: mã câu trả lời hay bình luận."
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      description: "0.2.0: mã ảnh (cũng là tên tệp trong kho; không chứa mã tài khoản)."
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: "0.3.0: mã cuộc trò chuyện (UUID do social cấp). Không phải thành viên thì mọi đường của nó trả 404."
      schema: { type: string, format: uuid }
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        0.3.0: một mã cho mỗi lần bấm Gửi (web dùng UUID); gửi lại đúng mã khi thử lại sau lỗi mạng. Phạm vi là người gửi và cuộc trò chuyện;
        giữ mãi trong tin (`clientKey`).
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,100}$" }

  headers:
    ETag:
      description: Phiên bản của dữ liệu trả về, trong ngoặc kép.
      schema: { type: string }
    RetryAfter:
      description: Số giây nên chờ trước khi thử lại.
      schema: { type: integer, minimum: 1 }

  responses:
    ValidationFailed:
      description: Dữ liệu gửi lên không hợp lệ (`validation_failed`), kèm lỗi từng trường
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ / hết hạn (`token_invalid`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Không phải admin (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotStudent:
      description: Đường này chỉ dành cho học sinh (`not_student`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        Không có (`not_found`). Mã hồ sơ không tồn tại và người bị khóa trả cùng một lỗi, để không dò được ai bị khóa.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Quá nhiều yêu cầu (`too_many_requests`); chờ theo `Retry-After`
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Lỗi theo RFC 9457. Cùng dạng với identity; có thêm các mã và trường của service này.
      required: [title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - validation_failed
            - token_invalid
            - forbidden
            - not_found
            - internal_error
            - too_many_requests
            - not_student
            - self
            - you_blocked
            - already_friends
            - not_accepting
            - classmates_only
            - friend_limit
            - their_friend_limit
            - daily_limit
            - not_friends
            - request_gone
            - cannot_block_admin
            - idempotency_mismatch
            # 0.2.0 (M12): Cộng đồng, kiểm duyệt, ảnh
            - account_locked
            - muted
            - content_blocked
            - duplicate_content
            - replies_closed
            - thread_not_visible
            - question_in_open_exam
            - not_question
            - not_answer
            - not_author
            - cannot_accept_own
            - self_vote
            - downvote_not_allowed
            - achievement_not_unlocked
            - media_unavailable
            - upload_expired
            - upload_incomplete
            - image_invalid
            - image_too_large
            - image_blocked
            - media_busy
            - not_appealable
            - appeal_exists
            - cannot_moderate_admin
            - pin_limit
            # 0.3.0 (M13): tin nhắn, thời gian thực
            - messages_closed
            - not_owner
            - not_group
            - group_full
            - realtime_unavailable
        detail: { type: string, description: "Thông báo tiếng Việt, hiển thị được cho người dùng." }
        limit: { type: integer, minimum: 1, description: "Chỉ `daily_limit`: số lời mời (hay thông báo chung) tối đa mỗi ngày của người gọi." }
        resetsAt: { type: string, format: date-time, description: "Chỉ `daily_limit`: lúc ngày mới bắt đầu (00:00 giờ Việt Nam)." }
        limitKind:
          type: string
          enum: [threads, replies, uploads, reports, messages, conversations, groups, message_uploads]
          description: |
            0.2.0: chỉ `daily_limit` của Cộng đồng: lượt nào đã hết (bài, trả lời và bình luận, ảnh, báo cáo). 0.3.0 (M13): tin nhắn (`messages`),
            cuộc 1-1 mới (`conversations`), nhóm mới (`groups`), ảnh của tin nhắn (`message_uploads`).
        handles:
          type: array
          maxItems: 29
          uniqueItems: true
          items: { $ref: "#/components/schemas/Handle" }
          description: "0.3.0: chỉ `messages_closed`, `you_blocked` khi lập nhóm hay thêm người: những người không thêm được."
        until: { type: string, format: date-time, description: "0.2.0: chỉ `muted`: lúc hết khóa đăng bài." }
        flags:
          type: array
          maxItems: 20
          description: "0.2.0: chỉ `content_blocked`: vì sao bộ lọc chặn (mã; web dựng chữ)."
          items: { $ref: "#/components/schemas/FilterFlag" }
        errors:
          type: array
          description: Chỉ `validation_failed`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Handle:
      type: string
      pattern: "^[0-9a-z]{12}$"
      description: |
        Mã hồ sơ: 12 kí tự `0-9a-z` ngẫu nhiên (bộ sinh số ngẫu nhiên an toàn), social cấp khi tài khoản xuất hiện lần đầu, không đổi, không
        suy ra được mã tài khoản hay thứ tự đăng ký.

    Role:
      type: string
      enum: [student, teacher, admin]

    Audience:
      type: string
      enum: [everyone, friends, me]
      description: Ai xem được một phần của trang cá nhân. `friends` = người đang là bạn; `me` = không ai khác (admin vẫn xem được).

    Person:
      type: object
      additionalProperties: false
      description: |
        Thẻ một người, phần ai cũng thấy (docs/profile/PLAN.md mục 5). Tên, ảnh, vai trò từ bản sao của identity; khung từ commerce; cấp độ từ
        learning. Không bao giờ có email, ngày sinh, mã tài khoản.
      required: [handle, fullName, avatarInitials, avatarUrl, frameId, role, level, joinedOn]
      properties:
        handle: { $ref: "#/components/schemas/Handle" }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        avatarInitials: { type: string, maxLength: 4, description: Chữ cái đầu của hai từ cuối của tên. }
        avatarUrl: { type: [string, "null"], maxLength: 500 }
        frameId: { type: [string, "null"], pattern: "^[\\w-]{1,80}$", description: Khung đang đeo (chỉ mã; ảnh ở web). }
        role: { $ref: "#/components/schemas/Role" }
        level: { type: [integer, "null"], minimum: 1, description: "Cấp độ (học sinh); null với giáo viên, admin, hay khi social chưa biết." }
        joinedOn: { type: [string, "null"], format: date, description: Ngày tham gia (giờ Việt Nam); null khi social chưa biết. }

    ProfilePrivacy:
      type: object
      additionalProperties: false
      required: [progress, achievements, friends, requestsFrom, messagesFrom, repliesFrom, version, updatedAt]
      properties:
        progress: { $ref: "#/components/schemas/Audience" }
        achievements: { $ref: "#/components/schemas/Audience" }
        friends: { $ref: "#/components/schemas/Audience" }
        requestsFrom:
          type: string
          enum: [everyone, classmates, nobody]
          description: Ai gửi lời mời kết bạn được. `classmates` = học sinh cùng một lớp đang học.
        messagesFrom:
          type: string
          enum: [everyone, friends, nobody]
          description: |
            Ai nhắn tin được (áp dụng từ M13). `nobody` = chỉ admin; giáo viên của lớp mình và admin luôn nhắn được
            (docs/profile/PLAN.md mục 4.3). 0.3.0: luật đầy đủ ở `MessageBlock`. Ghi chính xác: "giáo viên của lớp mình luôn nhắn được" là
            **học sinh luôn nhắn được cho giáo viên của lớp mình** (bất kể cài đặt của giáo viên); giáo viên nhắn cho học sinh vẫn theo cài đặt của
            học sinh (câu hỏi 3 của M13-GATEWAY-MESSAGING.md).
        repliesFrom:
          type: string
          enum: [everyone, nobody]
          description: Ai trả lời, bình luận bài mình đăng ở Cộng đồng (áp dụng từ M12). `nobody` = chỉ admin.
        version: { type: integer, format: int64, minimum: 1, description: Tăng 1 mỗi lần một trường đổi. }
        updatedAt: { type: string, format: date-time }

    ProfilePrivacyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        progress: { $ref: "#/components/schemas/Audience" }
        achievements: { $ref: "#/components/schemas/Audience" }
        friends: { $ref: "#/components/schemas/Audience" }
        requestsFrom: { type: string, enum: [everyone, classmates, nobody] }
        messagesFrom: { type: string, enum: [everyone, friends, nobody] }
        repliesFrom: { type: string, enum: [everyone, nobody] }

    MySocial:
      type: object
      additionalProperties: false
      required: [me, privacy, counts, requestsToday]
      properties:
        me: { $ref: "#/components/schemas/Person" }
        privacy: { $ref: "#/components/schemas/ProfilePrivacy" }
        counts:
          type: object
          additionalProperties: false
          required: [friends, incomingRequests, outgoingRequests, unreadNotifications]
          properties:
            friends: { type: integer, minimum: 0, maximum: 300 }
            incomingRequests: { type: integer, minimum: 0 }
            outgoingRequests: { type: integer, minimum: 0 }
            unreadNotifications: { type: integer, minimum: 0 }
        requestsToday:
          type: object
          additionalProperties: false
          description: Lời mời đã gửi hôm nay (giờ Việt Nam). Giáo viên, admin luôn 0/0.
          required: [used, limit, resetsAt]
          properties:
            used: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 0, description: "20; tài khoản dưới 7 ngày: 5." }
            resetsAt: { type: string, format: date-time }

    Summary:
      type: object
      additionalProperties: false
      required: [unreadNotifications, incomingRequests, latestNotificationAt]
      properties:
        unreadNotifications: { type: integer, minimum: 0 }
        incomingRequests: { type: integer, minimum: 0, description: "Lời mời kết bạn đến đang chờ (giáo viên, admin luôn 0)." }
        latestNotificationAt: { type: [string, "null"], format: date-time, description: "`updatedAt` mới nhất trong thông báo của mình." }
        unreadMessages:
          type: integer
          minimum: 0
          description: |
            0.3.0 (M13, lát `13e`): tổng tin chưa đọc của mọi cuộc trò chuyện (như `ConversationPage.unreadMessages`), cho số trên mục Tin nhắn ở
            menu. Vắng khi social chưa có tin nhắn (trước 13e).

    Classmate:
      type: [object, "null"]
      additionalProperties: false
      description: Một lớp hai người cùng đang học (tên do giáo viên đặt); null khi không cùng lớp nào.
      required: [className]
      properties:
        className: { type: string, minLength: 1, maxLength: 100 }

    Friend:
      type: object
      additionalProperties: false
      required: [person, since]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        since: { type: string, format: date-time }

    FriendList:
      type: object
      additionalProperties: false
      required: [items, weeklyXpUnavailable]
      properties:
        items:
          type: array
          maxItems: 300
          items:
            type: object
            additionalProperties: false
            required: [person, since, cheeredToday, weeklyXp]
            properties:
              person: { $ref: "#/components/schemas/Person" }
              since: { type: string, format: date-time }
              cheeredToday: { type: boolean, description: Mình đã cổ vũ bạn này hôm nay. }
              weeklyXp: { type: [integer, "null"], minimum: 0 }
        weeklyXpUnavailable: { type: boolean, description: learning không trả lời; mọi `weeklyXp` là null. }

    Cheer:
      type: object
      additionalProperties: false
      required: [to, cheeredOn, at]
      properties:
        to: { $ref: "#/components/schemas/Handle" }
        cheeredOn: { type: string, format: date, description: Ngày theo giờ Việt Nam. }
        at: { type: string, format: date-time }

    FriendRequest:
      type: object
      additionalProperties: false
      description: Lời mời đang chờ. `person` là người bên kia (người gửi với lời mời đến, người nhận với lời mời đã gửi).
      required: [id, person, createdAt, expiresAt, classmate]
      properties:
        id: { type: string, format: uuid }
        person: { $ref: "#/components/schemas/Person" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "`createdAt` + 30 ngày." }
        classmate: { $ref: "#/components/schemas/Classmate" }

    FriendRequestLists:
      type: object
      additionalProperties: false
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items: { $ref: "#/components/schemas/FriendRequest" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/FriendRequest" }

    SendRequestResult:
      type: object
      additionalProperties: false
      description: "`accepted: false` kèm `request` (lời mời mới hay đang chờ); `accepted: true` kèm `friend` (người kia đã mời mình trước)."
      required: [accepted]
      properties:
        accepted: { type: boolean }
        request: { $ref: "#/components/schemas/FriendRequest" }
        friend: { $ref: "#/components/schemas/Friend" }

    Relation:
      type: string
      enum: [self, friend, incoming, outgoing, none]
      description: "`incoming`: người kia đã mời mình; `outgoing`: mình đã mời người kia. Có chặn (hai chiều) thì là `none`."

    RequestBlock:
      type: [string, "null"]
      enum: [self, not_student, you_blocked, already_friends, not_accepting, classmates_only, friend_limit, their_friend_limit, daily_limit, null]
      description: |
        Vì sao mình chưa gửi lời mời cho người này được (như mã lỗi của `POST /v1/me/friend-requests`); null là gửi được (kể cả khi người kia
        đã mời mình: gửi là chấp nhận). Bị người kia chặn hiện là `not_accepting`.

    SearchHit:
      type: object
      additionalProperties: false
      required: [person, relation]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        relation: { $ref: "#/components/schemas/Relation" }

    Suggestion:
      type: object
      additionalProperties: false
      required: [person, mutualCount, classmate]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        mutualCount: { type: integer, minimum: 0 }
        classmate: { $ref: "#/components/schemas/Classmate" }
        answeredMyQuestion:
          type: boolean
          description: "0.2.0 (lát `12a`): người này có câu trả lời đang hiện dưới một câu hỏi của mình trong 90 ngày. Vắng ở bản 0.1.0."

    Block:
      type: object
      additionalProperties: false
      required: [person, blockedAt]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        blockedAt: { type: string, format: date-time }

    HiddenPart:
      type: object
      additionalProperties: false
      description: |
        Một phần người xem không được xem. `friends_only`: chủ trang chỉ chia sẻ với bạn bè (web hiện nút Kết bạn); `only_me`: chủ trang để
        chỉ mình (cũng là điều người bị chặn thấy); `blocked`: người xem đã chặn chủ trang.
      required: [visible, reason]
      properties:
        visible: { type: boolean, const: false }
        reason: { type: string, enum: [friends_only, only_me, blocked] }

    SharedProgress:
      type: object
      additionalProperties: false
      description: |
        Tiến độ một học sinh chia sẻ với người khác, do learning tính (learning.yaml `GET /internal/learners/{userId}/shared-progress`, cùng
        dạng). **Không có** độ chính xác, chủ đề nên ôn, thời gian học (`activity` chỉ có XP từng ngày, không có phút).
      required: [level, totalXp, weeklyXp, monthlyXp, streakDays, longestStreakDays, course, activity, mastery]
      properties:
        level: { type: integer, minimum: 1 }
        totalXp: { type: integer, minimum: 0 }
        weeklyXp: { type: integer, minimum: 0 }
        monthlyXp: { type: integer, minimum: 0 }
        streakDays: { type: integer, minimum: 0 }
        longestStreakDays: { type: integer, minimum: 0 }
        course:
          type: [object, "null"]
          additionalProperties: false
          description: Khóa học sinh học gần nhất (theo bài học); null khi chưa học bài nào. Tên khóa web lấy từ nội dung.
          required: [courseId, lessonsCompleted, lessonsTotal]
          properties:
            courseId: { type: string, maxLength: 100 }
            lessonsCompleted: { type: integer, minimum: 0 }
            lessonsTotal: { type: integer, minimum: 0 }
        activity:
          type: array
          maxItems: 84
          description: 12 tuần gần nhất, cũ trước, ngày theo giờ Việt Nam; ngày không có XP có thể vắng.
          items:
            type: object
            additionalProperties: false
            required: [date, xp]
            properties:
              date: { type: string, format: date }
              xp: { type: integer, minimum: 0 }
        mastery:
          type: array
          description: Độ thành thạo từng chương của `course` (0–100), theo thứ tự chương. Tên chương web lấy từ nội dung.
          items:
            type: object
            additionalProperties: false
            required: [chapterId, percent]
            properties:
              chapterId: { type: string, maxLength: 100 }
              percent: { type: integer, minimum: 0, maximum: 100 }

    ProgressPart:
      oneOf:
        - $ref: "#/components/schemas/HiddenPart"
        - type: object
          additionalProperties: false
          required: [visible, unavailable, data, weeklyFriendRank]
          properties:
            visible: { type: boolean, const: true }
            unavailable: { type: boolean, description: learning không trả lời; `data` là null. }
            data:
              oneOf:
                - $ref: "#/components/schemas/SharedProgress"
                - type: "null"
            weeklyFriendRank:
              type: [object, "null"]
              additionalProperties: false
              description: Hạng tuần của chủ trang trong nhóm bạn của chủ trang (như bảng xếp hạng bạn bè); null khi chủ trang bật ẩn khỏi bảng xếp hạng, hay learning không trả lời.
              required: [rank, total]
              properties:
                rank: { type: integer, minimum: 1 }
                total: { type: integer, minimum: 1 }

    AchievementsPart:
      oneOf:
        - $ref: "#/components/schemas/HiddenPart"
        - type: object
          additionalProperties: false
          required: [visible, count, unlocked]
          properties:
            visible: { type: boolean, const: true }
            count: { type: integer, minimum: 0 }
            unlocked:
              type: array
              description: |
                Chỉ thành tích đã đạt (người khác không thấy thành tích chưa đạt và tiến độ của nó), mới nhất trước. Tên, mô tả, độ hiếm web
                lấy từ danh mục `GET /v1/achievements` của learning.
              items:
                type: object
                additionalProperties: false
                required: [achievementId, unlockedAt]
                properties:
                  achievementId: { type: string, pattern: "^[a-z0-9-]{1,60}$" }
                  unlockedAt: { type: string, format: date-time }

    FriendsPart:
      oneOf:
        - $ref: "#/components/schemas/HiddenPart"
        - type: object
          additionalProperties: false
          required: [visible, total, items, mutual]
          properties:
            visible: { type: boolean, const: true }
            total: { type: integer, minimum: 0 }
            items:
              type: array
              maxItems: 300
              description: Ở `GET /v1/profiles/{handle}`, 24 người đầu theo tên; đủ ở `GET /v1/profiles/{handle}/friends`.
              items: { $ref: "#/components/schemas/Person" }
            mutual:
              type: [object, "null"]
              additionalProperties: false
              description: Bạn chung với người xem (null khi người xem là chủ trang hay không phải học sinh). Chỉ có khi được xem danh sách bạn.
              required: [count, items]
              properties:
                count: { type: integer, minimum: 0 }
                items:
                  type: array
                  maxItems: 6
                  items: { $ref: "#/components/schemas/Person" }

    ProfileView:
      type: object
      additionalProperties: false
      required: [person, relation, blockedByMe, adminView, requestBlock, canCheer, cheeredToday, parts]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        relation: { $ref: "#/components/schemas/Relation" }
        incomingRequestId: { type: string, format: uuid, description: Chỉ khi `relation` là `incoming` (để Chấp nhận / Từ chối ngay trên trang). }
        outgoingRequestId: { type: string, format: uuid, description: Chỉ khi `relation` là `outgoing` (để Hủy lời mời). }
        blockedByMe: { type: boolean }
        adminView: { type: boolean, description: Người xem là admin nên thấy đủ các phần chia sẻ. }
        requestBlock: { $ref: "#/components/schemas/RequestBlock" }
        canCheer: { type: boolean, description: "Người xem là bạn, là học sinh, chưa cổ vũ hôm nay." }
        cheeredToday: { type: boolean }
        messageBlock:
          $ref: "#/components/schemas/MessageBlock"
          description: |
            0.3.0 (M13, lát `13e`): vì sao người xem chưa nhắn được cho chủ trang (null là nhắn được: web hiện nút "Nhắn tin"). Vắng khi social chưa
            có tin nhắn. Bị chủ trang chặn hiện là `messages_closed`.
        parts:
          type: [object, "null"]
          additionalProperties: false
          description: Null khi chủ trang không phải học sinh.
          required: [progress, achievements, friends]
          properties:
            progress: { $ref: "#/components/schemas/ProgressPart" }
            achievements: { $ref: "#/components/schemas/AchievementsPart" }
            friends: { $ref: "#/components/schemas/FriendsPart" }

    BoardEntry:
      type: object
      additionalProperties: false
      required: [person, rank, xp, rankChange, isMe]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        rank: { type: integer, minimum: 1 }
        xp: { type: integer, minimum: 0, description: XP trong kỳ. }
        rankChange: { type: [integer, "null"], description: Dương là lên hạng. }
        isMe: { type: boolean }

    FriendBoard:
      type: object
      additionalProperties: false
      required: [period, from, entries, me, above, meHidden, unavailable]
      properties:
        period: { type: string, enum: [week, month, all] }
        from: { type: [string, "null"], format: date-time, description: Đầu kỳ (null với `all`). }
        entries:
          type: array
          maxItems: 301
          items: { $ref: "#/components/schemas/BoardEntry" }
        me: { oneOf: [{ $ref: "#/components/schemas/BoardEntry" }, { type: "null" }] }
        above: { oneOf: [{ $ref: "#/components/schemas/BoardEntry" }, { type: "null" }], description: Người ngay trên mình (để "còn N XP để vượt …"). }
        meHidden: { type: boolean }
        unavailable: { type: boolean }

    FriendNewsItem:
      type: object
      additionalProperties: false
      description: |
        Một tin vui. Theo `kind`: `achievement` có `achievementId`; `streak` có `days` (7, 30, 100); `chapter` có `courseId`, `chapterId`;
        `level` có `level`. Web dựng chữ theo chế độ.
      required: [id, person, kind, occurredAt]
      properties:
        id: { type: string, format: uuid }
        person: { $ref: "#/components/schemas/Person" }
        kind: { type: string, enum: [achievement, streak, chapter, level] }
        occurredAt: { type: string, format: date-time }
        achievementId: { type: string, pattern: "^[a-z0-9-]{1,60}$" }
        days: { type: integer, enum: [7, 30, 100] }
        courseId: { type: string, maxLength: 100 }
        chapterId: { type: string, maxLength: 100 }
        level: { type: integer, minimum: 2 }

    NotificationKind:
      type: string
      enum:
        - friend_request
        - friend_accepted
        - cheer
        - assignment_created
        - class_member_joined
        - assignment_submitted
        - achievement_unlocked
        - level_up
        - top_up_paid
        - wallet_adjusted
        - announcement
        # 0.2.0 (M12)
        - community_answer
        - community_comment
        - community_accepted
        - community_approved
        - community_hidden
        - community_restored
        - community_image_rejected
        - community_warned
        - community_muted
        - community_appeal_accepted
        - community_appeal_rejected
        # 0.3.0 (M13)
        - message_group_added
      description: |
        Thêm loại là bản thêm của hợp đồng (Cộng đồng từ 0.2.0; tin nhắn ở M13). Web bỏ qua loại lạ. Mỗi loại dùng các `params` sau:
        - `friend_request` (người nhận lời mời; `actor` người gửi): `requestId`. Bị xóa khi lời mời được trả lời, hủy, hết hạn, có chặn.
        - `friend_accepted` (người đã gửi lời mời; `actor` người chấp nhận): không có tham số.
        - `cheer` (người được cổ vũ; gộp theo ngày khi chưa đọc): `cheeredOn`.
        - `assignment_created` (mọi học sinh của lớp lúc giao; `actor` giáo viên): `classId`, `className`, `assignmentId`, `workId`, `workKind`,
          `workTitle`, `dueAt`. Bị xóa khi bài giao bị xóa.
        - `class_member_joined` (giáo viên; gộp theo lớp khi chưa đọc; `actor` học sinh vào gần nhất): `classId`, `className`.
        - `assignment_submitted` (giáo viên; lần nộp đầu của mỗi học sinh; gộp theo bài giao khi chưa đọc): `classId`, `className`,
          `assignmentId`, `workId`, `workTitle`.
        - `achievement_unlocked` (học sinh): `achievementId`. Không có khi thành tích được tính lại cho dữ liệu cũ.
        - `level_up` (học sinh): `level`.
        - `top_up_paid` (học sinh): `orderCode`, `coins`.
        - `wallet_adjusted` (học sinh; admin cộng hay trừ ví): `amount` (dương hay âm). Không bao giờ có lý do của admin.
        - `announcement` (nhóm nhận; `actor` null, web ghi "Quản trị viên"): `announcementId`, `title`, `body`.

        0.2.0 (M12, Cộng đồng; lát `12a`, `12c`, `12d`). `subject` là vài chữ đầu (tối đa 80 kí tự) của tiêu đề hay thân bài, câu trả lời mà
        thông báo nói tới, chụp lúc tạo (chữ người dùng viết, giống nhau ở mọi chế độ); `note` là lời admin viết cho người nhận. Thông báo có
        `actor` là người mà người nhận đã chặn, hay đã bị khóa, không hiện. Web dựng đường dẫn `/community/threads/<threadId>` (kèm
        `#reply-<replyId>`) hay `/community/moderation`.
        - `community_answer` (người hỏi; gộp theo câu hỏi khi chưa đọc, `actor` người trả lời gần nhất): `threadId`, `replyId`, `subject`.
        - `community_comment` (chủ bài viết, hay chủ câu trả lời được bình luận; gộp theo bài hay theo câu trả lời khi chưa đọc): `threadId`,
          `replyId` (bình luận gần nhất), `subject` (bài hay câu trả lời được bình luận).
        - `community_accepted` (người trả lời; `actor` người hỏi): `threadId`, `replyId`, `subject`. Không hứa XP (learning quyết).
        - `community_approved` (tác giả; nội dung chờ duyệt đã được duyệt): `threadId`, `replyId` (khi là câu trả lời), `subject`.
        - `community_hidden` (tác giả; `actor` null; nội dung bị admin ẩn hay xóa, hay tự ẩn): `threadId`, `replyId`, `subject`, `actionId`,
          `reasonCode` (vắng khi `byReports`), `note`, `byReports` (tự ẩn vì nhiều người báo cáo, chờ admin xem lại), `appealable`.
        - `community_restored` (tác giả; hiện lại sau khi admin xem, hay báo cáo bị bỏ qua): `threadId`, `replyId`, `subject`.
        - `community_image_rejected` (tác giả): `threadId`, `subject`, `actionId`, `reasonCode`, `note`, `appealable`.
        - `community_warned` (người bị nhắc nhở): `actionId`, `reasonCode`, `note`, `appealable`.
        - `community_muted` (người bị khóa đăng bài): `actionId`, `reasonCode`, `note`, `until`, `appealable`.
        - `community_appeal_accepted`, `community_appeal_rejected` (người kháng nghị): `actionId`, `note`; `threadId`, `replyId`, `subject` khi
          lần xử lý nhắm vào một nội dung.

        0.3.0 (M13, lát `13e`):
        - `message_group_added` (người được thêm vào nhóm, kể cả lúc lập nhóm; `actor` người thêm): `conversationId`, `title` (tên nhóm lúc đó,
          người dùng đặt, giống nhau ở mọi chế độ). Web dựng đường dẫn `/messages/<conversationId>`. Tin nhắn thường không tạo thông báo (số chưa
          đọc ở mục Tin nhắn là đủ, như bản thử). Bị xóa khi người đó rời hay bị mời ra khỏi nhóm.

    NotificationParams:
      type: object
      additionalProperties: false
      description: Tham số theo `kind` (xem `NotificationKind`). Chữ ở đây là tên do người dùng đặt (lớp, bài) hay chữ admin viết, chụp lúc tạo.
      properties:
        requestId: { type: string, format: uuid }
        cheeredOn: { type: string, format: date }
        classId: { type: string, format: uuid }
        className: { type: string, minLength: 1, maxLength: 100 }
        assignmentId: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        workKind: { type: string, enum: [exercise, exam] }
        workTitle: { type: string, minLength: 1, maxLength: 200 }
        dueAt: { type: string, format: date-time }
        achievementId: { type: string, pattern: "^[a-z0-9-]{1,60}$" }
        level: { type: integer, minimum: 2 }
        orderCode: { type: string, pattern: "^PK[0-9]{6}-[0-9]{6}$" }
        coins: { type: integer, minimum: 1 }
        amount: { type: integer, format: int64, not: { const: 0 } }
        announcementId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 500 }
        # 0.2.0 (M12)
        threadId: { type: string, format: uuid }
        replyId: { type: string, format: uuid }
        subject: { type: string, minLength: 1, maxLength: 80 }
        actionId: { type: string, format: uuid }
        reasonCode: { $ref: "#/components/schemas/ReportReason" }
        note: { type: string, maxLength: 500 }
        until: { type: string, format: date-time }
        byReports: { type: boolean }
        appealable: { type: boolean }
        # 0.3.0 (M13)
        conversationId: { type: string, format: uuid }

    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt, updatedAt, read, count, actor, actors, params]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Lần cuối dòng gộp nhận thêm một sự kiện (bằng `createdAt` với dòng không gộp). }
        read: { type: boolean }
        count: { type: integer, minimum: 1, description: Số sự kiện gộp vào dòng này (1 với dòng không gộp). }
        actor: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }] }
        actors:
          type: array
          maxItems: 3
          description: Với dòng gộp, tối đa 3 người gần nhất (mới nhất trước, gồm cả `actor`); rỗng với dòng không gộp.
          items: { $ref: "#/components/schemas/Person" }
        params: { $ref: "#/components/schemas/NotificationParams" }

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, unread, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Notification" }
        unread: { type: integer, minimum: 0 }
        nextCursor: { type: [string, "null"] }

    AnnouncementRequest:
      type: object
      additionalProperties: false
      required: [audience, title]
      properties:
        audience: { type: string, enum: [students, teachers, everyone] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 500, default: "" }

    Announcement:
      type: object
      additionalProperties: false
      required: [id, audience, title, body, authorId, createdAt, recipients, retractedAt]
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [students, teachers, everyone] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 500 }
        authorId: { type: string, format: uuid, description: Mã tài khoản của admin gửi (chỉ ở đường admin). }
        createdAt: { type: string, format: date-time }
        recipients: { type: integer, minimum: 0, description: Số dòng thông báo đã ghi. }
        retractedAt: { type: [string, "null"], format: date-time }

    AnnouncementPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
        nextCursor: { type: [string, "null"] }

    AdminUserSocial:
      type: object
      additionalProperties: false
      required: [userId, person, privacy, counts]
      properties:
        userId: { type: string, format: uuid }
        person: { $ref: "#/components/schemas/Person" }
        privacy: { $ref: "#/components/schemas/ProfilePrivacy" }
        counts:
          type: object
          additionalProperties: false
          required: [friends, incomingRequests, outgoingRequests, blocking, blockedBy, requestsSentToday]
          properties:
            friends: { type: integer, minimum: 0 }
            incomingRequests: { type: integer, minimum: 0 }
            outgoingRequests: { type: integer, minimum: 0 }
            blocking: { type: integer, minimum: 0, description: Số người tài khoản này đã chặn. }
            blockedBy: { type: integer, minimum: 0, description: Số người đã chặn tài khoản này (dấu hiệu để admin để ý; không có danh sách). }
            requestsSentToday: { type: integer, minimum: 0 }

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actorId, action, createdAt, details]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string, enum: [announcement_created, announcement_retracted] }
        targetId: { type: [string, "null"], format: uuid, description: Mã thông báo chung. }
        createdAt: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: false
          properties:
            audience: { type: string, enum: [students, teachers, everyone] }
            title: { type: string, maxLength: 120 }
            recipients: { type: integer, minimum: 0 }

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextCursor: { type: [string, "null"] }

    # ================================================================ 0.2.0 (M12): Cộng đồng, kiểm duyệt, ảnh

    ContentId:
      type: string
      pattern: "^[\\w.:-]{1,100}$"
      description: Mã nội dung học của learning (khóa, chương, bài, câu ngân hàng), dạng chữ như `hoa-hoc-10`, `c4`, `so-oxi-hoa`.

    ThreadKind:
      type: string
      enum: [post, question, achievement_share]
      description: "`post` bài viết; `question` câu hỏi (Hỏi đáp); `achievement_share` chia sẻ một thành tích đã đạt (học sinh tự bấm, không tự đăng)."

    ContentStatus:
      type: string
      enum: [pending, visible, hidden, deleted]
      description: |
        `pending` chờ admin duyệt (chỉ tác giả và admin thấy); `visible` mọi người thấy; `hidden` bị ẩn (bởi admin, hay tự ẩn vì 3 người báo
        cáo; chỉ tác giả và admin thấy); `deleted` đã xóa (bởi tác giả hay admin; chỉ admin thấy, tới khi bị xóa hẳn).

    ReportReason:
      type: string
      enum: [offensive, bullying, adult, spam, cheating, wrong_chemistry, personal_info, other]
      description: |
        Như `ReportReason` của web (`src/types/community.ts`, nhãn ở `REPORT_REASONS`); cũng là mã lý do khi admin ẩn, xóa, nhắc nhở, khóa.
        `bullying`, `adult` lên đầu hàng chờ.

    FilterFlag:
      type: object
      additionalProperties: false
      description: |
        Một cờ của bộ lọc tự động (bản sao có chủ đích của `checkContent` ở web, M12-COMMUNITY.md mục 5.2). Web dựng chữ như bản thử ("Có số
        điện thoại", "Trùng câu hỏi của đề thi đang mở"…). `blocked_term` làm bài bị từ chối; các cờ khác làm bài chờ duyệt.
      required: [code]
      properties:
        code:
          type: string
          enum: [new_account, blocked_term, review_term, phone, email, link, exam_overlap, exam_check_failed]
        term: { type: string, minLength: 1, maxLength: 60, description: "Chỉ `blocked_term`, `review_term`: từ khóa đã khớp." }

    ContentRefs:
      type: object
      additionalProperties: false
      description: |
        Bài gắn với khóa, chương, bài học, câu ngân hàng nào (mã của learning, đã kiểm lúc đăng). Tên khóa, chương, bài và đề bài của câu web
        lấy từ nội dung (đề bài của câu thuộc đề đang mở không bao giờ đến trình duyệt học sinh: web không xin). Bài học đã bị gỡ thì web chỉ
        hiện chương.
      required: [courseId, chapterId, lessonId, questionId]
      properties:
        courseId: { type: [string, "null"], pattern: "^[\\w.:-]{1,100}$" }
        chapterId: { type: [string, "null"], pattern: "^[\\w.:-]{1,100}$" }
        lessonId: { type: [string, "null"], pattern: "^[\\w.:-]{1,100}$" }
        questionId: { type: [string, "null"], pattern: "^[\\w.:-]{1,100}$" }

    CommunityImage:
      type: object
      additionalProperties: false
      description: |
        Một ảnh của bài. Người khác chỉ nhận ảnh đã duyệt (ảnh chờ duyệt của người khác chỉ đếm ở `pendingImageCount`); tác giả và admin nhận
        cả ảnh chờ duyệt; ảnh bị từ chối chỉ tác giả (không URL) và admin thấy. `url`, `thumbUrl` là URL `GET` ký sẵn của kho ảnh, hết hạn lúc
        `urlExpiresAt` (1 giờ): trang mở lâu thì web đọc lại bài. Ảnh đã được nén lại thành WebP, không còn EXIF.
      required: [id, status, alt, width, height, url, thumbUrl, urlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, visible, rejected] }
        alt: { type: [string, "null"], maxLength: 120, description: Chú thích người đăng gõ; null là không có (web ghi "Ảnh 1 của bài"…). }
        width: { type: integer, minimum: 1, maximum: 1600 }
        height: { type: integer, minimum: 1, maximum: 1600 }
        url: { type: [string, "null"], maxLength: 2000 }
        thumbUrl: { type: [string, "null"], maxLength: 2000 }
        urlExpiresAt: { type: [string, "null"], format: date-time }

    ContentModeration:
      type: [object, "null"]
      additionalProperties: false
      description: |
        Chỉ với tác giả (và admin): vì sao nội dung của mình bị ẩn hay bị xóa, có kháng nghị được không. Null khi không bị xử lý (nội dung chờ
        duyệt thì xem `flags`).
      required: [actionId, action, reasonCode, note, at, appealable, appeal]
      properties:
        actionId: { type: string, format: uuid }
        action: { type: string, enum: [hide, auto_hide, delete] }
        reasonCode: { oneOf: [{ $ref: "#/components/schemas/ReportReason" }, { type: "null" }] }
        note: { type: [string, "null"], maxLength: 500 }
        at: { type: string, format: date-time }
        appealable: { type: boolean }
        appeal: { oneOf: [{ $ref: "#/components/schemas/AppealState" }, { type: "null" }] }

    ThreadSummary:
      type: object
      additionalProperties: false
      description: |
        Một bài trên bảng tin. `author` là thẻ người (mã hồ sơ, không bao giờ mã tài khoản). `liked`, `saved`, `mine` theo người xem. `flags`,
        `moderation` chỉ có khi người xem là tác giả hay admin.
      required: [id, kind, author, title, body, refs, achievementId, images, pendingImageCount, status, pinned, acceptedReplyId, likeCount, answerCount, replyCount, createdAt, lastActivityAt, liked, saved, mine]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ThreadKind" }
        author: { $ref: "#/components/schemas/Person" }
        title: { type: [string, "null"], maxLength: 150, description: Bắt buộc với câu hỏi. }
        body: { type: string, minLength: 1, maxLength: 5000 }
        refs: { $ref: "#/components/schemas/ContentRefs" }
        achievementId: { type: [string, "null"], pattern: "^[a-z0-9-]{1,60}$", description: Chỉ `achievement_share`. Tên thành tích web lấy từ danh mục của learning. }
        images:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/CommunityImage" }
        pendingImageCount: { type: integer, minimum: 0, maximum: 3, description: Số ảnh chờ duyệt người xem không được thấy (web ghi "N ảnh đang chờ duyệt"). }
        status: { $ref: "#/components/schemas/ContentStatus" }
        pinned: { type: boolean }
        acceptedReplyId: { type: [string, "null"], format: uuid }
        likeCount: { type: integer, minimum: 0 }
        answerCount: { type: integer, minimum: 0, description: Câu trả lời đang hiện (câu hỏi); 0 với bài viết. }
        replyCount: { type: integer, minimum: 0, description: Mọi câu trả lời và bình luận đang hiện. }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        liked: { type: boolean }
        saved: { type: boolean }
        mine: { type: boolean }
        flags:
          type: array
          items: { $ref: "#/components/schemas/FilterFlag" }
        moderation: { $ref: "#/components/schemas/ContentModeration" }

    Reply:
      type: object
      additionalProperties: false
      description: |
        Một câu trả lời (câu hỏi), bình luận (bài viết) hay bình luận dưới một câu trả lời (`parentId`). `comments` chỉ có ở câu trả lời của câu
        hỏi (một cấp), đã xếp. `myVote` là phiếu của người xem.
      required: [id, threadId, parentId, author, body, status, upvotes, downvotes, myVote, createdAt, mine]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        author: { $ref: "#/components/schemas/Person" }
        body: { type: string, minLength: 1, maxLength: 3000 }
        status: { $ref: "#/components/schemas/ContentStatus" }
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        myVote: { type: [integer, "null"], enum: [1, -1, null] }
        createdAt: { type: string, format: date-time }
        mine: { type: boolean }
        flags:
          type: array
          items: { $ref: "#/components/schemas/FilterFlag" }
        moderation: { $ref: "#/components/schemas/ContentModeration" }
        comments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Reply" }

    ThreadDetail:
      type: object
      additionalProperties: false
      required: [thread, replies, truncated, replyBlock, canAccept]
      properties:
        thread: { $ref: "#/components/schemas/ThreadSummary" }
        replies:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Reply" }
        truncated: { type: boolean, description: Bài có hơn 200 câu trả lời; chỉ 200 câu đầu theo thứ tự. }
        replyBlock:
          type: [string, "null"]
          enum: [replies_closed, muted, account_locked, thread_not_visible, null]
          description: Vì sao mình chưa trả lời được (cùng mã lỗi máy chủ sẽ trả); null là trả lời được. Bị chủ bài chặn hiện là `replies_closed`.
        canAccept: { type: boolean, description: Mình là người hỏi và câu hỏi đang hiện. }

    ThreadPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ThreadSummary" }
        nextCursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0, description: Chỉ khi lọc theo `lessonId`. }

    NewThread:
      type: object
      additionalProperties: false
      description: |
        `question`: cần `title` (10–150 kí tự) và `lessonId` (có thể kèm `questionId` khi đến từ "Hỏi về câu này"). `post`: `lessonId` hay
        `chapterId` tùy chọn. `achievement_share`: cần `achievementId`, không ảnh. Chữ gửi lên đã định dạng công thức (H₂SO₄) như web đang làm;
        máy chủ không đổi chữ.
      required: [kind, body]
      properties:
        kind: { $ref: "#/components/schemas/ThreadKind" }
        title: { type: string, minLength: 10, maxLength: 150 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        lessonId: { $ref: "#/components/schemas/ContentId" }
        chapterId: { $ref: "#/components/schemas/ContentId" }
        questionId: { $ref: "#/components/schemas/ContentId" }
        achievementId: { type: string, pattern: "^[a-z0-9-]{1,60}$" }
        mediaIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }

    NewReply:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 3000 }
        parentId: { type: string, format: uuid, description: Câu trả lời được bình luận (chỉ với câu hỏi). }

    Outcome:
      type: object
      additionalProperties: false
      description: Kết quả bộ lọc và kiểm duyệt của một lần đăng (web hiện "Đã đăng" hay "Đang chờ duyệt" kèm lý do, như `PostOutcome` của bản thử).
      required: [status, flags]
      properties:
        status: { type: string, enum: [visible, pending] }
        flags:
          type: array
          items: { $ref: "#/components/schemas/FilterFlag" }

    PostOutcome:
      type: object
      additionalProperties: false
      required: [thread, outcome]
      properties:
        thread: { $ref: "#/components/schemas/ThreadSummary" }
        outcome: { $ref: "#/components/schemas/Outcome" }

    ReplyOutcome:
      type: object
      additionalProperties: false
      required: [reply, outcome]
      properties:
        reply: { $ref: "#/components/schemas/Reply" }
        outcome: { $ref: "#/components/schemas/Outcome" }

    LikeState:
      type: object
      additionalProperties: false
      required: [threadId, likeCount, liked]
      properties:
        threadId: { type: string, format: uuid }
        likeCount: { type: integer, minimum: 0 }
        liked: { type: boolean }

    AcceptState:
      type: object
      additionalProperties: false
      required: [threadId, acceptedReplyId]
      properties:
        threadId: { type: string, format: uuid }
        acceptedReplyId: { type: [string, "null"], format: uuid }

    VoteState:
      type: object
      additionalProperties: false
      required: [replyId, upvotes, downvotes, myVote]
      properties:
        replyId: { type: string, format: uuid }
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        myVote: { type: [integer, "null"], enum: [1, -1, null] }

    CommunityStats:
      type: object
      additionalProperties: false
      description: Như `memberStats` của web, đếm trên nội dung đang hiện.
      required: [questions, posts, answers, accepted, upvotesReceived]
      properties:
        questions: { type: integer, minimum: 0 }
        posts: { type: integer, minimum: 0 }
        answers: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        upvotesReceived: { type: integer, minimum: 0 }

    DailyUse:
      type: object
      additionalProperties: false
      required: [used, limit]
      properties:
        used: { type: integer, minimum: 0 }
        limit: { type: [integer, "null"], minimum: 0, description: Null là không giới hạn (admin). }

    MemberRestriction:
      type: [object, "null"]
      additionalProperties: false
      description: Đang bị khóa đăng bài tới `until`; null là không.
      required: [kind, until, actionId]
      properties:
        kind: { type: string, const: mute }
        until: { type: string, format: date-time }
        actionId: { type: string, format: uuid }

    MyCommunity:
      type: object
      additionalProperties: false
      required: [me, newAccount, newAccountUntil, canDownvote, restriction, stats, today]
      properties:
        me: { $ref: "#/components/schemas/Person" }
        newAccount: { type: boolean, description: Tài khoản dưới 7 ngày (theo ngày tạo ở identity; chưa biết thì tính là mới). Admin luôn false. }
        newAccountUntil: { type: [string, "null"], format: date-time }
        canDownvote: { type: boolean }
        restriction: { $ref: "#/components/schemas/MemberRestriction" }
        stats: { $ref: "#/components/schemas/CommunityStats" }
        today:
          type: object
          additionalProperties: false
          required: [resetsAt, threads, replies, uploads, reports]
          properties:
            resetsAt: { type: string, format: date-time }
            threads: { $ref: "#/components/schemas/DailyUse" }
            replies: { $ref: "#/components/schemas/DailyUse" }
            uploads: { $ref: "#/components/schemas/DailyUse" }
            reports: { $ref: "#/components/schemas/DailyUse" }

    ProfileAnswer:
      type: object
      additionalProperties: false
      required: [reply, thread]
      properties:
        reply:
          type: object
          additionalProperties: false
          required: [id, body, upvotes, downvotes, accepted, createdAt]
          properties:
            id: { type: string, format: uuid }
            body: { type: string, minLength: 1, maxLength: 3000 }
            upvotes: { type: integer, minimum: 0 }
            downvotes: { type: integer, minimum: 0 }
            accepted: { type: boolean }
            createdAt: { type: string, format: date-time }
        thread:
          type: object
          additionalProperties: false
          required: [id, title]
          properties:
            id: { type: string, format: uuid }
            title: { type: string, maxLength: 150 }

    ProfileCommunity:
      type: object
      additionalProperties: false
      required: [person, hidden, stats, threads, threadsCursor, answers, answersCursor]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        hidden:
          oneOf: [{ $ref: "#/components/schemas/HiddenPart" }, { type: "null" }]
          description: Chỉ lý do `blocked` (người xem đã chặn chủ trang); khi đó các danh sách rỗng, số liệu 0.
        stats: { $ref: "#/components/schemas/CommunityStats" }
        threads:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ThreadSummary" }
        threadsCursor: { type: [string, "null"] }
        answers:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProfileAnswer" }
        answersCursor: { type: [string, "null"] }

    ContentTarget:
      type: object
      additionalProperties: false
      description: Đúng một trong hai.
      properties:
        threadId: { type: string, format: uuid }
        replyId: { type: string, format: uuid }
      oneOf:
        - { required: [threadId], not: { required: [replyId] } }
        - { required: [replyId], not: { required: [threadId] } }

    NewReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        threadId: { type: string, format: uuid }
        replyId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        note: { type: string, maxLength: 500 }
      oneOf:
        - { required: [threadId], not: { required: [replyId] } }
        - { required: [replyId], not: { required: [threadId] } }

    ReportReceipt:
      type: object
      additionalProperties: false
      description: Chỉ xác nhận đã ghi; không nói nội dung đã bị ẩn hay chưa, có bao nhiêu người khác báo cáo.
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    AppealState:
      type: object
      additionalProperties: false
      required: [id, actionId, status, message, createdAt, resolvedAt, note]
      properties:
        id: { type: string, format: uuid }
        actionId: { type: string, format: uuid }
        status: { type: string, enum: [open, accepted, rejected] }
        message: { type: string, minLength: 10, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"], maxLength: 500, description: Lời admin gửi kèm quyết định. }

    MyModerationItem:
      type: object
      additionalProperties: false
      required: [actionId, action, at, reasonCode, note, target, until, reversed, appealable, appealUntil, appeal]
      properties:
        actionId: { type: string, format: uuid }
        action: { type: string, enum: [hide, auto_hide, delete, image_reject, warn, mute] }
        at: { type: string, format: date-time }
        reasonCode: { oneOf: [{ $ref: "#/components/schemas/ReportReason" }, { type: "null" }] }
        note: { type: [string, "null"], maxLength: 500 }
        target:
          type: [object, "null"]
          additionalProperties: false
          required: [kind, threadId, replyId, subject]
          properties:
            kind: { type: string, enum: [thread, reply, image] }
            threadId: { type: string, format: uuid }
            replyId: { type: [string, "null"], format: uuid }
            subject: { type: string, minLength: 1, maxLength: 80 }
        until: { type: [string, "null"], format: date-time, description: Chỉ `mute`. }
        reversed: { type: boolean, description: "Lần xử lý đã được hoàn lại (hiện lại, gỡ khóa, kháng nghị được chấp nhận)." }
        appealable: { type: boolean }
        appealUntil: { type: [string, "null"], format: date-time }
        appeal: { oneOf: [{ $ref: "#/components/schemas/AppealState" }, { type: "null" }] }

    MyModerationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/MyModerationItem" }
        nextCursor: { type: [string, "null"] }

    UploadTicket:
      type: object
      additionalProperties: false
      required: [mediaId, method, url, headers, expiresAt]
      properties:
        mediaId: { type: string, format: uuid }
        method: { type: string, const: PUT }
        url: { type: string, maxLength: 2000, description: URL ký sẵn tới khu nhận của kho ảnh (S3). }
        headers:
          type: object
          additionalProperties: false
          required: [Content-Type]
          description: Header trình duyệt phải gửi đúng như vậy (`Content-Length` trình duyệt tự đặt bằng số byte của tệp, phải bằng `bytes` đã khai).
          properties:
            Content-Type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        expiresAt: { type: string, format: date-time }

    MediaInfo:
      type: object
      additionalProperties: false
      required: [id, status, width, height, alt, previewUrl, previewUrlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: ready, description: "Đã kiểm và nén lại, chờ gắn vào bài." }
        width: { type: integer, minimum: 1, maximum: 1600 }
        height: { type: integer, minimum: 1, maximum: 1600 }
        alt: { type: [string, "null"], maxLength: 120 }
        previewUrl: { type: string, maxLength: 2000, description: "URL ký sẵn của bản nhỏ (chỉ người tải lên), để xem trước trong ô soạn." }
        previewUrlExpiresAt: { type: string, format: date-time }

    QueueName:
      type: string
      enum: [unanswered, pending, images, reports, appeals]

    ModerationSummary:
      type: object
      additionalProperties: false
      required: [queues]
      properties:
        queues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [queue, count, oldestAt]
            properties:
              queue: { $ref: "#/components/schemas/QueueName" }
              count: { type: integer, minimum: 0 }
              oldestAt: { type: [string, "null"], format: date-time }

    QueueReport:
      type: object
      additionalProperties: false
      description: Một nội dung có báo cáo đang mở (gộp mọi báo cáo của nó), hay có điểm tán thành từ −5 trở xuống (`lowScore`).
      required: [kind, thread, reply, reports, urgent, lowScore, hiddenByReports, authorLocked, since]
      properties:
        kind: { type: string, const: report }
        thread: { $ref: "#/components/schemas/ThreadSummary" }
        reply: { oneOf: [{ $ref: "#/components/schemas/Reply" }, { type: "null" }] }
        reports:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, reporter, reason, note, createdAt]
            properties:
              id: { type: string, format: uuid }
              reporter: { $ref: "#/components/schemas/Person" }
              reason: { $ref: "#/components/schemas/ReportReason" }
              note: { type: [string, "null"], maxLength: 500 }
              createdAt: { type: string, format: date-time }
        urgent: { type: boolean }
        lowScore: { type: boolean }
        hiddenByReports: { type: boolean }
        authorLocked: { type: boolean }
        since: { type: string, format: date-time }

    QueueItem:
      oneOf:
        - type: object
          additionalProperties: false
          description: Câu hỏi chưa có câu trả lời nào đang hiện.
          required: [kind, thread, since]
          properties:
            kind: { type: string, const: unanswered }
            thread: { $ref: "#/components/schemas/ThreadSummary" }
            since: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          description: Một bài (`reply` null) hay một câu trả lời, bình luận chờ duyệt, kèm cờ.
          required: [kind, thread, reply, flags, authorNew, authorLocked, since]
          properties:
            kind: { type: string, const: pending }
            thread: { $ref: "#/components/schemas/ThreadSummary" }
            reply: { oneOf: [{ $ref: "#/components/schemas/Reply" }, { type: "null" }] }
            flags:
              type: array
              items: { $ref: "#/components/schemas/FilterFlag" }
            authorNew: { type: boolean }
            authorLocked: { type: boolean }
            since: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          description: Một ảnh chờ duyệt (URL ký sẵn cho admin).
          required: [kind, image, thread, similarToRejected, since]
          properties:
            kind: { type: string, const: image }
            image: { $ref: "#/components/schemas/CommunityImage" }
            thread: { $ref: "#/components/schemas/ThreadSummary" }
            similarToRejected: { type: boolean, description: Gần giống (mã băm cảm nhận) một ảnh admin đã chặn. }
            since: { type: string, format: date-time }
        - $ref: "#/components/schemas/QueueReport"
        - type: object
          additionalProperties: false
          description: Một kháng nghị đang mở, kèm lần xử lý bị kháng nghị và nội dung của nó (nếu có).
          required: [kind, appeal, appellant, action, thread, reply, since]
          properties:
            kind: { type: string, const: appeal }
            appeal: { $ref: "#/components/schemas/AppealState" }
            appellant: { $ref: "#/components/schemas/Person" }
            action: { $ref: "#/components/schemas/ModerationLogEntry" }
            thread: { oneOf: [{ $ref: "#/components/schemas/ThreadSummary" }, { type: "null" }] }
            reply: { oneOf: [{ $ref: "#/components/schemas/Reply" }, { type: "null" }] }
            since: { type: string, format: date-time }

    QueuePage:
      type: object
      additionalProperties: false
      required: [queue, items, nextCursor]
      properties:
        queue: { $ref: "#/components/schemas/QueueName" }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueueItem" }
        nextCursor: { type: [string, "null"] }

    ModerationRequest:
      type: object
      additionalProperties: false
      description: "`hide`, `delete` cần `reasonCode` (thiếu: 400 `validation_failed`). `pin`, `unpin` chỉ với bài."
      required: [action]
      properties:
        action: { type: string, enum: [approve, hide, restore, delete, pin, unpin] }
        reasonCode: { $ref: "#/components/schemas/ReportReason" }
        note: { type: string, maxLength: 500, description: Lời giải thích cho tác giả (họ thấy nguyên văn). }

    ModerationResult:
      type: object
      additionalProperties: false
      required: [changed, actionId]
      properties:
        changed: { type: boolean, description: False khi trạng thái đã đúng từ trước (không ghi nhật ký). }
        actionId: { type: [string, "null"], format: uuid }
        until: { type: [string, "null"], format: date-time, description: Chỉ `mute`. }

    SanctionRequest:
      type: object
      additionalProperties: false
      description: "`days` bắt buộc với `mute`, không được có với `warn`, `ban` (400 `validation_failed`)."
      required: [kind, reasonCode]
      properties:
        kind: { type: string, enum: [warn, mute, ban] }
        days: { type: integer, enum: [1, 7, 30], description: Chỉ `mute` (bắt buộc). }
        reasonCode: { $ref: "#/components/schemas/ReportReason" }
        note: { type: string, maxLength: 500, description: "Lời giải thích cho người bị xử lý (`warn`, `mute`); không đi vào sự kiện `ban`." }
        relatedActionId: { type: string, format: uuid, description: "Lần xử lý nội dung dẫn tới quyết định này (tùy chọn). 0.2.1: phải là lần xử lý của chính người bị xử lý, không thì 400." }

    ModerationAction:
      type: string
      enum: [approve, hide, restore, delete, auto_hide, dismiss_reports, pin, unpin, image_approve, image_reject, warn, mute, unmute, ban, appeal_accept, appeal_reject, filter_term_set, filter_term_remove]
      description: Như `ModerationActionKind` của web (`suspend` của bản thử là `mute`; `auto_hide` là hệ thống).

    ModerationLogEntry:
      type: object
      additionalProperties: false
      required: [id, actor, action, target, reasonCode, note, until, at]
      properties:
        id: { type: string, format: uuid }
        actor: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }], description: Null là hệ thống (tự ẩn vì báo cáo). }
        action: { $ref: "#/components/schemas/ModerationAction" }
        target:
          type: object
          additionalProperties: false
          required: [kind, threadId, replyId, mediaId, member, subject, term]
          properties:
            kind: { type: string, enum: [thread, reply, image, member, filter_term] }
            threadId: { type: [string, "null"], format: uuid }
            replyId: { type: [string, "null"], format: uuid }
            mediaId: { type: [string, "null"], format: uuid }
            member: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }], description: Người bị xử lý (hay tác giả của nội dung). }
            subject: { type: [string, "null"], maxLength: 80 }
            term: { type: [string, "null"], maxLength: 60 }
        reasonCode: { oneOf: [{ $ref: "#/components/schemas/ReportReason" }, { type: "null" }] }
        note: { type: [string, "null"], maxLength: 500 }
        until: { type: [string, "null"], format: date-time }
        at: { type: string, format: date-time }

    ModerationLogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ModerationLogEntry" }
        nextCursor: { type: [string, "null"] }

    MemberModeration:
      type: object
      additionalProperties: false
      required: [userId, person, locked, newAccount, restriction, counts, recent]
      properties:
        userId: { type: string, format: uuid, description: "Mã tài khoản (chỉ đường admin), để mở `/admin/users`." }
        person: { $ref: "#/components/schemas/Person" }
        locked: { type: boolean }
        newAccount: { type: boolean }
        restriction: { $ref: "#/components/schemas/MemberRestriction" }
        counts:
          type: object
          additionalProperties: false
          required: [threads, replies, hidden, openReportsAgainst, warnings, mutes]
          properties:
            threads: { type: integer, minimum: 0 }
            replies: { type: integer, minimum: 0 }
            hidden: { type: integer, minimum: 0 }
            openReportsAgainst: { type: integer, minimum: 0 }
            warnings: { type: integer, minimum: 0 }
            mutes: { type: integer, minimum: 0 }
        recent:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ModerationLogEntry" }

    FilterTerm:
      type: object
      additionalProperties: false
      required: [term, kind, createdAt]
      properties:
        term: { type: string, minLength: 2, maxLength: 60 }
        kind: { type: string, enum: [block, review] }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- 0.3.0 (M13): thời gian thực, tin nhắn

    RealtimeTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt, path, maxAgeSeconds]
      properties:
        ticket:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 byte ngẫu nhiên (base64url, không đệm). Dùng một lần, sống 60 giây. Trình duyệt gửi trong gói CONNECT của Socket.IO, không trong URL.
        expiresAt: { type: string, format: date-time }
        path: { type: string, const: /realtime, description: "`path` của socket.io-client, ở cổng công khai của gateway (web biết địa chỉ cổng qua `GATEWAY_PUBLIC_URL`)." }
        maxAgeSeconds: { type: integer, minimum: 60, maximum: 86400, description: "Kết nối mở bằng vé này bị đóng sau chừng này giây (`session.ended`, `expired`)." }

    ConversationKind:
      type: string
      enum: [direct, group]

    MessageBlock:
      type: [string, "null"]
      enum: [self, you_blocked, messages_closed, account_locked, null]
      description: |
        Vì sao mình chưa nhắn được cho một người (bắt đầu cuộc 1-1, gửi tin trong cuộc 1-1, thêm vào nhóm); null là được. Luật, xét theo thứ tự
        (M13-GATEWAY-MESSAGING.md mục 8.2):
        1. Chính mình: `self`. Tài khoản mình bị khóa: `account_locked`.
        2. Mình đã chặn người đó: `you_blocked`.
        3. Người đó bị khóa, hay đã chặn mình: `messages_closed` (không lộ việc bị chặn; mã người bị khóa thì các đường nhận `handle` trả 404 như M10).
        4. Mình là admin, hay người đó là admin: được.
        5. Mình là học sinh của một lớp (chưa rời, lớp chưa xóa) mà người đó là giáo viên: được.
        6. Theo `messagesFrom` của người đó: `everyone` được; `friends` chỉ khi hai người đang là bạn; `nobody` không. Không được: `messages_closed`.
        Trong nhóm mình đang ở, gửi tin không xét luật này (người bị một thành viên chặn vẫn gửi; người chặn thấy `blockedAuthor`).

    SystemEvent:
      type: object
      additionalProperties: false
      description: |
        Dòng hệ thống của nhóm, lưu bằng **mã** (luật chế độ; tên người đọc mới lúc trả lời nên đổi tên là thấy tên mới). Web dựng chữ như bản thử:
        `group_created` "… đã tạo nhóm “title”"; `group_renamed` "… đã đổi tên nhóm thành “title”"; `members_added` "… đã thêm A, B và C vào nhóm";
        `member_removed` "… đã mời A ra khỏi nhóm"; `member_left` "… đã rời nhóm"; `owner_changed` "A giờ là trưởng nhóm" (`actor` null, `targets[0]`
        là trưởng nhóm mới). Không bao giờ tính là chưa đọc.
      required: [code, actor, targets, title]
      properties:
        code: { type: string, enum: [group_created, group_renamed, members_added, member_removed, member_left, owner_changed] }
        actor: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }] }
        targets:
          type: array
          maxItems: 29
          items: { $ref: "#/components/schemas/Person" }
        title: { type: [string, "null"], minLength: 3, maxLength: 50, description: "Chỉ `group_created`, `group_renamed`: tên nhóm (mới)." }

    MessageImage:
      type: object
      additionalProperties: false
      description: |
        Một ảnh của tin, đã nén lại thành WebP không còn EXIF. `url`, `thumbUrl` là URL `GET` ký sẵn (1 giờ) qua cổng công khai của gateway, chỉ ký
        cho thành viên đọc được tin đó; trang mở lâu thì web đọc lại tin khi ảnh lỗi.
      required: [id, alt, width, height, url, thumbUrl, urlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        alt: { type: [string, "null"], maxLength: 120 }
        width: { type: integer, minimum: 1, maximum: 1600 }
        height: { type: integer, minimum: 1, maximum: 1600 }
        url: { type: string, maxLength: 2000 }
        thumbUrl: { type: string, maxLength: 2000 }
        urlExpiresAt: { type: string, format: date-time }

    Message:
      type: object
      additionalProperties: false
      description: |
        Một tin như người xem thấy. Chữ người dùng viết lưu một lần, giống hệt ở mọi chế độ; máy chủ không bao giờ dịch hay lọc nó.
        - `kind: system`: `author` null, `body` null, `system` có.
        - `blockedAuthor`: người viết là người mình đã chặn; `body` null, `images` rỗng (web ghi "Tin nhắn từ người bạn đã chặn").
        - `purged`: tin quá thời gian giữ; `body` null, `images` rỗng.
        - `clientKey`: chỉ có với tin của chính mình (`Idempotency-Key` lúc gửi).
      required: [id, conversationId, seq, kind, author, mine, body, images, system, blockedAuthor, purged, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        seq: { type: integer, format: int64, minimum: 1, description: "Số thứ tự trong cuộc trò chuyện, tăng đúng 1 mỗi tin (cả dòng hệ thống)." }
        kind: { type: string, enum: [text, system] }
        author: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }] }
        mine: { type: boolean }
        body: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        images:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/MessageImage" }
        system: { oneOf: [{ $ref: "#/components/schemas/SystemEvent" }, { type: "null" }] }
        blockedAuthor: { type: boolean }
        purged: { type: boolean }
        clientKey: { type: string, pattern: "^[A-Za-z0-9_-]{8,100}$" }
        createdAt: { type: string, format: date-time }

    MessagePreview:
      type: object
      additionalProperties: false
      description: Tin mới nhất của một cuộc trò chuyện, cho dòng xem trước ở hộp thư. Cùng luật che như `Message`; `text` là tối đa 120 kí tự đầu.
      required: [seq, kind, author, mine, text, imageCount, system, blockedAuthor, createdAt]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [text, system] }
        author: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }] }
        mine: { type: boolean }
        text: { type: [string, "null"], maxLength: 120 }
        imageCount: { type: integer, minimum: 0, maximum: 6 }
        system: { oneOf: [{ $ref: "#/components/schemas/SystemEvent" }, { type: "null" }] }
        blockedAuthor: { type: boolean }
        createdAt: { type: string, format: date-time }

    ConversationSummary:
      type: object
      additionalProperties: false
      description: Một dòng của hộp thư. `other` là người kia của cuộc 1-1 (null với nhóm); `title` là tên nhóm (null với 1-1).
      required: [id, kind, title, other, memberCount, lastSeq, lastMessage, lastActivityAt, unread]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ConversationKind" }
        title: { type: [string, "null"], minLength: 3, maxLength: 50 }
        other: { oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }] }
        memberCount: { type: integer, minimum: 1, maximum: 30 }
        lastSeq: { type: integer, format: int64, minimum: 0 }
        lastMessage: { oneOf: [{ $ref: "#/components/schemas/MessagePreview" }, { type: "null" }] }
        lastActivityAt: { type: string, format: date-time, description: "Lúc tin cuối (hay lúc tạo, khi chưa có tin)." }
        unread: { type: integer, minimum: 0, maximum: 99, description: Tin chữ chưa đọc của người khác; 99 là từ 99 trở lên. }

    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, unreadMessages]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ConversationSummary" }
        nextCursor: { type: [string, "null"] }
        unreadMessages: { type: integer, minimum: 0, description: Tổng tin chưa đọc của mọi cuộc trò chuyện (không chỉ trang này). }

    ConversationMember:
      type: object
      additionalProperties: false
      required: [person, isOwner, joinedAt]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        isOwner: { type: boolean }
        joinedAt: { type: string, format: date-time }

    ConversationDetail:
      type: object
      additionalProperties: false
      required: [id, kind, title, owner, isOwner, members, memberCount, maxMembers, lastSeq, joinedSeq, lastReadSeq, unread, sendBlock, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ConversationKind" }
        title: { type: [string, "null"], minLength: 3, maxLength: 50 }
        owner: { oneOf: [{ $ref: "#/components/schemas/Handle" }, { type: "null" }], description: Trưởng nhóm (null với 1-1). }
        isOwner: { type: boolean }
        members:
          type: array
          maxItems: 30
          description: Thành viên hiện tại, vào sớm trước. Cuộc 1-1 có đúng hai người.
          items: { $ref: "#/components/schemas/ConversationMember" }
        memberCount: { type: integer, minimum: 1, maximum: 30 }
        maxMembers: { type: integer, minimum: 2, maximum: 30, description: "30 với nhóm, 2 với 1-1." }
        lastSeq: { type: integer, format: int64, minimum: 0 }
        joinedSeq: { type: integer, format: int64, minimum: 0, description: Mình chỉ đọc được tin có `seq` lớn hơn số này (người vào nhóm sau). }
        lastReadSeq: { type: integer, format: int64, minimum: 0 }
        unread: { type: integer, minimum: 0, maximum: 99 }
        sendBlock:
          $ref: "#/components/schemas/MessageBlock"
          description: Vì sao mình chưa gửi được vào cuộc này (chỉ cuộc 1-1; với nhóm là null hay `account_locked`).
        createdAt: { type: string, format: date-time }

    NewConversation:
      type: object
      additionalProperties: false
      description: |
        `kind: direct` cần `handle` (không gửi `title`, `handles`); `kind: group` cần `title` và `handles` (2–29 người khác, không gồm mình). Sai cách
        ghép thì 400 (ghi ở đây thay vì `oneOf`, theo README của contracts).
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ConversationKind" }
        handle: { $ref: "#/components/schemas/Handle" }
        title: { type: string, minLength: 3, maxLength: 50 }
        handles:
          type: array
          minItems: 2
          maxItems: 29
          uniqueItems: true
          items: { $ref: "#/components/schemas/Handle" }

    NewMessage:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Chữ, ảnh hay cả hai; chữ chỉ có khoảng trắng tính là trống (400).
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        mediaIds:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { type: string, format: uuid }

    MessagePage:
      type: object
      additionalProperties: false
      required: [items, lastSeq, joinedSeq, hasMoreBefore, hasMoreAfter]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Message" }
        lastSeq: { type: integer, format: int64, minimum: 0 }
        joinedSeq: { type: integer, format: int64, minimum: 0 }
        hasMoreBefore: { type: boolean }
        hasMoreAfter: { type: boolean }

    ReadState:
      type: object
      additionalProperties: false
      required: [conversationId, lastReadSeq, unread, unreadMessages]
      properties:
        conversationId: { type: string, format: uuid }
        lastReadSeq: { type: integer, format: int64, minimum: 0 }
        unread: { type: integer, minimum: 0, maximum: 99 }
        unreadMessages: { type: integer, minimum: 0 }

    MessageContact:
      type: object
      additionalProperties: false
      required: [person, reasons, messageBlock]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [friend, classmate, class_teacher, class_student, admin, recent, search] }
        messageBlock: { $ref: "#/components/schemas/MessageBlock" }

    ContactList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/MessageContact" }
