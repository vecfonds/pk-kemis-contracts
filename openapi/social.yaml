  /v1/profiles/{handle}/friends:
    get:
      tags: [profiles]
      operationId: getProfileFriends
      x-slice: 10f
      summary: Toàn bộ danh sách bạn của một người, nếu người xem được xem
      description: |
        Cùng luật với phần `friends` của `GET /v1/profiles/{handle}` (tối đa 300, xếp theo tên). Không được xem: 200 với `visible: false` và lý
        do. Người bị khóa, không còn là học sinh, có chặn với người xem (hai chiều) không có trong danh sách.
      parameters:
        - { $ref: "#/components/parameters/Handle" }
      responses:
        "200":
          description: Danh sách hoặc lý do bị ẩn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendsPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me/profile-preview:
    get:
      tags: [profiles]
      operationId: previewMyProfile
      x-slice: 10f
      summary: Trang của mình dưới mắt một người bạn hay một người lạ (học sinh)
      description: |
        Nút "Xem như người khác thấy" (docs/profile/PLAN.md mục 3.2): cùng bộ lọc với `GET /v1/profiles/{handle}`, áp cho một người xem giả
        định là bạn (`as=friend`) hay người lạ (`as=stranger`), nên điều học sinh thấy ở đây đúng là điều máy chủ gửi cho người khác.
      parameters:
        - name: as
          in: query
          required: true
          schema: { type: string, enum: [friend, stranger] }
      responses:
        "200":
          description: Trang đã lọc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileView" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }

  # ------------------------------------------------------------------ 10f: bảng xếp hạng bạn bè, tin vui

  /v1/me/friend-board:
    get:
      tags: [board]
      operationId: getFriendBoard
      x-slice: 10f
      summary: Bảng xếp hạng bạn bè trong một kỳ (học sinh)
      description: |
        Mình và các bạn theo XP trong kỳ, như `friendsBoard` của web: chỉ bạn chia sẻ tiến độ với bạn bè (`progress` là `everyone` hoặc
        `friends`), không bật "Ẩn khỏi bảng xếp hạng", không bị khóa, không có chặn với mình. Mình bật ẩn thì không có dòng của mình
        (`meHidden: true`; vẫn thấy bảng của bạn bè). XP, cấp và XP kỳ trước lấy từ learning (đường nội bộ); kỳ `week` từ 00:00 thứ Hai,
        `month` từ ngày 1 (giờ Việt Nam), `all` mọi thời gian. Hạng = 1 + số người nhiều XP hơn; người 0 XP trong kỳ vẫn có dòng (khác bảng
        chung). `rankChange` so với hạng trong cùng nhóm người này ở kỳ trước (`all`: lúc đầu tuần), null khi kỳ trước không ai có XP.
        learning không trả lời: `unavailable: true`, `entries` rỗng.
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [week, month, all] }
      responses:
        "200":
          description: Bảng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendBoard" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }

  /v1/me/friend-news:
    get:
      tags: [board]
      operationId: getFriendNews
      x-slice: 10f
      summary: Bạn bè gần đây (học sinh)
      description: |
        Chỉ tin vui của 7 ngày gần nhất (docs/profile/PLAN.md mục 6): đạt thành tích (khi bạn đó chia sẻ thành tích với bạn bè), chuỗi 7/30/100
        ngày và hoàn thành chương (khi chia sẻ tiến độ với bạn bè), lên cấp (cấp độ ai cũng thấy). Lọc theo quyền **lúc đọc**, nên bạn đó đổi
        quyền thì tin cũ cũng theo. Không bao giờ có điểm bài, câu sai. Mới nhất trước.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Tin
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: "#/components/schemas/FriendNewsItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotStudent" }

  # ------------------------------------------------------------------ 10g: thông báo

  /v1/me/summary:
    get:
      tags: [notifications]
      operationId: getMySummary
      x-slice: 10g
      summary: Số thông báo chưa đọc và số lời mời đến (mọi vai trò; web hỏi lại mỗi 60 giây)
      description: |
        Đường nhẹ cho chuông và số trên mục Trang cá nhân ở menu: web hỏi lại mỗi 60 giây khi tab đang mở (PHASE2 câu 13; đẩy thời gian thực ở
        M13). `ETag` đổi khi một trong hai số đổi hoặc có thông báo mới; gửi `If-None-Match` đúng thì nhận 304 không có thân.

        0.3.0 (M13): thêm `unreadMessages` (số tin chưa đọc của mọi cuộc trò chuyện, cho số trên mục Tin nhắn); `ETag` đổi cả khi số này đổi.
        Khi kết nối thời gian thực đang mở, social đẩy cùng các số này bằng sự kiện `notification.changed` (asyncapi/realtime.yaml) và web chỉ
        hỏi lại đường này khi mất kết nối (dự phòng) hay sau khi kết nối lại.
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Số liệu
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "304": { description: Không đổi so với `If-None-Match` }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/notifications:
    get:
      tags: [notifications]
      operationId: listMyNotifications
      x-slice: 10g
      summary: Thông báo của mình, mới nhất trước (mọi vai trò)
      description: |
        Mỗi thông báo là `kind` + `params` (mã, số, và tên do người dùng đặt chụp lúc tạo như tên lớp, tên bài), cộng người gây ra (`actor`,
        đọc mới lúc trả lời, nên đổi tên là thấy tên mới). Web dựng câu chữ theo chế độ (`notificationText`) và đường dẫn. Một số loại gộp
        nhiều sự kiện vào một dòng khi dòng đó chưa đọc (`count`, `actors` tối đa 3 người gần nhất): cổ vũ trong ngày, học sinh vào lớp, học
        sinh nộp bài. Thông báo có người gây ra đã bị khóa, hay có chặn giữa hai người (với các loại bạn bè), không hiện. Giữ 90 ngày, mỗi người
        tối đa 500 dòng. Con trỏ theo `(updatedAt, id)`. Hỗ trợ `If-None-Match` ở trang đầu.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Một trang
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
              example:
                unread: 2
                nextCursor: null
                items:
                  - id: 5f1e2d3c-4b5a-4968-8776-655443322110
                    kind: friend_request
                    createdAt: "2026-10-16T12:00:01.000Z"
                    updatedAt: "2026-10-16T12:00:01.000Z"
                    read: false
                    count: 1
                    actor: { handle: p3n8w1v6rz0c, fullName: Đỗ Thanh Tâm, avatarInitials: TT, avatarUrl: null, frameId: null, role: student, level: 5, joinedOn: "2026-09-03" }
                    actors: []
                    params: { requestId: 2b9d6f1e-4c3a-4e8b-9f70-5a1c2d3e4f60 }
                  - id: 6a2f3e4d-5c6b-4a79-9887-766554433221
                    kind: assignment_created
                    createdAt: "2026-10-16T07:30:00.000Z"
                    updatedAt: "2026-10-16T07:30:00.000Z"
                    read: false
                    count: 1
                    actor: { handle: t9h5c2j7m1q8, fullName: Trần Thu Hà, avatarInitials: TH, avatarUrl: null, frameId: null, role: teacher, level: null, joinedOn: "2026-08-01" }
                    actors: []
                    params:
                      classId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      className: 10A1
                      assignmentId: 7d8e9f0a-1b2c-4d3e-8f4a-5b6c7d8e9f0a
                      workId: 3e4f5a6b-7c8d-4e9f-a0b1-c2d3e4f5a6b7
                      workKind: exercise
                      workTitle: Ôn tập số oxi hóa
                      dueAt: "2026-10-20T16:59:59.000Z"
                  - id: 7b3a4f5e-6d7c-4b8a-a998-877665544332
                    kind: level_up
                    createdAt: "2026-10-15T13:02:00.000Z"
                    updatedAt: "2026-10-15T13:02:00.000Z"
                    read: true
                    count: 1
                    actor: null
                    actors: []
                    params: { level: 7 }
        "304": { description: Không đổi so với `If-None-Match` }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      x-slice: 10g
      summary: Đánh dấu đã đọc
      description: |
        `ids` (tối đa 100, mã không phải của mình bị bỏ qua) hoặc `all: true` (mọi thông báo tới lúc gọi). Dòng gộp đã đọc thì sự kiện sau mở
        một dòng mới. Trả số chưa đọc còn lại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
                all: { type: boolean, const: true }
      responses:
        "200":
          description: Đã đánh dấu
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unread]
                properties:
                  unread: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------ 10g, 10i: admin

  /v1/admin/announcements:
    get:
      tags: [admin]
      operationId: listAnnouncements
      x-slice: 10g
      summary: Thông báo chung đã gửi (admin)
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createAnnouncement
      x-slice: 10g
      summary: Gửi thông báo chung (admin)
      description: |
        Một dòng thông báo `announcement` cho mọi tài khoản của nhóm nhận (`students`, `teachers`, `everyone` = học sinh và giáo viên) đang có
        ở social và không bị khóa, ghi trong một câu lệnh cùng giao dịch với thông báo chung và dòng nhật ký. Chữ do admin viết, lưu một lần,
        giống nhau ở mọi chế độ. Tối đa 10 thông báo chung mỗi ngày (409 `daily_limit`). `Idempotency-Key` (tùy chọn): cùng mã trong 24 giờ trả
        lại thông báo đã gửi, không gửi lần hai; cùng mã khác nội dung: 422 `idempotency_mismatch`.
      parameters:
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementRequest" }
      responses:
        "200":
          description: Đã gửi từ trước với cùng `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "201":
          description: Đã gửi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Đã gửi đủ 10 thông báo chung hôm nay (`daily_limit`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Cùng `Idempotency-Key`, nội dung khác (`idempotency_mismatch`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/announcements/{announcementId}:
    delete:
      tags: [admin]
      operationId: retractAnnouncement
      x-slice: 10g
      summary: Thu hồi thông báo chung (admin)
      description: Xóa mọi dòng thông báo của nó ở chuông của mọi người; thông báo chung còn trong danh sách của admin với `retractedAt`. Ghi nhật ký. Lặp được.
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Đã thu hồi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/social:
    get:
      tags: [admin]
      operationId: getUserSocialForAdmin
      x-slice: 10i
      summary: Tình trạng xã hội của một tài khoản (admin)
      description: |
        Cho nút "Xã hội" ở `/admin/users`: mã hồ sơ (để mở trang cá nhân với `adminView`), quyền riêng tư, số bạn, số lời mời chờ, số người đã
        chặn và số người chặn người này, số lời mời đã gửi hôm nay. Chỉ số đếm: không có danh sách ai chặn ai. Chỉ đọc, không ghi nhật ký
        (M10 câu 4). Tài khoản chưa có ở social: 404.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSocial" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: getSocialAuditLog
      x-slice: 10i
      summary: Nhật ký thao tác admin ở social
      description: Gửi và thu hồi thông báo chung. Cùng cách phân trang như nhật ký của classroom, commerce; web gộp thành nguồn "Xã hội" ở `/admin/audit`.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================== 0.2.0 (M12): Cộng đồng
  # ------------------------------------------------------------------ 12a: mình ở Cộng đồng, bảng tin, bài

  /v1/community/me:
    get:
      tags: [community]
      operationId: getMyCommunity
      x-slice: 12a
      summary: Mình ở Cộng đồng (mọi vai trò)
      description: |
        Thẻ của mình, số liệu (cột phải của bảng tin), tài khoản mới hay không (dưới 7 ngày theo `createdAt` của identity: bài và câu hỏi chờ
        duyệt, chưa bỏ phiếu không tán thành được), đang bị khóa đăng bài tới lúc nào, lượt đã dùng hôm nay (ngày giờ Việt Nam). Người chưa
        có ở social thì social hỏi identity rồi tạo, như `GET /v1/me/social`.
      responses:
        "200":
          description: Tóm tắt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCommunity" }
              example:
                me: { handle: k7m2q9x4ta3b, fullName: Nguyễn Minh Anh, avatarInitials: MA, avatarUrl: null, frameId: meo-con-day-leo, role: student, level: 7, joinedOn: "2026-09-01" }
                newAccount: false
                newAccountUntil: null
                canDownvote: true
                restriction: null
                stats: { questions: 1, posts: 0, answers: 0, accepted: 0, upvotesReceived: 0 }
                today:
                  resetsAt: "2026-10-16T17:00:00.000Z"
                  threads: { used: 1, limit: 20 }
                  replies: { used: 3, limit: 100 }
                  uploads: { used: 0, limit: 30 }
                  reports: { used: 0, limit: 20 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/community/threads:
    get:
      tags: [community]
      operationId: listThreads
      x-slice: 12a
      summary: Bảng tin, câu hỏi chưa có lời giải, bài đã lưu, Hỏi đáp của một bài học (mọi vai trò)
      description: |
        Chỉ bài đang hiện, cộng bài chờ duyệt **của chính mình** (kèm `flags`, như bản thử); bài bị ẩn của mình không ở bảng tin (xem ở trang
        bài và `GET /v1/community/me/moderation`). Không có bài của người mình đã chặn, của tài khoản bị khóa (trừ admin xem). Theo `tab`:
        - `new` (mặc định): mới nhất trước; trang đầu có bài ghim (tối đa 3) ở trên cùng.
        - `hot`: "Nổi bật", bài trong 30 ngày xếp theo `hotScore` của web (`(thích + 2 × trả lời + 1) / (giờ tuổi + 2)^1,5`, bản sao có chủ
          đích + script đối chiếu); con trỏ là vị trí, tối đa 200 bài.
        - `unsolved`: câu hỏi chưa có câu trả lời được chọn, cũ nhất trước.
        - `saved`: bài mình đã lưu, lưu gần nhất trước.
        - `top`: câu hỏi có câu trả lời được chọn trước, rồi nhiều lượt thích (khung "Hỏi đáp về bài này" của bài học; dùng với `lessonId`).
        Lọc thêm theo `chapterId`, `lessonId`, `kind`. `total` chỉ có khi lọc theo `lessonId` (số câu hỏi đang hiện của bài). Số đếm
        (`answerCount`, `replyCount`, `likeCount`) là của nội dung đang hiện với mọi người, không trừ riêng người mình chặn.
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [new, hot, unsolved, saved, top], default: new }
        - name: chapterId
          in: query
          schema: { $ref: "#/components/schemas/ContentId" }
        - name: lessonId
          in: query
          schema: { $ref: "#/components/schemas/ContentId" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ThreadKind" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
