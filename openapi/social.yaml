      description: |
        `parentId` trống: câu trả lời (câu hỏi) hay bình luận (bài viết). `parentId` là một câu trả lời đang hiện của cùng câu hỏi: bình luận
        dưới nó (một cấp; bình luận dưới bình luận, hay dưới bình luận của bài viết: 400). Luật như `createThread` (khóa, khóa đăng bài, lượt
        trong ngày 20 / 100, nội dung lặp, bộ lọc, đề đang mở) với hai khác biệt: tài khoản dưới 7 ngày **không** phải chờ duyệt (chỉ qua bộ
        lọc), và không có ảnh. Bài phải đang hiện (409 `thread_not_visible`). Chủ bài đặt "Ai trả lời bài của tôi: Không ai" (`repliesFrom:
        nobody`, social.yaml 0.1.0) thì chỉ admin trả lời được; **người bị chủ bài chặn nhận cùng lỗi 403 `replies_closed`**, để không biết
        mình bị chặn. Hiện ngay thì thông báo `community_answer` / `community_comment` cho người liên quan.

        **Bình luận dưới câu trả lời của người đã chặn mình** (chủ câu trả lời khác chủ bài; 0.2.1, M12-COMMUNITY.md mục 4.3): **không** có
        `replies_closed` vì lý do này. Máy chủ nhận như thường (201; `outcome` như khi không bị chặn: hiện ngay, hay chờ duyệt nếu bộ lọc gắn
        cờ; lượt trong ngày bị trừ), nhưng bình luận **chỉ hiện với người viết và admin**: không tính vào `replyCount`, không thông báo cho ai,
        không vào hàng chờ duyệt, admin không duyệt cho hiện được. Với người viết, `getThread` trả bình luận đó như khi không bị chặn (cùng
        `status`). Bình luận đã hiện từ trước khi chặn thì giữ nguyên với người khác; người chặn không thấy (lọc lúc đọc, như mọi nội dung của
        người mình chặn).
      parameters:
        - { $ref: "#/components/parameters/ThreadId" }
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewReply" }
      responses:
        "200":
          description: Đã gửi từ trước với cùng `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplyOutcome" }
        "201":
          description: Đã gửi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplyOutcome" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`account_locked`, `muted` (kèm `until`), `replies_closed`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`daily_limit` (`limitKind: replies`), `duplicate_content`, `thread_not_visible`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`content_blocked` (kèm `flags`), `idempotency_mismatch`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/community/replies/{replyId}:
    delete:
      tags: [community]
      operationId: deleteMyReply
      x-slice: 12a
      summary: Tác giả xóa câu trả lời hay bình luận của mình
      description: |
        Xóa câu trả lời thì bình luận dưới nó cũng không còn hiện; câu trả lời đang được chọn thì câu hỏi trở lại "chưa có lời giải" (XP đã
        cộng giữ nguyên). Lặp được. Tài khoản bị khóa: 403 `account_locked` (0.2.1; kiểm trước mọi thứ khác).
      parameters:
        - { $ref: "#/components/parameters/ReplyId" }
      responses:
        "204": { description: Đã xóa }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Không phải tác giả (`not_author`); tài khoản bị khóa (`account_locked`, 0.2.1)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/community/replies/{replyId}/vote:
    put:
      tags: [community]
      operationId: voteReply
      x-slice: 12a
      summary: Tán thành (+1) hay không tán thành (−1) một câu trả lời, bình luận; đổi được
      description: |
        Mỗi người một phiếu cho mỗi câu (khóa chính), đổi được. Không bỏ phiếu cho mình (409 `self_vote`); nội dung phải đang hiện; tài khoản
        dưới 7 ngày không bỏ phiếu không tán thành được (403 `downvote_not_allowed`). Khóa đăng bài **không** chặn bỏ phiếu. Phiếu của người
        mà tác giả đã chặn được ghi nhận nhưng không tính vào số, không XP, không ai được báo. Phiếu không tán thành không trừ XP. Lần đầu một
        người tán thành một câu: social quyết XP (+2, mục 8) và phát `community.reply_upvoted` (lát `12e`).
      parameters:
        - { $ref: "#/components/parameters/ReplyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: integer, enum: [1, -1] }
      responses:
        "200":
          description: Phiếu sau thao tác
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteState" }
              example: { replyId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a, upvotes: 5, downvotes: 0, myVote: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`downvote_not_allowed`, `account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`self_vote`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [community]
      operationId: retractVote
      x-slice: 12a
      summary: Rút phiếu (lặp được; XP đã cộng giữ nguyên, tán thành lại không cộng thêm)
      parameters:
        - { $ref: "#/components/parameters/ReplyId" }
      responses:
        "200":
          description: Phiếu sau thao tác
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/community/similar:
    get:
      tags: [community]
      operationId: listSimilarQuestions
      x-slice: 12a
      summary: Câu hỏi tương tự đã có (trước khi đăng câu hỏi)
      description: |
        So không dấu bằng PostgreSQL `unaccent` + trigram trên tiêu đề và thân của câu hỏi đang hiện (PLAN.md mục 6.2), câu có lời giải được
        chọn trước. Tối đa 3 (mặc định) hay 5. Từ 10 kí tự; 30 lần mỗi phút (429).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 10, maxLength: 300 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5, default: 3 }
      responses:
        "200":
          description: Câu hỏi tương tự
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 5
                    items: { $ref: "#/components/schemas/ThreadSummary" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/profiles/{handle}/community:
    get:
      tags: [community, profiles]
      operationId: getProfileCommunity
      x-slice: 12a
      summary: Phần Cộng đồng trên trang cá nhân của một người (mọi vai trò, mọi chủ trang)
      description: |
        Số liệu (đếm trên nội dung đang hiện), bài đã đăng và câu trả lời gần nhất (mỗi loại tối đa 20, con trỏ riêng ở `threadsCursor`,
        `answersCursor`). Bài đã đăng là công khai trong app (docs/community/PLAN.md mục 3.3), nên phần này **không** theo quyền riêng tư của
        trang cá nhân; người xem đã chặn chủ trang: `hidden` lý do `blocked`, không có danh sách. Mã không có, người bị khóa (trừ admin xem):
        404, giống `GET /v1/profiles/{handle}`. Có cả chủ trang là giáo viên, admin (trang giáo viên chỉ có phần này, M10 mục 4.2).
      parameters:
        - { $ref: "#/components/parameters/Handle" }
        - name: part
          in: query
          description: Chỉ lấy tiếp một danh sách (cùng với `cursor`); trống là cả hai, trang đầu.
          schema: { type: string, enum: [threads, answers] }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Phần Cộng đồng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileCommunity" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ 12c: báo cáo, kháng nghị (người dùng)

  /v1/community/reports:
    post:
      tags: [community]
      operationId: reportContent
      x-slice: 12c
      summary: Báo cáo một bài, câu trả lời hay bình luận
      description: |
        Đúng một trong `threadId`, `replyId`; nội dung đang hiện, không phải của mình. Mỗi người một báo cáo đang mở cho mỗi nội dung (gửi lại:
        200 với báo cáo đó). Người bị báo cáo không biết ai báo cáo. 20 báo cáo mỗi ngày (409 `daily_limit`, `limitKind: reports`). Khi một nội
        dung có báo cáo đang mở từ **3 người khác nhau có tài khoản từ 7 ngày**, nó tạm ẩn ngay (`hidden_by: reports`, nhật ký ghi là hệ
        thống), tác giả nhận `community_hidden` với `byReports: true`; nội dung của admin không bao giờ tự ẩn. Người báo cáo không được biết nội
        dung đã ẩn hay chưa. "Bắt nạt", "Nội dung người lớn" lên đầu hàng chờ.

        0.2.1: admin không báo cáo (xử lý thẳng ở kiểm duyệt): 403 `forbidden`, trước mọi kiểm khác. Tài khoản bị khóa: 403 `account_locked`;
        khóa đăng bài **không** chặn báo cáo. Người từng có báo cáo về **cùng** nội dung bị admin bỏ qua (`dismissed`) vẫn báo cáo lại được
        (vào hàng chờ) nhưng báo cáo mới không đếm cho tự ẩn, để cùng ba người không ẩn lại được sau mỗi lần admin bỏ qua.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewReport" }
            example: { replyId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a, reason: wrong_chemistry, note: Nói ngược khái niệm chất khử và chất oxi hóa. }
      responses:
        "200":
          description: Mình đã báo cáo nội dung này (báo cáo cũ còn mở)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "0.2.1: người gọi là admin (`forbidden`); tài khoản bị khóa (`account_locked`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`daily_limit` (`limitKind: reports`), `self` (nội dung của mình)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/community/me/moderation:
    get:
      tags: [community]
      operationId: listMyModeration
      x-slice: 12c
      summary: Các lần mình hay nội dung của mình bị xử lý, và kháng nghị (mọi vai trò)
      description: |
        Trang "Nội dung bị xử lý" (`/community/moderation` ở web): ẩn, xóa (bởi admin), tự ẩn do báo cáo, ảnh bị từ chối, nhắc nhở, khóa đăng
        bài; mới nhất trước, 180 ngày. Kèm lý do (mã và lời admin viết cho mình), có kháng nghị được không, kháng nghị đã gửi. Không bao giờ có
        người báo cáo, số báo cáo, hay admin nào xử lý.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyModerationPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/community/appeals:
    post:
      tags: [community]
      operationId: createAppeal
      x-slice: 12c
      summary: Kháng nghị một lần xử lý (một lần duy nhất)
      description: |
        Kháng nghị được: ẩn và xóa của admin, nhắc nhở, khóa đăng bài, ảnh bị từ chối; trong 30 ngày kể từ lần xử lý (409 `not_appealable`).
        Tự ẩn do báo cáo chưa phải quyết định cuối (chờ admin), nên chưa kháng nghị được. Khóa tài khoản không kháng nghị trong app (người bị
        khóa không đăng nhập được). Mỗi lần xử lý một kháng nghị (409 `appeal_exists`). Vào hàng chờ "Kháng nghị" của admin.

        0.2.1: tài khoản bị khóa: 403 `account_locked` (token còn hạn sau khi identity khóa). **Quy ước `Idempotency-Key` của thao tác này:**
        gửi lại cùng mã trong 24 giờ với cùng `actionId` và `message` trả **201** kèm đúng thân của lần đầu (không phải trạng thái hiện tại của
        kháng nghị; đọc trạng thái mới ở `GET /v1/community/me/moderation`), không tạo kháng nghị thứ hai và không trả 409 `appeal_exists`;
        cùng mã khác nội dung: 422 `idempotency_mismatch`. Khác `createThread`, `createReply`, `sanctionMember` (lần gửi lại là 200): bên gọi
        không phân biệt lần đầu với lần gửi lại ở đây, nên coi 201 là "đã có kháng nghị này". Gửi lại không kèm mã (hay mã khác) khi đã có
        kháng nghị: 409 `appeal_exists`.
      parameters:
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actionId, message]
              properties:
                actionId: { type: string, format: uuid }
                message: { type: string, minLength: 10, maxLength: 500 }
      responses:
        "201":
          description: Đã gửi; cũng là phản hồi của lần gửi lại cùng `Idempotency-Key` (đúng thân lần đầu, 0.2.1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppealState" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "0.2.1: tài khoản bị khóa (`account_locked`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_appealable`, `appeal_exists`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`idempotency_mismatch`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ------------------------------------------------------------------ 12d: ảnh

  /v1/community/media:
    post:
      tags: [media]
      operationId: requestUpload
      x-slice: 12d
      summary: Xin chỗ tải một ảnh lên (URL ký sẵn, 5 phút)
      description: |
        JPG, PNG, WebP; 1 byte – 5 MB (docs/community/PLAN.md mục 3.4). Trả URL `PUT` ký sẵn tới khu nhận của kho ảnh (MinIO ở máy này, S3 khi
        lên AWS), đã ký kèm `Content-Type` và `Content-Length` đúng như khai: trình duyệt gửi thẳng tệp lên kho (không qua web, không qua
        social), phải gửi đúng header trong `headers` và đúng số byte đã khai. Khóa tệp là mã ảnh, không có mã tài khoản. Tài khoản bị khóa,
        đang bị khóa đăng bài: 403. Lượt trong ngày: 5 (tài khoản dưới 7 ngày) hay 30 ảnh (409 `daily_limit`, `limitKind: uploads`); 10 lần mỗi
        phút (429). Ảnh không gắn vào bài nào trong 24 giờ bị xóa.

        0.2.1: social chưa được cấu hình kho ảnh (thiếu `S3_ENDPOINT` hay khóa): 503 `media_busy` kèm `Retry-After` (sau khi kiểm thân yêu cầu,
        trước khi kiểm khóa và lượt; không ăn lượt). Web hiện như "máy chủ bận, thử lại sau".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, bytes]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                bytes: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "201":
          description: Chỗ tải lên
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
              example:
                mediaId: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                method: PUT
                url: "http://localhost:9000/pk-community-incoming/u/6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Signature=…"
                headers: { Content-Type: image/jpeg }
                expiresAt: "2026-10-16T12:15:00.000Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`account_locked`, `muted`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`daily_limit` (`limitKind: uploads`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "0.2.1: kho ảnh chưa sẵn sàng (`media_busy`)"
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/community/media/{mediaId}/complete:
    post:
      tags: [media]
      operationId: completeUpload
      x-slice: 12d
      summary: Báo đã tải xong; social kiểm, nén lại, xóa siêu dữ liệu
      description: |
        social đọc tệp ở khu nhận và (mục 7.3 của M12-COMMUNITY.md): kiểm số byte đúng như khai; kiểm **loại thật** theo byte đầu tệp (phải
        đúng loại đã khai; SVG, GIF, HEIC, tệp khác bị từ chối); giải mã đủ bằng `sharp` (hỏng: `image_invalid`); mỗi cạnh tối đa 8000 px và
        tối đa 25 triệu điểm ảnh (quá: `image_too_large`); **cạnh dưới 32 px: `image_invalid`** (0.2.1; trước đây mô tả gộp "32–8000 px" vào
        `image_too_large`); ảnh động bị từ chối; xoay theo EXIF rồi **ghi lại thành WebP không còn EXIF, XMP, ICC** (cạnh dài
        tối đa 1600 px và bản nhỏ 480 px); so mã băm với danh sách ảnh admin đã chặn (`image_blocked`). Tệp gốc bị xóa ngay. Ảnh qua kiểm
        vẫn **chờ admin duyệt** sau khi gắn vào bài (trừ ảnh của admin). Hết hạn tải lên: 409 `upload_expired`; chưa có tệp: 409
        `upload_incomplete`; quá nhiều ảnh đang xử lý: 503 `media_busy` kèm `Retry-After`. Lặp được: ảnh đã xong trả lại kết quả.

        0.2.1:
        - Thứ tự: ảnh đã xong thì trả lại kết quả trước mọi kiểm (kể cả khi tài khoản đã bị khóa sau đó); rồi tài khoản bị khóa: 403
          `account_locked`; đang bị khóa đăng bài: 403 `muted` (kèm `until`); rồi chú thích; rồi hạn tải lên; rồi kho ảnh chưa sẵn sàng hay
          đang bận: 503 `media_busy`.
        - **Chú thích** (`alt`) là chữ người khác đọc, nên qua cùng bộ lọc từ ngữ như bài (admin không qua): có bất kì cờ nào (từ bị chặn, từ
          cần xem lại, số điện thoại, email, liên kết) là 422 `content_blocked` kèm `flags`; chỗ tải lên vẫn còn, người đăng sửa chú thích rồi
          gửi lại.
        - Mọi lỗi 422 về **tệp** (`image_invalid`, `image_too_large`, `image_blocked`) bỏ luôn chỗ tải lên (tệp nhận bị xóa, lượt ảnh trong ngày
          không trả lại): gọi lại `complete` cho cùng `mediaId` nhận 409 `upload_expired`; muốn thử ảnh khác thì xin chỗ mới.
        - PNG 16 bit mỗi kênh giải mã tốn gấp đôi bộ nhớ, nên trần riêng là 8 triệu điểm ảnh (quá: `image_too_large`), ngoài trần chung 25
          triệu.
        - Mỗi lần social chỉ giải mã số ảnh theo `MEDIA_MAX_CONCURRENT` (mặc định trong mã 1, Compose đặt 2); quá thì 503 `media_busy`.
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                alt: { type: [string, "null"], maxLength: 120, description: Chú thích (văn bản thay thế) do người đăng gõ; trống là không có. Không lấy tên tệp. }
      responses:
        "200":
          description: Ảnh đã sẵn sàng gắn vào bài
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaInfo" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "0.2.1: tài khoản bị khóa (`account_locked`); đang bị khóa đăng bài (`muted`, kèm `until`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`upload_expired`, `upload_incomplete`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`image_invalid` (kể cả cạnh dưới 32 px), `image_too_large`, `image_blocked`; 0.2.1: chú thích bị bộ lọc giữ (`content_blocked`, kèm `flags`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: "`media_busy`"
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

