  /v1/community/replies/{replyId}/vote:
    put:
      tags: [community]
      operationId: voteReply
      x-slice: 12a
      summary: Tán thành (+1) hay không tán thành (−1) một câu trả lời, bình luận; đổi được
      description: |
        Mỗi người một phiếu cho mỗi câu (khóa chính), đổi được. Không bỏ phiếu cho mình (409 `self_vote`); nội dung phải đang hiện; tài khoản
        dưới 7 ngày không bỏ phiếu không tán thành được (403 `downvote_not_allowed`). Khóa đăng bài **không** chặn bỏ phiếu. Phiếu của người
        mà tác giả đã chặn được ghi nhận nhưng không tính vào số, không XP, không ai được báo. Phiếu không tán thành không trừ XP. Lần đầu một
        người tán thành một câu: social quyết XP (+2, mục 8) và phát `community.reply_upvoted` (lát `12e`).
      parameters:
        - { $ref: "#/components/parameters/ReplyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: integer, enum: [1, -1] }
      responses:
        "200":
          description: Phiếu sau thao tác
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteState" }
              example: { replyId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a, upvotes: 5, downvotes: 0, myVote: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`downvote_not_allowed`, `account_locked`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`self_vote`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
