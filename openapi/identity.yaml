openapi: 3.1.0
info:
  title: PkKemis identity
  version: 0.6.0
  summary: Tài khoản, đăng nhập, token và vai trò.
  description: |
    Đã được chủ dự án duyệt ngày 13/10/2026 (docs/backend/M1-IDENTITY.md).

    0.5.0 (docs/backend/M6-CONTENT.md, lát L7): quyền riêng tư "ẩn khỏi bảng xếp hạng" (`/v1/me/privacy`), learning đọc qua
    `/internal/users/batch`. Các thao tác mới ghi lát cài nó ở `x-slice`.

    0.6.0 (docs/backend/M7-DEBT-EMAIL.md, chỉ thêm): xác minh email (`/v1/auth/email/verify`, `/v1/auth/email/resend`, lát 7d); mã lỗi
    riêng `last_admin` khi hạ hoặc khóa quản trị viên cuối cùng (trước là `forbidden`, cùng status 403; lát 7c).
    Thư (đặt lại mật khẩu, xác minh) đi qua bộ gửi đang bật: Resend khi có `RESEND_API_KEY`, SMTP khi có `MAIL_SMTP_HOST` (Mailpit khi chạy
    trên máy, thư không ra ngoài), không có thì không gửi và log không chứa liên kết. Chưa có thao tác nào ở đây cho biết thư đã đi hay chưa.

    - Chỉ thêm, không xóa hay đổi nghĩa của trường đã phát hành.
    - Từ 0.3.0 các thao tác admin (`/v1/admin/*`) đã được cài (lát D của M4); `x-phase: 2` còn lại, nếu có, là thao tác chưa cài.
    - Thông báo lỗi (`detail`) bằng tiếng Việt, hiển thị được cho người dùng; mã `code` ổn định, dùng để xử lý trong mã.
servers:
  - url: http://identity:8080
    description: Mạng Docker Compose (giai đoạn 1, chưa có gateway)
# Mặc định cần access token; API công khai ghi `security: []` ở từng thao tác.
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Đăng ký, đăng nhập, làm mới và thu hồi phiên
  - name: me
    description: Người dùng đang đăng nhập
  - name: admin
    description: Quản trị người dùng (admin)
  - name: internal
    description: Chỉ service gọi nhau; không mở ra ngoài

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Đăng ký tài khoản học sinh hoặc giáo viên
      description: |
        Giáo viên không cần duyệt. Đăng ký xong là đăng nhập luôn.
        Từ 0.6.0 (7d): identity gửi thư xác minh email (liên kết dùng một lần, sống 24 giờ). Gửi thư hỏng không làm hỏng đăng ký; người dùng
        xin lại bằng `/v1/auth/email/resend`. Xác minh không bắt buộc: `emailVerified` false vẫn đăng nhập và dùng mọi thứ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Đã tạo tài khoản và cấp phiên
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409":
          description: Email đã được dùng (`code` = `email_taken`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập bằng email và mật khẩu
      description: |
        Sai email hay sai mật khẩu đều trả cùng một lỗi `invalid_credentials`, để không lộ email nào đã đăng ký.
        Đăng nhập sai nhiều lần theo email hoặc IP bị chặn tạm (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Phiên mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: Sai email hoặc mật khẩu (`invalid_credentials`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Tài khoản bị khóa (`account_locked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Đổi refresh token lấy cặp token mới
      description: |
        Refresh token dùng một lần: mỗi lần đổi cấp token mới và thu hồi token cũ, cùng một họ (`family`).
        Nếu token đã dùng rồi bị đem ra dùng lại (nghi bị đánh cắp), cả họ bị thu hồi và trả `token_reuse_detected`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Cặp token mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Token không hợp lệ, hết hạn, đã thu hồi hoặc bị dùng lại (`token_invalid` / `token_reuse_detected`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Tài khoản bị khóa (`account_locked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất thiết bị này
      description: Thu hồi refresh token được gửi lên. Luôn trả 204, kể cả khi token đã hết hạn, để đăng xuất không bao giờ kẹt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Đã đăng xuất }

  /v1/auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Đăng xuất mọi thiết bị
      description: Thu hồi mọi refresh token của người dùng. Access token đang còn hạn hết hiệu lực khi hết hạn (tối đa 15 phút).
      responses:
        "204": { description: Đã đăng xuất mọi thiết bị }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Xin liên kết đặt lại mật khẩu
      description: |
        Luôn trả 202 dù email có tài khoản hay không, để không lộ email nào đã đăng ký.
        Nếu có tài khoản, gửi email chứa liên kết dùng một lần, sống 1 giờ. Xin lại thì liên kết cũ hết hiệu lực.
        Giới hạn số lần xin theo email và IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { description: Đã nhận yêu cầu }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng mã trong email
      description: Đặt xong, mọi phiên (refresh token) của người dùng bị thu hồi; phải đăng nhập lại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Đã đặt lại mật khẩu }
        "400":
          description: Dữ liệu không hợp lệ (`validation_failed`), hoặc mã sai, hết hạn, đã dùng (`reset_token_invalid`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      x-slice: 7d
      summary: Xác minh email bằng mã trong thư
      description: |
        Mở từ liên kết trong thư, có khi ở trình duyệt chưa đăng nhập, nên không cần token. Mã đúng, chưa dùng, chưa hết hạn (24 giờ) và email
        của tài khoản vẫn là email lúc gửi thư thì `emailVerified` thành true; mọi mã khác chưa dùng của người đó hết hiệu lực.
        Bấm lại một liên kết đã dùng khi email đã được xác minh vẫn trả 204 (bấm hai lần không báo lỗi). Không cấp hay đổi phiên nào.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: Email đã được xác minh (lần này hoặc từ trước) }
        "400":
          description: Dữ liệu không hợp lệ (`validation_failed`), hoặc mã sai, hết hạn, đã dùng mà email chưa xác minh (`verification_token_invalid`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      x-slice: 7d
      summary: Gửi lại thư xác minh email
      description: |
        Người đang đăng nhập xin thư mới tới email của tài khoản mình; liên kết cũ chưa dùng vẫn dùng được tới khi hết hạn. Tối đa 3 thư mỗi giờ
        cho mỗi tài khoản (tính cả thư lúc đăng ký): quá thì 429 kèm `Retry-After`. Email đã xác minh: 409 `email_already_verified`.
        202 nghĩa là đã nhận yêu cầu; gửi thư hỏng thì identity ghi log, người dùng xin lại sau.
      responses:
        "202": { description: Đã nhận yêu cầu }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Email đã được xác minh (`email_already_verified`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Hồ sơ của mình
      responses:
        "200":
          description: Hồ sơ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Sửa họ tên, ngày sinh, ảnh đại diện
      description: Chỉ các trường gửi lên mới đổi. Gửi `null` cho `avatarUrl` để xóa ảnh đại diện. Không đổi được email và vai trò ở đây.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Hồ sơ sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/password:
    patch:
      tags: [me]
      operationId: changePassword
      summary: Đổi mật khẩu
      description: Đổi xong, mọi phiên khác (refresh token khác) bị thu hồi; phiên hiện tại được giữ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Đã đổi }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: Chưa đăng nhập, hoặc sai mật khẩu hiện tại (`invalid_credentials`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me/privacy:
    get:
      tags: [me]
      operationId: getMyPrivacy
      x-slice: L7
      summary: Cài đặt quyền riêng tư của mình
      description: Giai đoạn 1 chỉ có "ẩn khỏi bảng xếp hạng"; các quyền khác (ai xem tiến độ, ai nhắn tin…) thêm khi có `social`.
      responses:
        "200":
          description: Cài đặt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMyPrivacy
      x-slice: L7
      summary: Sửa cài đặt quyền riêng tư
      description: |
        Chỉ các trường gửi lên mới đổi. Bảng xếp hạng của learning thấy thay đổi sau tối đa 10 phút (learning đệm tên và cờ này).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                hideFromLeaderboard: { type: boolean }
      responses:
        "200":
          description: Cài đặt sau khi sửa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Danh sách người dùng
      parameters:
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: q
          in: query
          description: Tìm theo email hoặc họ tên (không phân biệt hoa thường và dấu)
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Một trang người dùng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{userId}/role:
    patch:
      tags: [admin]
      operationId: changeRole
      summary: Đổi vai trò
      description: |
        Admin không tự đổi vai trò của mình (`self_action_forbidden`). Không hạ được quản trị viên cuối cùng (403, từ 0.6.0 mã `last_admin`;
        trước đó là `forbidden`). Mọi thao tác ghi vào nhật ký kiểm toán.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200":
          description: Người dùng sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/lock:
    post:
      tags: [admin]
      operationId: lockUser
      summary: Khóa tài khoản
      description: |
        Thu hồi mọi refresh token. Admin không tự khóa mình (`self_action_forbidden`). Không khóa được quản trị viên cuối cùng (403, từ 0.6.0 mã
        `last_admin`; trước đó là `forbidden`).
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Đã khóa }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/unlock:
    post:
      tags: [admin]
      operationId: unlockUser
      summary: Mở khóa tài khoản
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Đã mở khóa }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: listAuditLog
      summary: Nhật ký kiểm toán (admin)
      description: Các thao tác của admin (đổi vai trò, khóa, mở khóa), mới nhất trước. Chỉ đọc.
      parameters:
        - name: action
          in: query
          schema: { type: string, enum: [ROLE_CHANGED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED] }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Một trang nhật ký
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /.well-known/jwks.json:
    get:
      tags: [internal]
      operationId: getJwks
      summary: Khóa công khai để kiểm access token
      description: Các service tự kiểm JWT bằng khóa này, không gọi identity cho mỗi yêu cầu. Cho phép lưu đệm vài phút.
      security: []
      responses:
        "200":
          description: Tập khóa công khai (JWKS, RFC 7517)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jwks" }

  /internal/users/batch:
    post:
      tags: [internal]
      operationId: getUsersBatch
      summary: Tên và vai trò của nhiều người cùng lúc
      description: Chỉ service gọi nhau. Mã không tồn tại thì bị bỏ qua trong kết quả, không báo lỗi.
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsersBatchRequest" }
      responses:
        "200":
          description: Thông tin tóm tắt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersBatchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token RS256, sống tối đa 15 phút. Claim: `sub` (mã người dùng), `role`, `sid` (mã phiên đăng nhập, để giữ phiên hiện tại khi đổi mật khẩu), `iss` = `pk-kemis-identity`, `iat`, `exp`, `jti`.
        Không chứa email hay họ tên.
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Khóa dùng chung giữa các service (lấy từ AWS Secrets Manager). Thay bằng token giữa service khi có gateway.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: Dữ liệu gửi lên không hợp lệ (`validation_failed`), kèm danh sách lỗi từng trường
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Chưa đăng nhập hoặc access token không hợp lệ / hết hạn (`token_invalid`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Không đủ quyền (`forbidden`, `self_action_forbidden`, hoặc từ 0.6.0 `last_admin` khi hạ hay khóa quản trị viên cuối cùng)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Không tìm thấy (`not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Thử quá nhiều lần (`too_many_attempts`); chờ theo `Retry-After`
      headers:
        Retry-After:
          description: Số giây phải chờ
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Role:
      type: string
      enum: [student, teacher, admin]

    User:
      type: object
      required: [id, email, fullName, role, dateOfBirth, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        avatarUrl: { type: [string, "null"], format: uri }
        dateOfBirth: { type: string, format: date }
        emailVerified:
          type: boolean
          description: |
            Giai đoạn 1 luôn `false` vì chưa gửi email xác minh. Từ 0.6.0 (7d): true sau khi người dùng bấm liên kết trong thư xác minh
            (`/v1/auth/email/verify`). Không bắt buộc: đăng nhập và mọi thao tác không đòi trường này, web chỉ nhắc.
        createdAt: { type: string, format: date-time }

    AdminUser:
      description: Người dùng như admin thấy; thêm `locked` so với `User`.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [locked]
          properties:
            locked: { type: boolean }

    AuditLogEntry:
      type: object
      required: [id, actorId, targetId, action, reason, createdAt]
      properties:
        id: { type: string, description: Số thứ tự của dòng nhật ký (chuỗi số). }
        actorId: { type: string, format: uuid }
        actorName: { type: [string, "null"], description: Họ tên hiện tại của người làm; null nếu tài khoản đã bị xóa. }
        targetId: { type: string, format: uuid }
        targetName: { type: [string, "null"] }
        action: { type: string, enum: [ROLE_CHANGED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED] }
        detail:
          type: [object, "null"]
          description: Với ROLE_CHANGED có `from` và `to`.
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    AuditLogPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }

    UserSummary:
      type: object
      required: [id, fullName, role, locked]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        avatarUrl: { type: [string, "null"], format: uri }
        locked: { type: boolean }
        hideFromLeaderboard:
          type: boolean
          description: "0.5.0 (L7): người dùng đã bật ẩn khỏi bảng xếp hạng. Vắng như false."

    PrivacySettings:
      type: object
      required: [hideFromLeaderboard]
      properties:
        hideFromLeaderboard: { type: boolean, description: Mặc định false (có tên trên bảng xếp hạng). }

    RegisterRequest:
      type: object
      required: [email, password, fullName, dateOfBirth, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: "#/components/schemas/NewPassword" }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        dateOfBirth:
          type: string
          format: date
          description: |
            Bắt buộc (chủ dự án chốt 13/10/2026), dùng để biết người dùng dưới 16 tuổi hay không theo Nghị định 13/2023/NĐ-CP.
            Không được ở tương lai. Quy trình cha mẹ đồng ý cho người dưới 16 tuổi chưa chốt, nên chưa có trường nào cho nó.
        role:
          type: string
          enum: [student, teacher]
          description: Admin không tự đăng ký được.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 128 }
        rememberMe:
          type: boolean
          default: false
          description: Bật thì refresh token sống 30 ngày, tắt thì 24 giờ.
        deviceName:
          type: string
          maxLength: 80
          description: Tên thiết bị để người dùng nhận ra phiên (tùy chọn).

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthResponse:
      type: object
      required: [accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresIn, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn:
          type: integer
          description: Số giây còn hiệu lực.
        refreshToken: { type: string }
        refreshTokenExpiresIn:
          type: integer
          description: Số giây còn hiệu lực.
        user: { $ref: "#/components/schemas/User" }

    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 80 }
        dateOfBirth: { type: string, format: date, description: Không được ở tương lai; không xóa được vì bắt buộc. }
        avatarUrl: { type: [string, "null"], format: uri, maxLength: 500 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
          description: Mã trong liên kết của thư xác minh.

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: Mã trong liên kết của email.
        newPassword: { $ref: "#/components/schemas/NewPassword" }

    NewPassword:
      type: string
      minLength: 8
      maxLength: 72
      description: |
        Ít nhất 8 kí tự. Mật khẩu băm bằng bcrypt, chỉ đọc 72 byte đầu; để không cắt ngầm, tối đa 72 byte UTF-8
        (chữ có dấu chiếm 2–3 byte). Quá giới hạn thì trả `validation_failed`, không cắt.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { $ref: "#/components/schemas/NewPassword" }

    ChangeRoleRequest:
      type: object
      required: [role, reason]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    UserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }

    UsersBatchRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }

    UsersBatchResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/UserSummary" }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, n, e]
            properties:
              kty: { type: string, const: RSA }
              kid: { type: string }
              use: { type: string, const: sig }
              alg: { type: string, const: RS256 }
              n: { type: string }
              e: { type: string }

    Problem:
      type: object
      description: Lỗi theo RFC 9457 (`application/problem+json`).
      required: [title, status, code]
      properties:
        type:
          type: string
          description: Địa chỉ định danh loại lỗi; vắng mặt hoặc `about:blank` nghĩa là không có loại riêng (RFC 9457).
          default: about:blank
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Mã ổn định để xử lý trong mã.
          enum:
            - validation_failed
            - email_taken
            - invalid_credentials
            - account_locked
            - token_invalid
            - token_reuse_detected
            - reset_token_invalid
            - too_many_attempts
            - forbidden
            - self_action_forbidden
            - not_found
            - internal_error
            - verification_token_invalid
            - email_already_verified
            - last_admin
        detail:
          type: string
          description: Thông báo tiếng Việt, hiển thị được cho người dùng.
        errors:
          type: array
          description: Lỗi từng trường (chỉ với `validation_failed`).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
