    ConversationRemoved:
      name: conversation.removed
      title: Mình không còn ở một cuộc trò chuyện
      summary: Mình rời nhóm (ở tab khác) hay bị trưởng nhóm mời ra. Web bỏ dòng hộp thư; đang mở cuộc đó thì hiện "Không tìm thấy cuộc trò chuyện".
      payload: { $ref: "#/components/schemas/ConversationRemovedPayload" }
      x-slice: 13e
      examples:
        - name: biMoiRa
          payload: { conversationId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e, reason: removed, unreadMessages: 1 }

    ConversationRead:
      name: conversation.read
      title: Mình đã đọc một cuộc trò chuyện (ở tab khác)
      summary: Sau `POST /v1/conversations/{id}/read` đổi thật. Chỉ tới các kết nối của chính mình; người khác không biết (không có "Đã xem").
      payload: { $ref: "#/components/schemas/ConversationReadPayload" }
      x-slice: 13e
      examples:
        - name: daDoc
          payload: { conversationId: 0f1e2d3c-4b5a-4697-8a8b-9c0d1e2f3a4b, lastReadSeq: 13, unread: 0, unreadMessages: 1 }

    SessionEnded:
      name: session.ended
      title: Kết nối sắp bị đóng
      summary: |
        `revoked`: phiên hay token bị thu hồi (đổi vai trò, đăng xuất, đổi mật khẩu ở thiết bị khác); `locked`: tài khoản bị khóa; `expired`: hết
        `maxAgeSeconds` (nối lại ngay bằng vé mới); `replaced`: quá 10 kết nối, kết nối cũ nhất bị đóng. Với `revoked`, `locked` web hỏi server của
        nó phiên còn không (làm mới token một lần) rồi nối lại hay về trang đăng nhập.
      payload: { $ref: "#/components/schemas/SessionEndedPayload" }
      x-slice: 13d
      examples:
        - name: biKhoa
          payload: { reason: locked }

    TokenRevoked:
      name: token.revoked
      title: Một lần thu hồi token
      summary: |
        Thu hồi mọi token của một người có `tv` nhỏ hơn `minTokenVersion`, hay mọi token của một phiên (`sessionId`). Đúng một trong hai trường
        khác null. Không có lý do của admin, không email; `cause` là mã.
      payload: { $ref: "#/components/schemas/TokenRevokedPayload" }
      x-slice: 13b
      examples:
        - name: khoaTaiKhoan
          payload: { userId: 3f1c9a52-7b1e-4d8a-9c41-0e5b2d7f6a10, sessionId: null, minTokenVersion: 4, cause: lock, at: "2026-11-09T12:10:00.000Z" }
        - name: dangXuatMotThietBi
          payload: { userId: 3f1c9a52-7b1e-4d8a-9c41-0e5b2d7f6a10, sessionId: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f, minTokenVersion: null, cause: logout, at: "2026-11-09T12:11:00.000Z" }

  schemas:
    Counts:
      type: object
      additionalProperties: false
      description: Các số trên menu và chuông, như `Summary` của social.yaml 0.3.0 (kèm `unreadMessages`).
      required: [unreadNotifications, incomingRequests, unreadMessages, latestNotificationAt]
      properties:
        unreadNotifications: { type: integer, minimum: 0 }
        incomingRequests: { type: integer, minimum: 0 }
        unreadMessages: { type: integer, minimum: 0 }
        latestNotificationAt: { type: [string, "null"], format: date-time }

    ReadyPayload:
      type: object
      additionalProperties: false
      required: [serverTime, maxAgeSeconds, counts]
      properties:
        serverTime: { type: string, format: date-time }
        maxAgeSeconds: { type: integer, minimum: 60, maximum: 86400 }
        counts: { $ref: "#/components/schemas/Counts" }

    MessageCreatedPayload:
      type: object
      additionalProperties: false
      required: [conversation, message, unreadMessages]
      properties:
        conversation: { $ref: "../openapi/social.yaml#/components/schemas/ConversationSummary" }
        message: { $ref: "../openapi/social.yaml#/components/schemas/Message" }
        unreadMessages: { type: integer, minimum: 0 }

    ConversationUpdatedPayload:
      type: object
      additionalProperties: false
      required: [change, conversation, unreadMessages]
      properties:
        change: { type: string, enum: [created, added_me, renamed, members_changed, owner_changed] }
        conversation: { $ref: "../openapi/social.yaml#/components/schemas/ConversationSummary" }
        unreadMessages: { type: integer, minimum: 0 }

    ConversationRemovedPayload:
      type: object
      additionalProperties: false
      required: [conversationId, reason, unreadMessages]
      properties:
        conversationId: { type: string, format: uuid }
        reason: { type: string, enum: [left, removed] }
        unreadMessages: { type: integer, minimum: 0 }

    ConversationReadPayload:
      type: object
      additionalProperties: false
      required: [conversationId, lastReadSeq, unread, unreadMessages]
      properties:
        conversationId: { type: string, format: uuid }
        lastReadSeq: { type: integer, minimum: 0 }
        unread: { type: integer, minimum: 0, maximum: 99 }
        unreadMessages: { type: integer, minimum: 0 }

    SessionEndedPayload:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [revoked, locked, expired, replaced] }

    TokenRevokedPayload:
      type: object
      additionalProperties: false
      required: [userId, sessionId, minTokenVersion, cause, at]
      properties:
        userId: { type: string, format: uuid }
        sessionId: { type: [string, "null"], format: uuid }
        minTokenVersion: { type: [integer, "null"], minimum: 1 }
        cause: { type: string, enum: [lock, moderation_ban, role_change, logout_all, password_reset, password_change, logout, refresh_reuse] }
        at: { type: string, format: date-time }
