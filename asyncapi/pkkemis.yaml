        tác giả (người nhận XP). `awardId` là mã quyết định của cặp (người bỏ phiếu, câu), không lộ ai bỏ phiếu. `score` là điểm (tán thành trừ
        không tán thành) sau phiếu này, để dành cho thành tích Cộng đồng sau này.
      contentType: application/cloudevents+json
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload: { $ref: "#/components/schemas/CommunityReplyUpvotedEvent" }
      bindings:
        kafka:
          key: { $ref: "#/components/schemas/UserKey" }
          bindingVersion: "0.5.0"
      x-producer: social
      x-consumers: [learning]
      x-slice: 12e
      examples:
        - name: tanThanh
          summary: Câu trả lời của Gia Huy nhận phiếu tán thành thứ 5
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
          payload:
            specversion: "1.0"
            id: 019a2b03-3e4f-7a50-8c6d-7e8f9a0b1c23
            source: /social
            type: community.reply_upvoted
            time: "2026-10-16T12:40:00.000Z"
            subject: 8c9d0e1f-2a3b-4c4d-9e5f-6a7b8c9d0e1f
            datacontenttype: application/json
            data:
              awardId: 9a0b1c2d-3e4f-4a5b-8c6d-7e8f9a0b1c2d
              threadId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
              replyId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
              authorId: 8c9d0e1f-2a3b-4c4d-9e5f-6a7b8c9d0e1f
              upvotedAt: "2026-10-16T12:40:00.000Z"
              score: 5
              xpEligible: true
              ineligibleReason: null
        - name: nguoiBoPhieuMoi
          summary: Người bỏ phiếu có tài khoản dưới 7 ngày (phiếu vẫn tính vào điểm, không có XP)
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
          payload:
            specversion: "1.0"
            id: 019a2b04-4f5a-7b61-9d7e-8f9a0b1c2d34
            source: /social
            type: community.reply_upvoted
            time: "2026-10-16T12:45:00.000Z"
            subject: 8c9d0e1f-2a3b-4c4d-9e5f-6a7b8c9d0e1f
            datacontenttype: application/json
            data:
              awardId: 0b1c2d3e-4f5a-4b6c-9d7e-8f9a0b1c2d3e
              threadId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
              replyId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
              authorId: 8c9d0e1f-2a3b-4c4d-9e5f-6a7b8c9d0e1f
              upvotedAt: "2026-10-16T12:45:00.000Z"
              score: 6
              xpEligible: false
              ineligibleReason: voter_new_account

    ModerationBanRequested:
      name: moderation.ban_requested
      title: Kiểm duyệt đề nghị khóa tài khoản
      summary: |
        Admin chọn "Khóa tài khoản" ở trang kiểm duyệt Cộng đồng. identity khóa (như khóa bằng tay ở `/admin/users`). `subject` = người bị
        khóa. Chỉ mã lý do; lời admin viết không bao giờ đi vào sự kiện.
      contentType: application/cloudevents+json
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload: { $ref: "#/components/schemas/ModerationBanRequestedEvent" }
      bindings:
        kafka:
          key: { $ref: "#/components/schemas/UserKey" }
          bindingVersion: "0.5.0"
      x-producer: social
      x-consumers: [identity]
      x-slice: 12c
      examples:
        - name: khoaTaiKhoan
          summary: Khóa một tài khoản đăng nội dung người lớn nhiều lần
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
          payload:
            specversion: "1.0"
            id: 019a2b05-5a6b-7c72-8e8f-9a0b1c2d3e45
            source: /social
            type: moderation.ban_requested
            time: "2026-10-17T02:00:00.000Z"
            subject: 6d7e8f9a-0b1c-4d2e-8f3a-4b5c6d7e8f9a
            datacontenttype: application/json
            data:
              actionId: 1e2f3a4b-5c6d-4e7f-9a8b-0c1d2e3f4a5b
              userId: 6d7e8f9a-0b1c-4d2e-8f3a-4b5c6d7e8f9a
              requestedBy: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b6c
              reasonCode: adult
              requestedAt: "2026-10-17T02:00:00.000Z"

    DeadLetter:
      name: dead_letter
      title: Bản ghi bị bỏ cuộc
      summary: Nguyên bản ghi gốc (khóa và giá trị không đổi) kèm các header `pk-dlq-*` cho biết ai bỏ cuộc và vì sao.
      contentType: application/cloudevents+json
      headers: { $ref: "#/components/schemas/DeadLetterHeaders" }
      payload:
        description: |
          Giá trị của bản ghi gốc, không đổi một byte. Thường là một CloudEvent của topic gốc; khi `pk-dlq-reason` là `invalid_envelope`
          thì có thể không phải JSON.
      x-slice: 8e

  schemas:
    UserKey:
      type: string
      format: uuid
      description: Khóa bản ghi Kafka = `subject` của sự kiện = mã người dùng (UUID do identity cấp), viết thường.

    EventHeaders:
      type: object
      description: Header của bản ghi Kafka (giá trị là chuỗi UTF-8).
      required: [content-type]
      properties:
        content-type:
          type: string
          const: application/cloudevents+json; charset=UTF-8
        traceparent:
          type: string
          pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
          description: Có thì bằng thuộc tính `traceparent` của phong bì (để công cụ truy vết đọc được mà không mở giá trị).

    DeadLetterHeaders:
      type: object
      description: Header của bản ghi trong `<topic>.dlq`. Header gốc (nếu có) giữ nguyên, thêm các header dưới đây; mọi giá trị là chuỗi UTF-8.
      required: [pk-dlq-group, pk-dlq-consumer, pk-dlq-reason, pk-dlq-attempts, pk-dlq-original-topic, pk-dlq-original-partition, pk-dlq-original-offset, pk-dlq-failed-at]
      properties:
        content-type: { type: string }
        traceparent: { type: string }
        pk-dlq-group: { type: string, description: "Nhóm đọc bỏ cuộc, ví dụ `learning`." }
        pk-dlq-consumer: { type: string, description: "Bộ xử lý trong nhóm, ví dụ `learning.people`." }
        pk-dlq-reason:
          type: string
          enum: [invalid_envelope, handler_failed, rejected]
          description: |
            `invalid_envelope`: không phải JSON, không phải CloudEvents 1.0, thiếu `id`/`type`/`subject` (không thử lại).
            `handler_failed`: bộ xử lý vẫn lỗi sau mọi lần thử lại trong khi cơ sở dữ liệu của bên nghe vẫn trả lời.
            `rejected` (0.2.0): phong bì đúng nhưng bên nghe từ chối theo luật của nó, không thử lại (ví dụ commerce nhận `xp.awarded` có `source`
            khác `/learning`, `subject` khác `data.userId`, hay số XP ngoài khoảng cho phép). Người xem quyết định gửi lại hay bỏ.
        pk-dlq-error: { type: string, maxLength: 1000, description: "Thông điệp lỗi cuối, không chứa giá trị của sự kiện." }
        pk-dlq-attempts: { type: string, pattern: "^[0-9]+$", description: Số lần đã thử (số thập phân). }
        pk-dlq-original-topic: { type: string }
        pk-dlq-original-partition: { type: string, pattern: "^[0-9]+$" }
        pk-dlq-original-offset: { type: string, pattern: "^[0-9]+$" }
        pk-dlq-failed-at: { type: string, format: date-time }

    CloudEventEnvelope:
      type: object
      description: |
        Phong bì CloudEvents 1.0 (structured mode, JSON). Thứ tự khóa trong JSON không có nghĩa. Thuộc tính mở rộng khác ngoài `traceparent`
        chưa dùng; thêm là bản thêm của hợp đồng.
      additionalProperties: false
      required: [specversion, id, source, type, time, subject, datacontenttype, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id:
          type: string
          format: uuid
          description: |
            Mã sự kiện, duy nhất trên mọi topic; bên nghe chống trùng theo nó. Bên phát sinh lúc ghi outbox (UUID v7 khuyên dùng để có thứ
            tự thời gian; v4 cũng hợp lệ), gửi lại vẫn là mã đó. Riêng `xp.awarded`: bằng `data.awardId`.
        source:
          type: string
          pattern: "^/[a-z]+$"
          description: Service phát, dạng `/<service>` (`/identity`, `/learning`, `/commerce`; từ 0.3.0 `/classroom`, `/social`).
        type:
          type: string
          pattern: "^[a-z_]+(\\.[a-z_0-9]+)+$"
          description: Loại sự kiện, ví dụ `user.registered`. Không có tiền tố tên miền vì broker chỉ của PkKemis.
        time:
          type: string
          format: date-time
          description: Lúc thay đổi xảy ra ở bên phát (giờ của giao dịch ghi, UTC, có `Z`), không phải lúc gửi lên Kafka.
        subject:
          type: string
          format: uuid
          description: |
            Mã người dùng mà sự kiện nói tới; bằng khóa bản ghi Kafka. Riêng `classroom.events` (0.3.0, `x-subject: class` ở kênh): mã lớp, để
            mọi sự kiện của một lớp đến đúng thứ tự.
        datacontenttype: { type: string, const: application/json }
        traceparent:
          type: string
          pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
          description: W3C Trace Context của yêu cầu sinh ra sự kiện (phần mở rộng distributed tracing của CloudEvents). Tùy chọn; chưa service nào có truy vết ở M8.
        data:
          type: object
          description: Nội dung theo `type`, xem từng sự kiện.

    Role:
      type: string
      enum: [student, teacher, admin]
      description: Như `Role` của identity.yaml.

    UserSnapshot:
      type: object
      description: |
        Hồ sơ công khai của một người sau thay đổi, đủ để bên giữ bản sao ghi đè cả dòng. Cùng nghĩa với `UserSummary` của
        `POST /internal/users/batch` (identity.yaml 0.7.0), cộng `version`.
      additionalProperties: false
      required: [userId, fullName, avatarUrl, role, locked, hideFromLeaderboard, version]
      properties:
        userId: { type: string, format: uuid, description: Bằng `subject`. }
        fullName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: [string, "null"], maxLength: 500 }
        role: { $ref: "#/components/schemas/Role" }
        locked: { type: boolean }
        hideFromLeaderboard: { type: boolean }
        version:
          type: integer
          format: int64
          minimum: 0
          description: |
            Phiên bản hồ sơ công khai, tăng đúng 1 mỗi lần một trường của ảnh chụp này đổi (tài khoản có trước M8 bắt đầu từ 0, tài khoản mới
            là 1 lúc đăng ký). Bên giữ bản sao chỉ ghi khi `version` ≥ bản đang có; bằng nhau là cùng nội dung. Cùng số với `version` của
            `/internal/users/batch`, nên hai đường làm mới không ghi đè nhau bằng bản cũ.
        createdAt:
          type: string
          format: date-time
          description: |
            0.3.0 (identity 0.8.0, lát 10a): lúc tài khoản được tạo (ngày tham gia; social dùng cho giới hạn lời mời của tài khoản dưới 7 ngày).
            Không đổi nên không làm tăng `version`. Tùy chọn trong schema vì sự kiện cũ không có; identity từ 0.8.0 luôn gửi.

    UserRegisteredData:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserSnapshot" }

    UserProfileUpdatedData:
      type: object
      additionalProperties: false
      required: [user, changed]
      properties:
        user: { $ref: "#/components/schemas/UserSnapshot" }
        changed:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [fullName, avatarUrl] }
          description: Trường nào đổi trong lần này.

    UserRoleChangedData:
      type: object
      additionalProperties: false
      required: [user, previousRole]
      properties:
        user: { $ref: "#/components/schemas/UserSnapshot" }
        previousRole: { $ref: "#/components/schemas/Role" }

    UserLockedData:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserSnapshot" }

    UserUnlockedData:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserSnapshot" }

    UserPrivacyUpdatedData:
      type: object
      additionalProperties: false
      required: [user, changed]
      properties:
        user: { $ref: "#/components/schemas/UserSnapshot" }
        changed:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [hideFromLeaderboard] }
          description: |
            Quyền nào đổi. Từ M10 (0.3.0) quyền riêng tư của trang cá nhân (tiến độ, thành tích, danh sách bạn, lời mời, tin nhắn, trả lời) ở
            social (social.yaml `/v1/me/privacy`), nên ở đây vẫn chỉ có `hideFromLeaderboard` (M10-SOCIAL.md mục 2).

    XpSource:
      type: string
      enum: [exercise, exam, lesson, lesson_practice, quick, review, class_work, community_answer, community_vote]
      description: |
        Nguồn XP, bằng `xp_events.source`: `exercise` bộ bài tập, `exam` đề, `lesson` hoàn thành bài học (+50), `lesson_practice` Luyện tập
        nhanh của bài, `quick` luyện nhanh, `review` ôn sổ lỗi sai, `class_work` bài của lớp (classroom gửi qua `/internal/class-work-results`).
        0.4.0 (M12, lát `12b`): `community_answer` câu trả lời được người hỏi chọn (+20), `community_vote` câu trả lời, bình luận được tán thành
        (+2, tối đa 50 mỗi ngày); learning ghi từ `social.events`. Sau này thêm `arena` (bản thêm). Bên nghe gặp giá trị lạ thì bỏ qua sự kiện
        và ghi log (commerce không đổi XP lạ ra Xu).

    XpAwardedData:
      type: object
      additionalProperties: false
      required: [awardId, userId, amount, source, refId, awardedAt]
      properties:
        awardId:
          type: string
          format: uuid
          description: Mã dòng `xp_events`, bằng `id` của sự kiện. Commerce (M9) chống cộng Xu hai lần theo mã này (`source_ref = xp:<awardId>`).
        userId: { type: string, format: uuid, description: Bằng `subject`. }
        amount: { type: integer, minimum: 1, description: Số XP đã cộng (sau trần ngày). }
        source: { $ref: "#/components/schemas/XpSource" }
        refId:
          type: string
          minLength: 1
          maxLength: 100
          description: Thứ đem lại XP, bằng `xp_events.ref_id` (mã lượt làm của learning, mã bài học, mã lượt làm bài lớp của classroom).
        awardedAt: { type: string, format: date-time, description: Bằng `xp_events.created_at` và `time` của phong bì. }
        itemId:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            0.2.0 (lát 9a, tùy chọn): mã thứ người học làm (bộ bài tập, đề, bài học, bài của lớp), khác `refId` (mã lượt làm). Có khi learning biết:
            `exercise`, `exam`: mã bộ hay đề; `lesson`, `lesson_practice`: mã bài học; `class_work`: mã bài của lớp. `quick`, `review`: không có.
            `community_answer`, `community_vote` (0.4.0): mã bài Cộng đồng (`refId` là câu trả lời, bình luận).
            Commerce chép sang dòng sổ cái để web hiện tên ("Bộ bài tập · …") mà commerce không cần biết tên.

    UserRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: user.registered }
            source: { const: /identity }
            data: { $ref: "#/components/schemas/UserRegisteredData" }

    UserProfileUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: user.profile_updated }
            source: { const: /identity }
            data: { $ref: "#/components/schemas/UserProfileUpdatedData" }

    UserRoleChangedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: user.role_changed }
            source: { const: /identity }
            data: { $ref: "#/components/schemas/UserRoleChangedData" }

    UserLockedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: user.locked }
            source: { const: /identity }
            data: { $ref: "#/components/schemas/UserLockedData" }

    UserUnlockedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: user.unlocked }
            source: { const: /identity }
            data: { $ref: "#/components/schemas/UserUnlockedData" }

    UserPrivacyUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: user.privacy_updated }
            source: { const: /identity }
            data: { $ref: "#/components/schemas/UserPrivacyUpdatedData" }

    XpAwardedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: xp.awarded }
            source: { const: /learning }
            data: { $ref: "#/components/schemas/XpAwardedData" }

    LedgerKind:
      type: string
      enum: [earn, topup, spin, refund, purchase, fee, prize, attempt, adjustment, grant]
      description: Như `LedgerKind` của openapi/commerce.yaml.

    WalletChangedData:
      type: object
      additionalProperties: false
      required: [entryId, userId, kind, amount, balanceAfter, sourceRef, at]
      properties:
        entryId: { type: string, pattern: "^[0-9]+$", description: "Mã dòng sổ cái (số nguyên tăng dần, dạng chuỗi)." }
        userId: { type: string, format: uuid, description: Chủ ví; bằng `subject`. }
        kind: { $ref: "#/components/schemas/LedgerKind" }
        amount: { type: integer, format: int64, not: { const: 0 }, description: "Dương là vào, âm là ra." }
        balanceAfter: { type: integer, format: int64, minimum: 0 }
        sourceRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Khóa nguồn duy nhất của dòng (`xp:<awardId>`, `spin:<mã>`, `spin-refund:<mã>`, `purchase:<mã>`, `topup:<mã đơn>`, `attempt:<mã>`, `adjust:<mã>`, `opening:<mã người dùng>`…).
        at: { type: string, format: date-time }

    FrameEquippedData:
      type: object
      additionalProperties: false
      required: [userId, frameId, previousFrameId, version, equippedAt]
      properties:
        userId: { type: string, format: uuid, description: Bằng `subject`. }
        frameId: { type: [string, "null"], maxLength: 100, description: Khung đang đeo sau thay đổi; null là đã tháo. }
        previousFrameId: { type: [string, "null"], maxLength: 100 }
        version:
          type: integer
          format: int64
          minimum: 1
          description: Tăng 1 mỗi lần khung đang đeo của người này đổi. Bên giữ bản sao chỉ ghi khi `version` ≥ bản đang có.
        equippedAt: { type: string, format: date-time }

    OrderPaidData:
      type: object
      additionalProperties: false
      required: [orderCode, userId, purpose, coins, priceVnd, provider, paidAt]
      properties:
        orderCode: { type: string, pattern: "^PK[0-9]{6}-[0-9]{6}$" }
        userId: { type: string, format: uuid, description: Người mua; bằng `subject`. }
        purpose: { type: string, enum: [top_up] }
        coins: { type: integer, minimum: 1, description: Xu đã vào ví. }
        priceVnd: { type: integer, minimum: 1 }
        provider: { type: string, enum: [fake] }
        paidAt: { type: string, format: date-time }

    WalletChangedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: wallet.changed }
