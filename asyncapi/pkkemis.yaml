  # ---------------------------------------------------------------- 0.4.0 (M12)

  socialPublishesCommunityEvents:
    action: send
    channel: { $ref: "#/channels/socialEvents" }
    title: social phát lần chọn câu trả lời và lần tán thành đầu tiên (XP Cộng đồng)
    description: |
      Ghi outbox là bước cuối của giao dịch chọn câu trả lời (đã khóa dòng câu hỏi) hay bỏ phiếu (đã khóa dòng câu trả lời). Cùng giao dịch,
      social ghi một dòng quyết định XP (`community_accept_awards` mỗi câu hỏi một dòng; `community_vote_awards` mỗi người bỏ phiếu và câu trả
      lời một dòng), nên mỗi nguyên nhân đúng một sự kiện. `community.reply_upvoted` chỉ cho lần tán thành **đầu tiên** của một người với một
      câu (rút rồi tán thành lại không phát) và chỉ khi phiếu được tính (người bị tác giả chặn: không phát). `xpEligible` theo luật chống farm
      của M12-COMMUNITY.md mục 8; số XP không có ở đây (learning giữ).
    messages:
      - $ref: "#/channels/socialEvents/messages/communityAnswerAccepted"
      - $ref: "#/channels/socialEvents/messages/communityReplyUpvoted"
    bindings:
      kafka:
        clientId: { type: string, const: social }
        bindingVersion: "0.5.0"
    x-service: social
    x-slice: 12e

  socialPublishesModerationEvents:
    action: send
    channel: { $ref: "#/channels/socialEvents" }
    title: social đề nghị identity khóa tài khoản
    description: |
      Ghi outbox cùng giao dịch với dòng nhật ký `ban` (`moderation_actions`), sau khi kiểm người gọi là admin (token và bản sao `members`) và
      người bị khóa không phải admin. Không có lý do chữ của admin, chỉ mã lý do.
    messages:
      - $ref: "#/channels/socialEvents/messages/moderationBanRequested"
    bindings:
      kafka:
        clientId: { type: string, const: social }
        bindingVersion: "0.5.0"
    x-service: social
    x-slice: 12c

  learningReceivesCommunityEvents:
    action: receive
    channel: { $ref: "#/channels/socialEvents" }
    title: learning ghi XP Cộng đồng
    description: |
      Nhóm đọc `learning` (bộ xử lý `learning.community`), từ đầu topic khi nhóm chưa có vị trí; bỏ qua `friend.*`, `user.*`,
      `moderation.*` và loại lạ. Mỗi sự kiện một giao dịch: `processed_events`; kiểm `source` = `/social`, `subject` = người nhận XP
      (`answererId`, `authorId`), sai thì DLQ `rejected`. `xpEligible: false`, người nhận không phải học sinh hay bị khóa theo bản sao `people`:
      chỉ ghi nhận. Còn lại `XpLedger.award` (khóa XP của người đó): `community.answer_accepted` +20 nguồn `community_answer`, khóa chống lặp
      `community_answer:<threadId>` (mỗi câu hỏi tối đa một lần, kể cả khi social lỡ gửi hai sự kiện đủ điều kiện), trần 60 XP mỗi ngày giờ Việt
      Nam; `community.reply_upvoted` +2 nguồn `community_vote`, khóa `community_vote:<awardId>`, trần 50 XP mỗi ngày (phần vượt trần không cộng,
      không bù). Hai nguồn này không tính là ngày học (chuỗi, mốc chuỗi). `xp.awarded` phát như mọi lần cộng XP (commerce đổi Xu theo cấu
      hình của nó).
    messages:
      - $ref: "#/channels/socialEvents/messages/communityAnswerAccepted"
      - $ref: "#/channels/socialEvents/messages/communityReplyUpvoted"
    bindings:
      kafka:
        groupId: { type: string, const: learning }
        clientId: { type: string, const: learning }
        bindingVersion: "0.5.0"
    x-service: learning
    x-slice: 12b

