    channel: { $ref: "#/channels/socialEventsDlq" }
    title: learning bỏ cuộc một sự kiện của social
    messages:
      - $ref: "#/channels/socialEventsDlq/messages/deadLetter"
    bindings:
      kafka:
        clientId: { type: string, const: learning }
        bindingVersion: "0.5.0"
    x-service: learning
    x-slice: 12b

  identityReceivesModerationEvents:
    action: receive
    channel: { $ref: "#/channels/socialEvents" }
    title: identity khóa tài khoản theo đề nghị của kiểm duyệt
    description: |
      Nhóm đọc `identity` (mới; Spring Kafka như commerce, bảng `processed_events` cùng cột M8 mục 6), từ đầu topic khi nhóm chưa có vị trí;
      bỏ qua mọi loại khác `moderation.ban_requested`. Mỗi sự kiện một giao dịch: `processed_events`; kiểm `source` = `/social`, `subject` =
      `data.userId`, `requestedBy` đang là admin; người bị khóa là admin (hay admin cuối cùng) thì DLQ `rejected`. Tài khoản đã khóa: chỉ ghi
      nhận. Còn lại khóa như `POST /v1/admin/users/{userId}/lock` (thu hồi refresh token, `version` + 1, phát `user.locked` cùng giao dịch),
      nhật ký `ACCOUNT_LOCKED` với người làm là `requestedBy`, `detail.source = community`, `moderationActionId`, `reasonCode`.
    messages:
      - $ref: "#/channels/socialEvents/messages/moderationBanRequested"
    bindings:
      kafka:
        groupId: { type: string, const: identity }
        clientId: { type: string, const: identity }
        bindingVersion: "0.5.0"
    x-service: identity
    x-slice: 12f

  identityDeadLettersSocialEvents:
    action: send
    channel: { $ref: "#/channels/socialEventsDlq" }
    title: identity bỏ cuộc một sự kiện của social
    messages:
      - $ref: "#/channels/socialEventsDlq/messages/deadLetter"
    bindings:
      kafka:
        clientId: { type: string, const: identity }
        bindingVersion: "0.5.0"
    x-service: identity
    x-slice: 12f

components:
  securitySchemes:
    kafkaScram:
      type: scramSha512
      description: |
        Từ lát 9.0: SASL/SCRAM-SHA-512 trên listener `SASL_PLAINTEXT` của mạng Compose (chưa có TLS: chỉ chạy trong máy này). Mỗi service một
        tài khoản, mật khẩu ở `.env` của platform; biến của service: `KAFKA_SECURITY_PROTOCOL`, `KAFKA_SASL_MECHANISM`, `KAFKA_SASL_USERNAME`,
        `KAFKA_SASL_PASSWORD`.

  messages:
    UserRegistered:
      name: user.registered
      title: Tài khoản mới
      summary: Một người vừa đăng ký (học sinh hoặc giáo viên). Admin không tự đăng ký nên không có sự kiện này cho admin.
      contentType: application/cloudevents+json
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload: { $ref: "#/components/schemas/UserRegisteredEvent" }
      bindings:
        kafka:
          key: { $ref: "#/components/schemas/UserKey" }
          bindingVersion: "0.5.0"
      x-producer: identity
      x-consumers: [learning, social]
      x-slice: 8d
      examples:
        - name: hocSinhMoi
          summary: Học sinh mới đăng ký
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
          payload:
            specversion: "1.0"
