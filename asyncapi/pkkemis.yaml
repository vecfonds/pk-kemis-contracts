      (không bù XP cũ) hay `data.source` không đổi ra Xu; còn lại khóa dòng ví (tạo nếu chưa có), cộng phần nguyên của (phần dư + XP) / 5 Xu
      bằng một dòng `earn` có khóa nguồn `xp:<awardId>` duy nhất, giữ phần dư. Số XP ngoài khoảng hợp lệ của commerce thì vào DLQ với lý do
