    # ---------------------------------------------------------------- 0.4.0 (M12)

    CommunityAnswerAcceptedData:
      type: object
      additionalProperties: false
      required: [threadId, replyId, answererId, acceptedAt, xpEligible, ineligibleReason]
      properties:
        threadId: { type: string, format: uuid, description: Câu hỏi. learning chống cộng hai lần theo mã này (`community_answer:<threadId>`). }
        replyId: { type: string, format: uuid, description: Câu trả lời được chọn. }
        answererId: { type: string, format: uuid, description: Người trả lời; bằng `subject`. }
        acceptedAt: { type: string, format: date-time }
        xpEligible:
          type: boolean
          description: social quyết lần chọn này có được XP không (M12-COMMUNITY.md mục 8); learning chỉ cộng khi true, theo số và trần của nó.
        ineligibleReason:
          type: [string, "null"]
          enum: [repeat, not_student, pair_limit, null]
          description: |
            Null khi `xpEligible`. `repeat`: câu hỏi đã có lần chọn trước (chỉ lần đầu có XP); `not_student`: người trả lời là giáo viên hay
            admin; `pair_limit`: cùng người hỏi đã cho cùng người trả lời một lần chọn có XP trong 7 ngày.

    CommunityReplyUpvotedData:
      type: object
      additionalProperties: false
      required: [awardId, threadId, replyId, authorId, upvotedAt, score, xpEligible, ineligibleReason]
      properties:
        awardId:
          type: string
          format: uuid
          description: Mã quyết định của cặp (người bỏ phiếu, câu), duy nhất mãi; learning chống cộng hai lần theo mã này (`community_vote:<awardId>`).
        threadId: { type: string, format: uuid }
        replyId: { type: string, format: uuid }
        authorId: { type: string, format: uuid, description: "Tác giả câu trả lời, bình luận; bằng `subject`." }
        upvotedAt: { type: string, format: date-time }
        score: { type: integer, description: Tán thành trừ không tán thành sau phiếu này. }
        xpEligible: { type: boolean }
        ineligibleReason:
          type: [string, "null"]
          enum: [not_student, voter_new_account, pair_limit, null]
          description: |
            Null khi `xpEligible`. `not_student`: tác giả là giáo viên hay admin; `voter_new_account`: người bỏ phiếu có tài khoản dưới 7 ngày;
            `pair_limit`: người bỏ phiếu đã cho tác giả này 5 phiếu có XP hôm nay (giờ Việt Nam).

    ModerationBanRequestedData:
      type: object
      additionalProperties: false
      required: [actionId, userId, requestedBy, reasonCode, requestedAt]
      properties:
        actionId: { type: string, format: uuid, description: Mã dòng nhật ký `ban` ở social; identity ghi vào `detail.moderationActionId`. }
        userId: { type: string, format: uuid, description: Người bị khóa; bằng `subject`. }
        requestedBy: { type: string, format: uuid, description: Admin bấm khóa (identity kiểm người này còn là admin). }
        reasonCode:
          type: string
          enum: [offensive, bullying, adult, spam, cheating, wrong_chemistry, personal_info, other]
          description: Như `ReportReason` của social.yaml. Không có lời admin viết.
        requestedAt: { type: string, format: date-time }

    CommunityAnswerAcceptedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: community.answer_accepted }
            source: { const: /social }
            data: { $ref: "#/components/schemas/CommunityAnswerAcceptedData" }

